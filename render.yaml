# One-click deploy on Render: New -> Blueprint -> pick this repo.
# Party Royale (party-royale/) is the movie night + music battle party game.
services:
  - type: web
    name: party-royale
    runtime: node
    plan: free
    rootDir: party-royale
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/config
    envVars:
      - key: TMDB_API_KEY
        sync: false
