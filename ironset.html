/* ----------------------------------------------------------------------------
   STRENGTH ENGINE
   Everything keys off one idea: an RPE-anchored set tells you how far from
   failure you were. RIR = 10 - RPE, so a set of `reps` at a given RPE is
   equivalent to doing `reps + RIR` reps to true failure. That single "reps to
   failure" number maps to a % of 1RM via the standard RPE/RTS chart. From there
   we can both estimate a 1RM from any set, and predict a weight for any target.
---------------------------------------------------------------------------- */

// % of 1RM for N reps taken to true failure (RPE 10). Standard RTS values.
const PCT = {
  1: 100.0, 2: 95.5, 3: 92.2, 4: 89.2, 5: 86.3, 6: 83.7, 7: 81.1, 8: 78.6,
  9: 76.2, 10: 73.9, 11: 70.7, 12: 68.0, 13: 65.3, 14: 62.6, 15: 59.9,
  16: 57.3, 17: 54.8, 18: 52.4, 19: 50.0, 20: 47.6,
};
function pctForN(n) {
  if (n <= 1) return 100;
  if (n >= 20) return PCT[20];
  const lo = Math.floor(n), hi = Math.ceil(n);
  if (lo === hi) return PCT[lo];
  return PCT[lo] + (PCT[hi] - PCT[lo]) * (n - lo); // linear interp for half-RPEs
}
const repsToFailure = (reps, rpe) => reps + Math.max(0, 10 - rpe);
// Observed estimated 1RM from a completed set.
function e1rmFromSet(weight, reps, rpe) {
  return weight / (pctForN(repsToFailure(reps, rpe)) / 100);
}
// Predict the weight for a prescribed (reps, rpe) given an estimated 1RM.
function weightForTarget(e1rm, reps, rpe) {
  return e1rm * (pctForN(repsToFailure(reps, rpe)) / 100);
}
// Confidence that a set's RPE rating is accurate. Near failure you can clearly feel
// "one, maybe two left"; on light sets the reps-in-reserve guess is fuzzy and can be off
// by a full point or more, so those sets should barely move the 1RM estimate. This is
// why a heavy RPE 9 set outweighs a light RPE 5 one even when the light set is newer.
function rpeConfidence(rpe) {
  return 0.2 + 0.8 * Math.max(0, Math.min(1, (rpe - 5) / 4)); // RPE5→.2, 7→.6, 8→.8, 9-10→1
}
// The rep→%1RM table is sharp at low reps and frays as reps climb (rep-endurance varies
// a lot between lifters), so long sets are noisier predictors regardless of effort.
function repsAccuracy(reps) {
  return reps <= 5 ? 1 : Math.max(0.5, 1 - (reps - 5) * 0.05); // 5→1, 10→.75, 15→.5
}
// How much a logged set should move the estimate: heaviest weight on hard, low-rep sets.
function reliability(reps, rpe) {
  return repsAccuracy(reps) * rpeConfidence(rpe);
}
// Fatigue model. A set spends capacity in proportion to volume (reps) and how close
// to failure it was — effort grows steeply toward RPE 10, so a grind costs far more
// than an easy set. The per-lifter sensitivity K is learned from their own history.
const DEFAULT_FATIGUE_K = 0.027;
function fatigueEffort(rpe) {
  const p = Math.max(0, (Math.min(10, rpe) - 4) / 6); // RPE6→.11, 8→.44, 9.5→.84, 10→1
  return p * p;
}
function fatigueDrop(reps, rpe, k) {
  // Volume cost: reps × how close to failure the set was.
  const volume = k * Math.max(1, reps) * fatigueEffort(rpe);
  // Neural cost: a hard top set taxes the CNS beyond its rep count — biggest for heavy
  // low-rep work, fading as reps climb (where volume already accounts for it). This is
  // what keeps the first back-off off a heavy single/triple from landing too high.
  const effort = Math.max(0, Math.min(1, (Math.min(10, rpe) - 4) / 6)); // RPE7→.5, 8→.67, 10→1
  const neural = 0.15 * effort / (1 + 0.35 * (Math.max(1, reps) - 1));
  return Math.max(0, Math.min(0.34, volume + neural));
}
// Learn how fast THIS lifter's capacity falls across a session, from descending
// (back-off) steps: each step's implied-1RM drop ÷ the prior set's fatigue stimulus.
// Median is robust to noise; the result is shrunk toward the default so sparse data
// stays sane and it only drifts to a personal value once there's real evidence.
function learnDropScale(sets, k, forTop) {
  // How much THIS lifter actually drops on a given transition type, learned per lift.
  // Top-set→first-back-off and back-off→back-off are learned SEPARATELY (forTop), since
  // many lifters barely drop off their top set but descend through their chain. Every
  // observation counts: holding or gaining strength into a back-off is the strongest
  // possible evidence of minimal drop, not noise to discard.
  const byDay = {};
  for (const s of sets) { const d = new Date(s.ts).toDateString(); (byDay[d] = byDay[d] || []).push(s); }
  const scales = [];
  for (const d in byDay) {
    const day = byDay[d].slice().sort((a, b) => a.ts - b.ts);
    for (let i = 0; i < day.length - 1; i++) {
      const a = day[i], b = day[i + 1];
      if (!b.backoff) continue;                 // only transitions INTO a back-off
      if (!a.backoff !== forTop) continue;      // split: top→BO1 vs BO→BO
      const ea = e1rmFromSet(a.weight, a.reps, a.rpe), eb = e1rmFromSet(b.weight, b.reps, b.rpe);
      if (!(ea > 0) || !(eb > 0)) continue;
      const obs = 1 - eb / ea;
      if (obs > 0.35) continue;
      const pred = fatigueDrop(a.reps, a.rpe, k);
      if (pred < 0.015) continue;
      const sc = obs <= 0.001 ? 0.2 : obs / pred; // held/gained → strongest low-drop evidence
      if (sc < 2.6) scales.push(Math.max(0.2, sc));
    }
  }
  if (!scales.length) return forTop ? 1.15 : 1.05; // no history: stay a touch cautious
  scales.sort((x, y) => x - y);
  const med = scales[Math.floor(scales.length / 2)], n = scales.length, W0 = 3;
  const blended = (n * med + W0 * 1.0) / (n + W0);
  return Math.max(0.2, Math.min(1.9, blended));
}
// Inverse of pctForN: max reps achievable at a given %1RM (lets % training show a
// predicted RPE/RIR, so the two styles speak the same language).
function repsAtPct(pct) {
  if (pct >= 100) return 1;
  let prev = 1, prevP = pctForN(1);
  for (let n = 2; n <= 24; n++) {
    const p = pctForN(n);
    if (p <= pct) return prev + (prevP - pct) / (prevP - p || 1);
    prev = n; prevP = p;
  }
  return 24;
}
// Fold the whole (time-ordered) history into a learned 1RM + a trajectory.
function buildModel(sets, allSets) {
  const sorted = [...sets].sort((a, b) => a.ts - b.ts);
  const ctx = allSets || sets;
  const rsc = learnRecoveryScale(ctx);
  let e = null;
  const points = [];
  for (const s of sorted) {
    const obs = freshCorrect(e1rmFromSet(s.weight, s.reps, s.rpe), s, ctx, rsc);
    e = e == null ? obs : e + 0.35 * reliability(s.reps, s.rpe) * (obs - e);
    points.push({ ts: s.ts, value: e, obs });
  }
  const out = { e1rm: e, points, count: sorted.length };
  return out;
}

/* ----------------------------------------------------------------------------
   INSIGHT ENGINE — reads the data the app already has and turns it into plain
   reads. Pure local rules: strength trend, hidden gains from variations, RPE
   calibration, weak points. No AI/backend.
---------------------------------------------------------------------------- */
// A snapshot of everything logged today: which lifts, the top set on each, whether the
// session pushed any estimate to a new high, and total working/back-off set counts.
function sessionToday(state, models) {
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const t0 = start.getTime();
  const lifts = []; let totalSets = 0, backoffs = 0;
  for (const [name, ex] of Object.entries(state.exercises)) {
    const today = ex.sets.filter((s) => s.ts >= t0);
    if (!today.length) continue;
    const work = today.filter((s) => !s.backoff);
    const bo = today.filter((s) => s.backoff);
    totalSets += today.length; backoffs += bo.length;
    const pool = work.length ? work : today;
    const top = pool.reduce((a, b) => (b.weight > a.weight ? b : a), pool[0]);
    const m = models[name]; let e1rm = null, up = false;
    if (m && m.e1rm != null) {
      e1rm = m.e1rm; let before = null;
      for (const p of m.points) { if (p.ts < t0) before = p.value; else break; }
      up = before != null && e1rm - before > 0.5;
    }
    lifts.push({ name, top, e1rm, up, sets: today.length, bo: bo.length });
  }
  if (!lifts.length) return null;
  lifts.sort((a, b) => b.top.weight - a.top.weight);
  return { lifts, totalSets, backoffs, anyUp: lifts.some((l) => l.up) };
}

function analyze(state, models, unit) {
  const ex = state.exercises;
  const U = unit || "lb";
  const names = Object.keys(ex);
  const mains = names.filter((n) => !ex[n].parent);
  const now = Date.now(), DAY = 864e5;
  const r1 = (x) => fmt(Math.round(x));
  const valueAt = (pts, t) => { let v = null; for (const p of pts) { if (p.ts <= t) v = p.value; else break; } return v; };
  const out = [];
  const add = (sev, title, detail, scope) => out.push({ id: (scope || "g") + "|" + title, sev, title, detail });

  // projected total + per-lift estimates
  const find = (kw) => mains.find((n) => n.toLowerCase() === kw) || mains.find((n) => n.toLowerCase().includes(kw));
  const S = find("squat"), B = find("bench"), D = find("deadlift");
  const parts = mains.filter((n) => models[n] && models[n].e1rm != null).map((n) => {
    const m = models[n]; const ago = valueAt(m.points, now - 30 * DAY);
    return { name: n, e1rm: m.e1rm, delta: ago != null ? m.e1rm - ago : null };
  });
  let total = null, totalDelta = null;
  if (S && B && D && models[S].e1rm != null && models[B].e1rm != null && models[D].e1rm != null) {
    total = models[S].e1rm + models[B].e1rm + models[D].e1rm;
    totalDelta = [S, B, D].reduce((acc, n) => { const a = valueAt(models[n].points, now - 30 * DAY); return acc + (a != null ? models[n].e1rm - a : 0); }, 0);
  }

  for (const M of mains) {
    const m = models[M]; if (!m || m.e1rm == null) continue;
    const pts = m.points, latest = m.e1rm, lastTs = pts.length ? pts[pts.length - 1].ts : null;
    const priorMax = pts.length > 1 ? Math.max(...pts.slice(0, -1).map((p) => p.value)) : -Infinity;
    let prFired = false;
    if (pts.length >= 4 && latest > priorMax + 0.5 && lastTs && now - lastTs < 21 * DAY) {
      add("win", "New " + M + " high", "Your estimated " + M + " 1RM just hit a new high of " + r1(latest) + " " + U + ".", M); prFired = true;
    }
    const ago30 = valueAt(pts, now - 30 * DAY);
    if (ago30 != null && ago30 > 0) {
      const d = latest - ago30, pct = (d / ago30) * 100, thr = Math.max(2, ago30 * 0.015);
      if (!prFired && d > thr) add("win", M + " trending up", "Up " + r1(d) + " " + U + " (" + pct.toFixed(1) + "%) over the last 30 days.", M);
      else if (d < -thr) add("watch", M + " slipping", "Down " + r1(-d) + " " + U + " over 30 days — could be fatigue or a rough stretch.", M);
    }
    const kids = names.filter((n) => ex[n].parent === M);
    if (kids.length) {
      const ownM = m.own && m.own.e1rm;
      const recentKids = kids.filter((k) => ex[k].sets.some((s) => now - s.ts < 21 * DAY));
      const kidLabel = (recentKids.length ? recentKids : kids).join(" & ");
      if (ownM == null) add("win", M + " from variations", "You haven't done straight " + M + " lately — based on your " + kidLabel + ", your " + M + " 1RM is about " + r1(latest) + " " + U + ".", M);
      else if (latest > ownM * 1.02) add("win", "Hidden " + M + " strength", "Your " + kidLabel + " suggests your " + M + " 1RM is ~" + r1(latest - ownM) + " " + U + " higher than your recent straight " + M + " shows (" + r1(latest) + " vs " + r1(ownM) + ").", M);
    }
    if (lastTs && now - lastTs > 14 * DAY && pts.length >= 4) add("note", M + " has gone quiet", Math.round((now - lastTs) / DAY) + " days since your last " + M + " work.", M);
  }

  for (const V of names) {
    const x = ex[V]; if (!x.parent || !ex[x.parent] || typeof x.ratioManual === "number") continue;
    const mv = models[V], own = mv && mv.own && mv.own.e1rm, ownP = models[x.parent] && models[x.parent].own && models[x.parent].own.e1rm;
    if (!own || !ownP) continue;
    const r = mv.ratio, base = typeof x.ratio === "number" ? x.ratio : defaultRatio(V), lc = V.toLowerCase();
    const zone = /block|board|pin|lockout|rack/.test(lc) ? "lockout strength" : /pause|deficit|bottom|dead\s*stop|tempo/.test(lc) ? "bottom-end strength" : "that range";
    if (r > base + 0.03) add("win", V + " catching up", "Your " + V + " is now " + Math.round(r * 100) + "% of " + x.parent + " (was ~" + Math.round(base * 100) + "%) — " + zone + " is improving.", V);
    else if (r < base - 0.04) add("watch", V + " lagging", "Your " + V + " has dropped to " + Math.round(r * 100) + "% of " + x.parent + " — " + zone + " may be a weak point.", V);
  }

  const recSets = [];
  for (const n of names) for (const s of ex[n].sets) if (s.fromRec && typeof s.tRpe === "number" && now - s.ts < 49 * DAY) recSets.push(s);
  if (recSets.length >= 4) {
    const errs = recSets.map((s) => s.rpe - s.tRpe);
    const bias = errs.reduce((a, b) => a + b, 0) / errs.length;
    const mae = errs.reduce((a, b) => a + Math.abs(b), 0) / errs.length;
    if (mae <= 0.6 && recSets.length >= 6) add("note", "Your RPE is dialed in", "Across your last " + recSets.length + " prescribed sets you're within ±" + mae.toFixed(1) + " RPE of target — trust your top sets.", "rpe");
    else if (bias >= 0.5) add("note", "Sets landing harder than asked", "On average ~" + bias.toFixed(1) + " RPE above target — the model is nudging your loads down to match.", "rpe");
    else if (bias <= -0.5) add("note", "More in the tank than you think", "Sets land ~" + Math.abs(bias).toFixed(1) + " RPE easier than asked — the model is nudging loads up.", "rpe");
    else if (mae >= 1.2) add("note", "RPE calls are swingy", "Your effort ratings vary ±" + mae.toFixed(1) + " RPE — an occasional set to true failure will recalibrate your gauge.", "rpe");
  }

  if (S && B && D && models[S].e1rm && models[B].e1rm && models[D].e1rm) {
    const sq = models[S].e1rm, be = models[B].e1rm;
    if (be / sq < 0.58) add("watch", "Bench is your lagging lift", "Your bench is " + Math.round((be / sq) * 100) + "% of your squat (typical is ~65–75%) — likely the biggest lever on your total.", "bal");
  }

  const rank = { alert: 0, win: 1, watch: 2, note: 3 };
  out.sort((a, b) => rank[a.sev] - rank[b.sev]);
  const big = {
    squat: S ? { name: S, e1rm: models[S].e1rm } : null,
    bench: B ? { name: B, e1rm: models[B].e1rm } : null,
    deadlift: D ? { name: D, e1rm: models[D].e1rm } : null,
  };
  return { total, totalDelta, parts, insights: out.slice(0, 8), big, session: sessionToday(state, models) };
}

   SHARE CARDS — draw a clean, branded IRONSET image on a canvas (no deps,
   offline) and hand it to the iOS share sheet, with a save/preview fallback.
---------------------------------------------------------------------------- */
function _round(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function _barbell(ctx, cx, cy, width) {
  const half = width / 2;
  ctx.fillStyle = "#E23B2E";
  ctx.fillRect(cx - half, cy - 14, 11, 28);
  ctx.fillRect(cx + half - 11, cy - 14, 11, 28);
  ctx.fillStyle = "rgba(226,59,46,0.45)";
  ctx.fillRect(cx - half + 13, cy - 2, width - 26, 5);
}
function _wrap(ctx, text, x, y, maxW, lh) {
  const words = String(text).split(/\s+/);
  let line = "", yy = y;
  for (const w of words) {
    const t = line ? line + " " + w : w;
    if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line, x, yy); line = w; yy += lh; }
    else line = t;
  }
  if (line) { ctx.fillText(line, x, yy); yy += lh; }
  return yy;
}
function buildCard(p) {
  const W = 1080, H = 1350;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  const SANS = "'Helvetica Neue', Helvetica, Arial, sans-serif";
  const MON = "'Menlo','Monaco',monospace";
  ctx.fillStyle = "#06070B"; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W - 150, 220, 0, W - 150, 220, 560);
  g.addColorStop(0, "rgba(226,59,46,0.12)"); g.addColorStop(1, "rgba(226,59,46,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#2C313B"; ctx.lineWidth = 2;
  _round(ctx, 40, 40, W - 80, H - 80, 30); ctx.stroke();

  ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
  ctx.font = "800 48px " + SANS;
  ctx.fillStyle = "#ECEAE3"; ctx.fillText("IRON", 90, 158);
  const iw = ctx.measureText("IRON").width;
  ctx.fillStyle = "#E23B2E"; ctx.fillText("SET", 90 + iw, 158);

  if (p.type === "stat") {
    ctx.textAlign = "center";
    ctx.fillStyle = "#929AA6"; ctx.font = "800 34px " + SANS;
    try { ctx.letterSpacing = "6px"; } catch (e) {}
    ctx.fillText(String(p.label).toUpperCase(), W / 2, 575);

const LBKG = 2.2046226218;

  const bw = Math.max(40, Math.min(sex === "female" ? 150 : 210, bwKg));
  const d = sex === "female"
    ? (-0.0000010706 * bw ** 4 + 0.0005158568 * bw ** 3 - 0.1126655495 * bw ** 2 + 13.6175032 * bw - 57.96288)
    : (-0.000001093 * bw ** 4 + 0.0007391293 * bw ** 3 - 0.1918759221 * bw ** 2 + 24.0900756 * bw - 307.75076);
  return 500 / d;
}

  const x = Math.max(40, Math.min(sex === "female" ? 150 : 210, bwKg));
  const c = sex === "female"
    ? [594.31747775582, -27.23842536447, 0.82112226871, -0.00930733913, 0.00004731582, -0.00000009054]
    : [-216.0475144, 16.2606339, -0.002388645, -0.00113732, 0.00000701863, -0.00000001291];
  const denom = c[0] + c[1] * x + c[2] * x ** 2 + c[3] * x ** 3 + c[4] * x ** 4 + c[5] * x ** 5;
  return 500 / denom;
}

/* ---- Inter-session (week-over-week) fatigue ---- */
// Work above ~RPE 8 leaves a recovery debt into the NEXT session of that lift. The
// debt scales with how far past 8 the sets went, decays over the days between
// sessions, and its true size is learned per lift from this lifter's own history —
// so a deadlift can learn a heavier carryover than a bench.
function strainExcess(rpe) {
  // Strain is dominated by true 9+ work: 8.5s count at half weight, 9 and up in full.
  const base = Math.max(0, fatigueEffort(rpe) - fatigueEffort(8));
  return base * Math.max(0.3, Math.min(1, rpe - 8));
}
function residualFatigue(sets, refTs, includeToday) {
  // Raw decayed strain summed across all recent sessions (16-day window), so a light
  // session can't mask the debt from a brutal one behind it. Callers apply the
  // learned per-lift scale and cap. Reports the dominant contributor for display.
  const dayKey = (ts) => new Date(ts).toDateString();
  const refDay = dayKey(refTs);
  const prior = sets.filter((s) => s.ts < refTs && (includeToday || dayKey(s.ts) !== refDay));
  if (!prior.length) return { raw: 0, days: 0, peak: 0 };
  const byDay = {};
  for (const s of prior) { const d = dayKey(s.ts); (byDay[d] = byDay[d] || []).push(s); }
  let total = 0, top = { c: 0, days: 0, peak: 0 };
  for (const d in byDay) {
    let S = 0, peak = 0, lastTs = 0;
    for (const s of byDay[d]) { S += Math.max(1, s.reps) * strainExcess(s.rpe) * (s.backoff ? 0.4 : 1); if (!s.backoff) peak = Math.max(peak, s.rpe); lastTs = Math.max(lastTs, s.ts); }
    const days = Math.max(0.17, (refTs - lastTs) / 86400000);
    if (days > 12 || S <= 0) continue;
    const c = 0.25 * S * Math.exp(-days / 4);
    total += c;
    if (c > top.c) top = { c, days: Math.round(days), peak };
  }
  return { raw: total, days: top.days, peak: top.peak };
}

// Freshness correction for the ESTIMATOR: a set performed under predicted residual
// fatigue is converted toward fresh terms — but never beyond the impairment the
// lifter's own rating actually showed. Hit your target effort? You weren't impaired,
// so essentially no correction. This keeps a hard week from reading as strength loss
// without ever manufacturing strength that wasn't demonstrated.
function freshCorrect(obs, s, sets, rsc) {
  const rd = trimFor(residualFatigue(sets, s.ts).raw, rsc);
  if (rd < 0.01) return obs;
  let corr = 0.85 * rd;
  if (s.fromRec && s.tRpe != null) {
    const obsDef = Math.max(0, 1 - e1rmFromSet(s.weight, s.reps, s.rpe) / e1rmFromSet(s.weight, s.reps, s.tRpe));
    corr = Math.min(corr, obsDef);
  } else corr = Math.min(corr, 0.06);
  return obs / (1 - Math.min(0.10, corr));
}

// harder than its target, on a day residual fatigue was predicted, sizes the effect.
// Two outputs from the same physiology, deliberately separated:
//   TRIM      — what we subtract from a prescription. Capped hard, because a wrong trim
//               wastes a session; being 3% light costs nothing, being 15% light ruins a day.
//   READINESS — what the athlete sees. Mapped onto an expressive scale so a genuinely
//               beaten-up lift reads in the 40s-50s instead of hovering in the high 80s.
const TRIM_CAP = 0.10;
const READY_SPAN = 0.22;

  // counts more (fatigue response shifts across blocks), the weighted median resists
  // one odd session, and it shrinks toward a slightly-cautious prior until proven.
  const now = Date.now(), HALF_LIFE = 56 * 86400000;
  const samples = [];
  for (const s of sets) {
    if (s.backoff || !s.fromRec || s.tRpe == null || s.rpe == null) continue;
    const pred = residualFatigue(sets, s.ts).raw;
    if (pred < 0.012) continue;
    const obs = 1 - e1rmFromSet(s.weight, s.reps, s.rpe) / e1rmFromSet(s.weight, s.reps, s.tRpe);
    if (obs < -0.12 || obs > 0.25) continue;          // outside this, something else happened
    const sc = Math.max(0.05, Math.min(2.5, obs / pred));
    samples.push({ sc, w: Math.pow(0.5, (now - s.ts) / HALF_LIFE) });
  }
  if (!samples.length) return 1;
  samples.sort((x, y) => x.sc - y.sc);
  const W = samples.reduce((tot, x) => tot + x.w, 0);
  let acc = 0, med = samples[samples.length - 1].sc;
  for (const x of samples) { acc += x.w; if (acc >= W / 2) { med = x.sc; break; } }
  const W0 = 2;
  return Math.max(0.15, Math.min(1.9, (W * med + W0 * 0.85) / (W + W0)));
}

          <span style={{ fontFamily: MONO, fontWeight: 500, fontSize: 15, letterSpacing: "0.32em",
            color: C.text, paddingLeft: 2 }}>IRONSET</span>
        </div>
        {step === "style" ? (

            {opt("RPE-based", "Prescribe by reps and RPE — the app suggests your load and learns from how each set feels.", () => goSeed({ trainingMode: "rpe", inputMode: "rpe", onboarded: true }), C.red)}
            {opt("Percentage-based", "Prescribe by reps and a % of your max — old-school 1RM-percentage style.", () => setStep("max"), C.blue)}

// Where the projected total comes from — each lift's contribution and its 30-day move.
function TotalSheet({ open, onClose, parts, models, total, unit }) {
  const now = Date.now(), CUT = now - 30 * 86400000;
  return (
    <Sheet open={open} onClose={onClose} title="Projected total">
      <div style={{ fontSize: 13, color: C.muted, lineHeight: 1.6, marginBottom: 14 }}>
        Your squat, bench and deadlift estimates added together — each one built from the sets you've
        logged, weighted toward your hardest and most recent work.
      </div>
      {(parts || []).map((p) => {
        const m = models[p.name], pts = m ? m.points : [];
        let then = null;
        for (const q of pts) { if (q.ts <= CUT) then = q.value; }
        const d = then != null ? p.e1rm - then : null;
        const share = total ? Math.round((p.e1rm / total) * 100) : 0;
        return (
          <div key={p.name} style={{ borderTop: `1px solid ${C.line}`, padding: "13px 0" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
              <span style={{ fontWeight: 700, fontSize: 14.5 }}>{p.name}</span>
              <span style={{ fontFamily: MONO, fontSize: 18, fontWeight: 700 }}>{fmt(Math.round(p.e1rm))}
                <span style={{ fontFamily: SANS, fontSize: 11, color: C.faint, marginLeft: 3 }}>{unit}</span></span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 5, fontSize: 11.5 }}>
              <span style={{ color: C.faint }}>{share}% of total</span>
              {d != null && Math.round(d) !== 0 && (
                <span style={{ color: d > 0 ? C.good : C.red, fontWeight: 700 }}>
                  {d > 0 ? "▲" : "▼"} {fmt(Math.abs(Math.round(d)))} in 30 days
                </span>
              )}
            </div>
            <div style={{ height: 4, borderRadius: 2, background: "rgba(255,255,255,0.05)", marginTop: 7, overflow: "hidden" }}>
              <div style={{ width: `${share}%`, height: "100%", background: G.blue, borderRadius: 2 }} />
            </div>
          </div>
        );
      })}
    </Sheet>
  );
}
// Where the week's tonnage came from — day by day, and which lifts carried it.
function LoadSheet({ open, onClose, state, unit }) {
  const cut = Date.now() - 7 * 86400000;
  const byDay = {}, byLift = {};
  for (const [name, ex] of Object.entries(state.exercises))
    for (const s of ex.sets) if (s.ts >= cut) {
      const k = new Date(s.ts).toDateString(), v = s.weight * Math.max(1, s.reps);
      byDay[k] = byDay[k] || { ton: 0, sets: 0 };
      byDay[k].ton += v; byDay[k].sets++;
      byLift[name] = (byLift[name] || 0) + v;
    }
  const days = Object.keys(byDay).sort((a, b) => new Date(b) - new Date(a));
  const peak = Math.max(1, ...days.map((d) => byDay[d].ton));
  const lifts = Object.entries(byLift).sort((a, b) => b[1] - a[1]);
  const tot = lifts.reduce((s, l) => s + l[1], 0);
  const k = (v) => (v >= 1000 ? (v / 1000).toFixed(1) + "k" : fmt(Math.round(v)));
  return (
    <Sheet open={open} onClose={onClose} title="7-day load">
      <div style={{ fontSize: 13, color: C.muted, lineHeight: 1.6, marginBottom: 14 }}>
        Total tonnage — every set's weight times its reps — across the last seven days. A rough
        read on how much work you've actually put in, separate from how hard it felt.
      </div>
      {days.length === 0 && <div style={{ fontSize: 13, color: C.faint }}>Nothing logged in the last week.</div>}
      {days.map((d) => (
        <div key={d} style={{ borderTop: `1px solid ${C.line}`, padding: "11px 0" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
            <span style={{ fontSize: 13, fontWeight: 700 }}>{dshort(new Date(d).getTime())}</span>
            <span style={{ fontFamily: MONO, fontSize: 13.5, fontWeight: 700 }}>{k(byDay[d].ton)}
              <span style={{ fontFamily: SANS, fontSize: 10.5, color: C.faint, marginLeft: 3 }}>{unit}</span></span>
          </div>
          <div style={{ height: 4, borderRadius: 2, background: "rgba(255,255,255,0.05)", marginTop: 6, overflow: "hidden" }}>
            <div style={{ width: `${(byDay[d].ton / peak) * 100}%`, height: "100%", background: G.amber, borderRadius: 2 }} />
          </div>
          <div style={{ fontSize: 11, color: C.faint, marginTop: 4 }}>{byDay[d].sets} sets</div>
        </div>
      ))}
      {lifts.length > 0 && (
        <div style={{ marginTop: 16 }}>
          <div style={{ ...label, fontSize: 9.5, marginBottom: 9 }}>By lift</div>
          <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
            {lifts.map(([n, v]) => <Tag key={n} color={C.amber}>{n} {Math.round((v / tot) * 100)}%</Tag>)}
          </div>
        </div>
      )}
    </Sheet>
  );
}

                </div>
                <div style={{ height: 3, borderRadius: 2, background: "rgba(255,255,255,0.055)", overflow: "hidden" }}>
                  <div style={{ width: `${Math.max(5, Math.min(100, r.pct))}%`, height: "100%",
                    borderRadius: 2, background: freshColor(r.pct), transition: "width .3s ease" }} />
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>

      <Grid2>
        <Card onClick={() => setShowTotal(true)}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <span style={{ ...label, fontSize: 10 }}>Projected total</span>
            {analysis.total != null && (
              <button aria-label="Share total" onClick={() => doShare(setShare, { type: "stat", label: "Projected total",
                value: fmt(Math.round(analysis.total)), unit,
                delta: analysis.totalDelta != null ? Math.round(analysis.totalDelta) : null,
                sub: (analysis.parts || []).slice(0, 3).map((p) => `${p.name} ${fmt(Math.round(p.e1rm))}`).join("    "),
                date: new Date().toLocaleDateString(undefined, { month: "short", day: "numeric" }) })}
                style={{ background: "none", border: "none", color: C.faint, cursor: "pointer", padding: 0, marginTop: -2 }}>
                <Share size={14} />
              </button>
            )}
          </div>
          <div style={{ fontFamily: SANS, fontSize: 28, fontWeight: 700, marginTop: 10, letterSpacing: "-0.04em", fontVariantNumeric: "tabular-nums" }}>
            {analysis.total != null ? fmt(Math.round(analysis.total)) : "—"}
            <span style={{ fontFamily: SANS, fontSize: 12, color: C.faint, marginLeft: 4, fontWeight: 600 }}>{unit}</span>
          </div>
          {analysis.totalDelta != null && Math.round(analysis.totalDelta) !== 0 && (
            <div style={{ fontSize: 12, marginTop: 7, fontWeight: 500, fontFamily: MONO,
              color: analysis.totalDelta > 0 ? C.muted : C.redHi }}>
              {analysis.totalDelta > 0 ? "+" : "−"}{fmt(Math.abs(Math.round(analysis.totalDelta)))} · 30d
            </div>
          )}
        </Card>
        <Card onClick={() => setShowLoad(true)}>
          <span style={{ ...label, fontSize: 10 }}>7-day load</span>
          <div style={{ fontFamily: SANS, fontSize: 28, fontWeight: 700, marginTop: 10, letterSpacing: "-0.04em", fontVariantNumeric: "tabular-nums" }}>
            {week.tonnage >= 1000 ? (week.tonnage / 1000).toFixed(1) + "k" : fmt(week.tonnage)}
            <span style={{ fontFamily: SANS, fontSize: 12, color: C.faint, marginLeft: 4, fontWeight: 600 }}>{unit}</span>
          </div>
          <div style={{ fontSize: 12, marginTop: 7, color: C.faint, fontWeight: 500, fontFamily: MONO }}>
            {week.sets} set{week.sets === 1 ? "" : "s"} · {week.days} day{week.days === 1 ? "" : "s"}
          </div>
        </Card>
      </Grid2>

      {liftCards.length > 0 && (
        <div>
          <SectionHead accent={C.blue} right={<button aria-label="Share maxes" onClick={() => doShare(setShare, { type: "session",
            headline: "Estimated maxes", sub: `${liftCards.length} lifts`,
            lifts: liftCards.slice(0, 5).map((L) => ({ name: L.name, detail: "estimated 1RM", e1rm: fmt(Math.round(L.e1rm)) })),
            date: new Date().toLocaleDateString(undefined, { month: "short", day: "numeric" }) })}
            style={{ background: "none", border: "none", color: C.faint, cursor: "pointer", padding: 4, display: "flex" }}>
            <Share size={14} /></button>}>Estimated maxes</SectionHead>
          <div style={{ display: "flex", gap: 10, overflowX: "auto", margin: "0 -2px", padding: "0 2px 4px" }}>
            {liftCards.map((L) => (
              <Card key={L.name} onClick={() => { setSel(L.name); setTab("history"); }}
                style={{ padding: 14, flex: "0 0 auto", minWidth: 124 }}>
                <div style={{ fontFamily: SANS, fontSize: 22, fontWeight: 700, letterSpacing: "-0.04em",
                  fontVariantNumeric: "tabular-nums" }}>
                  {fmt(Math.round(L.e1rm))}
                  <span style={{ fontFamily: SANS, fontSize: 11, color: C.faint, marginLeft: 3, fontWeight: 600 }}>{unit}</span>
                </div>
                <div style={{ ...label, fontSize: 10, color: C.faint, marginTop: 6, whiteSpace: "nowrap",
                  overflow: "hidden", textOverflow: "ellipsis", maxWidth: 108 }}>{L.name}</div>
                <div style={{ marginTop: 12, marginLeft: -14, marginRight: -14, marginBottom: -14 }}>
                  <Spark points={L.points} color={C.muted} h={28} />
                </div>
              </Card>
            ))}
          </div>
        </div>
      )}

      <ScoreCard analysis={analysis} unit={unit} state={state} setState={setState} />
      <MeetCard analysis={analysis} unit={unit} state={state} setState={setState} />

      <Btn kind="primary" onClick={() => setTab("train")} style={{ width: "100%", marginTop: 4 }}>Start training</Btn>
      <ReadinessSheet open={why} onClose={() => setWhy(false)} rows={fresh} />
      <TotalSheet open={showTotal} onClose={() => setShowTotal(false)} parts={analysis.parts} models={models} total={analysis.total} unit={unit} />
      <LoadSheet open={showLoad} onClose={() => setShowLoad(false)} state={state} unit={unit} />
      {share && <ShareSheet data={share} onClose={() => setShare(null)} />}
    </div>
  );
}

/* =============================== TRAIN TAB =============================== */
function TrainTab({ state, sel, setSel, models, addExercise, updateExercise, logSet, settings, setSetting, denoms, meetDays, meetName, plan, onEditPlan }) {
  const { unit, round, bar, inputMode } = settings;
  const names = Object.keys(state.exercises);
  const mains = names.filter((n) => !state.exercises[n].parent);
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState("");
  const [linking, setLinking] = useState(false);

  // prescription
  const [tReps, setTReps] = useState(3);
  const [tInt, setTInt] = useState(inputMode === "rir" ? 1 : 8); // value in current mode
  const tRpe = inputMode === "rir" ? 10 - tInt : tInt;

  // log panel
  const [log, setLog] = useState({ weight: "", reps: 3, int: inputMode === "rir" ? 1 : 8 });
  const [fromRec, setFromRec] = useState(false);
  const [note, setNote] = useState("");
  const [showPlates, setShowPlates] = useState(false);
  const [showDate, setShowDate] = useState(false);
  const [showHow, setShowHow] = useState(false);
  const [justLogged, setJustLogged] = useState(false);
  const [logDate, setLogDate] = useState(todayStr());

  const model = (sel && models[sel]) ? models[sel] : { e1rm: null, points: [], count: 0 };
  const e1rm = model.e1rm;
  const selEx = sel ? state.exercises[sel] : null;
  const DAYK = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const todayPlan = (plan || {})[DAYK[(new Date(tsFromDateStr(logDate)).getDay() + 6) % 7]] || [];
  const loadPlanned = (it) => {
    if (state.exercises[it.name]) setSel(it.name);
    setTReps(it.reps);
    setTInt(inputMode === "rir" ? 10 - it.rpe : it.rpe);
    if (it.bo && setSetting) setSetting("backoff", { ...(settings.backoff || {}), sets: it.bo.sets, reps: it.bo.reps, rpe: it.bo.rpe, steps: [] });
  };
  const childNames = sel ? names.filter((n) => state.exercises[n].parent === sel) : [];
  const parentName = selEx && selEx.parent && state.exercises[selEx.parent] ? selEx.parent : null;
  const ratioPct = Math.round((model.ratio || 1) * 100);
  // training mode + reference max that percentages run off
  const percentMode = settings.trainingMode === "percent";
  const locked = percentMode && settings.maxMode === "locked";
  const tmax = selEx ? selEx.tmax : null;
  const setTmax = (val) => { if (sel) updateExercise(sel, { tmax: val }); };
  const [editTmax, setEditTmax] = useState(false);
  const [tmaxInput, setTmaxInput] = useState("");
  // Week-over-week carryover trims today's targets. Weights are movement-pattern
  // aware: this lift's own strain in full, its variation family at 60%, same-pattern
  // lifts (squat↔deadlift) at 35%, and unrelated patterns at a whisper (5%) — a
  // brutal deadlift day reaches your squat, but barely touches your bench.
  const recovery = useMemo(() => {
    if (!selEx || e1rm == null) return { drop: 0, days: 0, peak: 0, from: null };
    const refTs = tsFromDateStr(logDate) + 1;
    const scale = learnRecoveryScale(selEx.sets);
    const rootOf = (n) => { let r = n, hop = 0; while (state.exercises[r] && state.exercises[r].parent && hop++ < 4) r = state.exercises[r].parent; return r; };
    const groupOf = (n) => { const r = rootOf(n).toLowerCase(); if (/squat|dead|pull|hinge|rdl/.test(r)) return "lower"; if (/bench|press|dip/.test(r)) return "press"; return "other"; };
    const own = residualFatigue(selEx.sets, refTs);
    let total = own.raw, top = { c: own.raw, days: own.days, peak: own.peak, name: null };
    const gSel = groupOf(sel);
    for (const [name, other] of Object.entries(state.exercises)) {
      if (name === sel) continue;
      const fam = rootOf(name) === rootOf(sel);
      const gOther = groupOf(name);
      const w = fam ? 0.6 : (gSel !== "other" && gSel === gOther ? 0.35 : (gSel === "other" || gOther === "other" ? 0.15 : 0.05));
      const r = residualFatigue(other.sets, refTs);
      const c = w * r.raw;
      total += c;
      if (c > top.c) top = { c, days: r.days, peak: r.peak, name };
    }
    return { drop: trimFor(total, scale), days: top.days, peak: top.peak, from: top.name };
  }, [selEx, sel, state.exercises, e1rm, logDate]);
  const effE1rm = e1rm != null ? e1rm * (1 - recovery.drop) : null;

  const ref = percentMode ? (locked ? (tmax != null ? tmax : (e1rm != null ? roundTo(e1rm, round) : null)) : (effE1rm != null ? roundTo(effE1rm, round) : null)) : effE1rm;
  const topPct = settings.topPct || 85;
  const setTopPct = (v) => setSetting && setSetting("topPct", Math.max(30, Math.min(105, v)));

  const rec = percentMode ? (ref != null ? ref * (topPct / 100) : null) : (effE1rm != null ? weightForTarget(effE1rm, tReps, tRpe) : null);
  const recR = rec != null ? roundTo(rec, round) : null;
  // predicted effort for a % prescription, measured against the app's true estimate
  const predRpe = (percentMode && effE1rm != null && recR != null) ? Math.max(1, Math.min(10, 10 - (repsAtPct((recR / effE1rm) * 100) - tReps))) : null;
  const strongDay = (!percentMode && effE1rm != null && tRpe < 10) ? roundTo(weightForTarget(effE1rm, tReps, Math.min(10, tRpe + 0.5)), round) : null;
  const toughDay = (!percentMode && effE1rm != null) ? roundTo(weightForTarget(effE1rm, tReps, tRpe - 0.5), round) : null;

  // back-off sets — fatigue-aware in RPE mode; a flat % in percentage mode
  const bo = settings.backoff || { sets: 1, reps: 5, rpe: 8, pct: 75 };
  const setBo = (patch) => setSetting && setSetting("backoff", { ...bo, ...patch });
  const boPct = bo.pct || 75;
  // Each back-off targets bo.reps @ bo.rpe; the load is what hits that target given how
  // much capacity the *actual* prior set spent. The first comes off your top set, each
  // next off the back-off before it, so a grindy set pulls the next one down harder.
  const [boDraft, setBoDraft] = useState(null);
  const scaleTop = useMemo(() => learnDropScale(selEx ? selEx.sets : [], DEFAULT_FATIGUE_K, true), [selEx]);
  const scaleChain = useMemo(() => learnDropScale(selEx ? selEx.sets : [], DEFAULT_FATIGUE_K, false), [selEx]);
  const boDayStr = new Date(tsFromDateStr(logDate)).toDateString();
  // A back-off can be run as a linked variation. Fatigue still chains off the main lift's
  // spent capacity; the load is then scaled by how that variation measures up to the main.
  const boFamily = sel ? [sel].concat(Object.keys(state.exercises).filter((n) => state.exercises[n].parent === sel)) : [];
  const ratioOf = (n) => (n === sel ? 1 : ((models[n] && models[n].ratio) || (state.exercises[n] && state.exercises[n].ratio) || 1));
  useEffect(() => { setBoDraft(null); }, [sel]);
  // Every back-off carries its OWN prescription — reps, intensity, and which lift in the
  // family it runs on — so a session can descend (5 @ 8, then 4 @ 6, then a single on a
  // paused variation) without rewriting one shared target between sets. A slot you have
  // never touched inherits the slot before it, and the first falls back to the card
  // defaults, which is also what the block planner writes.
  const boSteps = Array.isArray(bo.steps) ? bo.steps : [];
  const stepAt = (i) => {
    let s = { reps: bo.reps, rpe: bo.rpe, pct: boPct, lift: null };
    for (let k = 0; k <= i; k++) if (boSteps[k]) s = { ...s, ...boSteps[k] };
    return s;
  };
  const setStep = (i, patch) => {
    const next = boSteps.slice();
    while (next.length <= i) next.push(null);
    next[i] = { ...stepAt(i), ...patch };
    setBo({ steps: next });
  };
  const todayBos = boFamily
    .reduce((acc, n) => acc.concat((state.exercises[n] ? state.exercises[n].sets : [])
      .filter((x) => x.backoff && new Date(x.ts).toDateString() === boDayStr)
      .map((x) => ({ ...x, lift: n }))), [])
    .sort((a, b) => a.ts - b.ts);
  const doneCount = todayBos.length;
  const lastBo = doneCount ? todayBos[doneCount - 1] : null;
  const boStep = stepAt(doneCount);
  const boReps = boStep.reps, boRpe = boStep.rpe, boStepPct = boStep.pct || boPct;
  // a remembered variation only applies while it is still part of this lift's family
  const boTarget = (boStep.lift && state.exercises[boStep.lift] && boFamily.indexOf(boStep.lift) >= 0) ? boStep.lift : sel;
  // the driving set, always normalised into MAIN-lift terms so the chain stays comparable
  const prevForBo = (() => {
    if (lastBo) return { implied: e1rmFromSet(lastBo.weight, lastBo.reps, lastBo.rpe) / (ratioOf(lastBo.lift) || 1), reps: lastBo.reps, rpe: lastBo.rpe };
    const topToday = (selEx ? selEx.sets : []).filter((x) => !x.backoff && new Date(x.ts).toDateString() === boDayStr).pop();
    if (topToday) return { implied: e1rmFromSet(topToday.weight, topToday.reps, topToday.rpe), reps: topToday.reps, rpe: topToday.rpe };
    if (effE1rm != null) return { implied: effE1rm, reps: tReps, rpe: tRpe };
    return null;
  })();
  const boSug = (() => {
    const r = ratioOf(boTarget) || 1;
    if (percentMode) return ref != null ? roundTo(ref * (boStepPct / 100) * r, round) : null;
    if (!prevForBo) return null;
    const effCap = prevForBo.implied * (1 - fatigueDrop(prevForBo.reps, prevForBo.rpe, DEFAULT_FATIGUE_K) * (lastBo ? scaleChain : scaleTop));
    return roundTo(weightForTarget(effCap * r, boReps, boRpe), round);
  })();
  // What the prescription says this set should feel like: the target RPE directly, or in
  // percentage mode the effort that load works out to against the current estimate.
  const boBaseRpe = (() => {
    if (!percentMode) return boRpe;
    if (effE1rm != null && boSug != null) return Math.max(1, Math.min(10, 10 - (repsAtPct((boSug / effE1rm) * 100) - boReps)));
    return 9;
  })();
  // The weight is a free-text draft; `feel` is a signed RPE nudge for a set that landed
  // harder or easier than asked. Keeping them apart means correcting how a set actually
  // felt never quietly moves the load you just lifted.
  const boFeel = (boDraft && boDraft.feel) || 0;
  const boRpeActual = Math.max(5, Math.min(10, Math.round((boBaseRpe + boFeel) * 2) / 2));
  const curBo = { weight: (boDraft && boDraft.weight != null) ? boDraft.weight : (boSug != null ? String(boSug) : ""), rpe: boRpeActual };
  const boDirty = !!(boDraft && boDraft.weight != null);
  const setBoW = (v) => setBoDraft({ ...(boDraft || {}), weight: v });
  const nudgeBo = (d) => setBoDraft({ ...(boDraft || {}), feel: Math.max(-3, Math.min(3, boFeel + d)) });
  const logCurBackoff = () => {
    if (!boTarget) return;
    const w = parseFloat(curBo.weight);
    if (!isFinite(w) || w <= 0) return;
    logSet(boTarget, { weight: roundTo(w, round), reps: boReps, rpe: curBo.rpe, ts: tsFromDateStr(logDate),
      backoff: true, fromRec: false, tReps: boReps, tRpe: percentMode ? Math.round(boBaseRpe * 2) / 2 : boRpe,
      rec: boSug != null ? boSug : roundTo(w, round) });
    setBoDraft(null);
  };

  const useRec = () => {
    if (recR == null) return;
    let intVal;
    if (percentMode) {
      const pr = predRpe != null ? predRpe : 8;
      intVal = inputMode === "rir" ? Math.max(0, Math.round((10 - pr) * 2) / 2) : Math.round(pr * 2) / 2;
    } else {
      intVal = inputMode === "rir" ? 10 - tRpe : tRpe;
    }
    setLog({ weight: String(recR), reps: tReps, int: intVal });
    setFromRec(true);
  };
  const nudge = (d) => setLog((l) => ({ ...l, int: inputMode === "rir" ? Math.max(0, l.int - d) : Math.min(10, Math.max(5, l.int + d)) }));

  const doLog = () => {
    const w = parseFloat(log.weight);
    if (!sel || isNaN(w) || w <= 0) return;
    const actualRpe = inputMode === "rir" ? 10 - log.int : log.int;
    logSet(sel, {
      weight: w, reps: log.reps, rpe: actualRpe, ts: tsFromDateStr(logDate),
      fromRec, tReps, tRpe, rec: recR, note: note.trim() || undefined,
    });
    setNote(""); setFromRec(false); setJustLogged(true);
    setTimeout(() => setJustLogged(false), 1400);
  };

  if (names.length === 0)
    return (
      <Card style={{ textAlign: "center", padding: "26px 18px" }}>
        <div style={{ fontWeight: 900, fontSize: 18, marginBottom: 6 }}>Add your first lift</div>
        <div style={{ color: C.muted, fontSize: 13.5, marginBottom: 18, lineHeight: 1.5 }}>
          Pick one to start. Log any set — a known 1RM or a working set — and IRONSET calibrates your strength from it.
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, justifyContent: "center", marginBottom: 14 }}>
          {PRESETS.map((p) => <Chip key={p} onClick={() => addExercise(p)}>{p}</Chip>)}
        </div>
        <AddRow {...{ newName, setNewName, addExercise, mains }} />
      </Card>
    );

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      {/* exercise selector */}
      <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4 }}>
        {names.map((n) => <Chip key={n} active={n === sel} onClick={() => setSel(n)}>{n}</Chip>)}
        <Chip onClick={() => setAdding((v) => !v)}><Plus size={15} style={{ marginTop: -1 }} /></Chip>
      </div>
      {adding && <Card style={{ padding: 12 }}><AddRow {...{ newName, setNewName, mains, addExercise: (n, p) => { addExercise(n, p); setAdding(false); } }} /></Card>}
      {sel && (
        <button onClick={() => setLinking(true)} style={{ alignSelf: "flex-start", background: "none", border: "none",
          color: C.faint, fontFamily: MONO, fontSize: 11.5, fontWeight: 400, cursor: "pointer", padding: "0", display: "inline-flex", alignItems: "center", gap: 7, marginTop: -2 }}>
          <span style={{ color: C.faint, fontSize: 14 }}>↔</span>
          {parentName ? `Feeds ${parentName} · ${ratioPct}%` : childNames.length ? `Includes ${childNames.join(", ")}` : "Link as a variation"}
        </button>
      )}

      {meetDays != null && meetDays >= 0 && (
        <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 12, padding: "10px 13px",
          fontSize: 12.5, color: C.text, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <b style={{ color: C.text, fontWeight: 600 }}>{meetName || "Meet"}</b>
          <span style={{ fontFamily: MONO, fontWeight: 500, color: C.muted, fontSize: 12 }}>{meetDays === 0 ? "Meet day" : meetDays + " day" + (meetDays === 1 ? "" : "s") + " out"}</span>
        </div>
      )}

      {/* strength readout */}
      <Card style={{ padding: "15px 18px" }}>
        {locked ? (
          <div>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <div style={label}>Training max{sel ? ` · ${sel}` : ""}</div>
              {!editTmax && <button onClick={() => { setTmaxInput(ref != null ? String(ref) : ""); setEditTmax(true); }}
                style={{ background: "none", border: "none", color: C.text, fontWeight: 500, fontSize: 12.5, cursor: "pointer" }}>Edit</button>}
            </div>
            {editTmax ? (
              <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 8 }}>
                <div style={{ flex: 1 }}><NumField value={tmaxInput} onChange={setTmaxInput} suffix={unit} /></div>
                <Btn kind="primary" onClick={() => { const v = parseFloat(tmaxInput); if (isFinite(v) && v > 0) setTmax(roundTo(v, round)); setEditTmax(false); }}>Save</Btn>
              </div>
            ) : (
              <>
                <div style={{ fontFamily: SKETCH, fontSize: 30, fontWeight: 700, color: C.chalk, lineHeight: 1.1, fontVariantNumeric: "tabular-nums", marginTop: 2 }}>
                  {ref != null ? fmt(ref) : "—"}<span style={{ fontSize: 14, color: C.muted, marginLeft: 4 }}>{unit}</span>
                </div>
                <div style={{ fontSize: 11.5, color: C.faint, marginTop: 2 }}>
                  {e1rm != null ? `app estimate ${fmt(roundTo(e1rm, round))} ${unit}` : "log a set to see your estimate"}{tmax == null ? " · using estimate — set yours" : ""}
                </div>
              </>
            )}
          </div>
        ) : (
          <div>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 12 }}>
              <span style={label}>Estimated 1RM</span>
              <span style={{ fontFamily: SANS, fontSize: 24, fontWeight: 700, color: C.text, lineHeight: 1,
                letterSpacing: "-0.035em", fontVariantNumeric: "tabular-nums" }}>
                {e1rm != null ? fmt(roundTo(e1rm, round)) : "—"}<span style={{ fontSize: 12, color: C.faint, marginLeft: 4, fontWeight: 500 }}>{unit}</span>
              </span>
            </div>
            <div style={{ fontFamily: MONO, fontSize: 11, color: C.faint, marginTop: 9 }}>
              {model.count > 0
                ? `from ${model.count} set${model.count > 1 ? "s" : ""} · updated ${dshort(model.points[model.points.length - 1].ts)}`
                : "not calibrated"}
            </div>
          </div>
        )}
      </Card>

      {/* TOP SET widget — prescribe, see the load, log it, all in one */}
      {todayPlan.length ? (
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={label}>Today's plan</span>
          <button onClick={onEditPlan} style={{ background: "none", border: "none", color: C.text,
            fontWeight: 500, fontSize: 12, cursor: "pointer", padding: 0 }}>Edit</button>
        </div>
        {true ? (
          <div style={{ display: "flex", gap: 7, flexWrap: "wrap", marginTop: 9 }}>
            {todayPlan.map((it, i) => {
              const on = it.name === sel && it.reps === tReps && (inputMode === "rir" ? 10 - it.rpe : it.rpe) === tInt;
              return (
                <Chip key={i} active={on} onClick={() => loadPlanned(it)}>
                  {it.name} · {it.reps}@{inputMode === "rir" ? `${fmt(10 - it.rpe)}R` : fmt(it.rpe)}{it.bo ? ` +${it.bo.sets}×${it.bo.reps}` : ""}
                </Chip>
              );
            })}
          </div>
        ) : null}
      </Card>
      ) : (
        <button onClick={onEditPlan} style={{ alignSelf: "flex-start", background: "none", border: "none",
          padding: 0, color: C.faint, fontFamily: MONO, fontSize: 12, cursor: "pointer", letterSpacing: "0.02em" }}>
          No plan today · set one up
        </button>
      )}

      <Card accent={C.red} glow="none">
        <SectionHead accent={C.red} sub="Set your target, see the load, then log what you actually hit.">Top set</SectionHead>
        <div style={{ display: "flex", gap: 14, marginTop: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div>
            <div style={{ ...label, fontSize: 10, marginBottom: 8 }}>Reps</div>
            <Stepper value={tReps} onChange={setTReps} min={1} max={20} />
          </div>
          <div>
            <div style={{ ...label, fontSize: 10, marginBottom: 8 }}>{percentMode ? "% of max" : (inputMode === "rir" ? "RIR" : "RPE")}</div>
            {percentMode
              ? <Stepper value={topPct} onChange={setTopPct} step={2.5} min={30} max={105} suffix="%" />
              : <Stepper value={tInt} onChange={setTInt} step={0.5} min={inputMode === "rir" ? 0 : 5} max={inputMode === "rir" ? 5 : 10} />}
          </div>
        </div>
        <div style={{ display: "flex", gap: 6, marginTop: 12, flexWrap: "wrap" }}>
          {percentMode
            ? [70, 75, 80, 85, 90].map((v) => <Chip key={v} active={topPct === v} onClick={() => setTopPct(v)}>{v}%</Chip>)
            : (inputMode === "rir" ? [3, 2, 1, 0] : [7, 8, 9, 10]).map((v) => <Chip key={v} active={tInt === v} onClick={() => setTInt(v)}>{inputMode === "rir" ? `${v} RIR` : `RPE ${v}`}</Chip>)}
        </div>
      <div style={{ height: 1, background: C.line, margin: "20px -18px" }} />

      {/* recommendation */}
      <div style={{ textAlign: "center", margin: "0 -18px", padding: "24px 18px 8px",
        background: "transparent" }}>
        <div style={label}>Recommended load</div>
        {recR != null ? (
          <>
            {/* The number is the product. Nothing sits on top of it, behind it or
                around it — no glow, no rule, no tint. Just size and air. */}
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "center", gap: 9, marginTop: 16,
              whiteSpace: "nowrap" }}>
              <span style={{ fontFamily: SANS, fontSize: 66, fontWeight: 700, lineHeight: 0.88, color: C.text,
                letterSpacing: "-0.055em", fontVariantNumeric: "tabular-nums" }}>{fmt(recR)}</span>
              <span style={{ fontFamily: SANS, fontSize: 17, color: C.faint, fontWeight: 500 }}>{unit}</span>
            </div>
            <div style={{ fontFamily: MONO, fontSize: 13, color: C.muted, fontWeight: 500, marginTop: 14,
              letterSpacing: "0.02em" }}>
              {percentMode
                ? `${tReps} × ${fmt(topPct)}%`
                : `${tReps} × ${inputMode === "rir" ? `${10 - tRpe} RIR` : `RPE ${fmt(tRpe)}`}`}
            </div>
            {percentMode
              ? (predRpe != null && <div style={{ fontSize: 12, color: C.faint, marginTop: 8, fontFamily: MONO }}>≈ RPE {fmt(Math.round(predRpe * 2) / 2)} · {fmt(Math.max(0, Math.round((10 - predRpe) * 2) / 2))} RIR</div>)
              : ((strongDay || toughDay) && (
                <div style={{ fontSize: 12, color: C.faint, marginTop: 10, fontFamily: MONO, letterSpacing: "0.01em" }}>
                  {strongDay ? `${fmt(strongDay)} strong` : ""}{strongDay && toughDay ? "   ·   " : ""}{toughDay ? `${fmt(toughDay)} tough` : ""}
                </div>
              ))}
            {recovery.drop >= 0.01 && (
              <div style={{ fontSize: 12, color: C.amber, marginTop: 10, fontWeight: 500 }}>
                Trimmed {fmt(Math.round(recovery.drop * 1000) / 10)}% — RPE {fmt(recovery.peak)} {(recovery.from || sel) + " "}session {recovery.days}d ago
              </div>
            )}
            {/* plates */}
            <button onClick={() => setShowPlates((v) => !v)} style={{ marginTop: 16, background: "none", border: "none",
              color: C.faint, fontSize: 12, fontWeight: 500, cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 4 }}>
              Plates per side <ChevronDown size={14} style={{ transform: showPlates ? "rotate(180deg)" : "none", transition: ".2s" }} />
            </button>
            {showPlates && <PlateView total={recR} bar={bar} denoms={denoms} unit={unit} />}
          </>
        ) : (
          <div style={{ color: C.muted, fontSize: 14, padding: "20px 8px", lineHeight: 1.55 }}>
            Log a set below to calibrate <b style={{ color: C.text, fontWeight: 600 }}>{sel}</b>. Enter a known 1RM (1 rep @ RPE 10) or any working set.
          </div>
        )}
      </div>

      <div style={{ height: 1, background: C.line, margin: "20px -18px" }} />

      {/* log what you did */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 9 }}>
            <span style={label}>Log your top set</span>
          </span>
          {recR != null && <button onClick={useRec} style={{ background: "rgba(255,255,255,0.04)", border: `1px solid ${C.line2}`,
            color: C.muted, borderRadius: R.pill, padding: "7px 13px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Use recommendation</button>}
        </div>

        <div style={{ marginTop: 14 }}>
          {logDate === todayStr() && !showDate ? (
            <button onClick={() => setShowDate(true)} style={{ background: "none", border: "none", padding: 0,

            </button>

            <>
              <div style={{ ...label, fontSize: 10, marginBottom: 8 }}>
                Date{logDate !== todayStr() ? <span style={{ color: C.red }}> · backdated</span> : ""}

        {fromRec && (
          <div style={{ marginTop: 12 }}>
            <div style={{ fontSize: 11, color: C.muted, marginBottom: 7, fontWeight: 700 }}>How did it actually feel?</div>
