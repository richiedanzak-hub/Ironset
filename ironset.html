function loadState() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const p = JSON.parse(raw); return { ...DEFAULT, ...p, settings: { ...DEFAULT.settings, ...(p.settings || {}) } }; } } catch (e) {}

/* ----------------------------------------------------------------------------
   STRENGTH ENGINE
   Everything keys off one idea: an RPE-anchored set tells you how far from
   failure you were. RIR = 10 - RPE, so a set of `reps` at a given RPE is
   equivalent to doing `reps + RIR` reps to true failure. That single "reps to
   failure" number maps to a % of 1RM via the standard RPE/RTS chart. From there
   we can both estimate a 1RM from any set, and predict a weight for any target.
---------------------------------------------------------------------------- */

// % of 1RM for N reps taken to true failure (RPE 10). Standard RTS values.
const PCT = {
  1: 100.0, 2: 95.5, 3: 92.2, 4: 89.2, 5: 86.3, 6: 83.7, 7: 81.1, 8: 78.6,
  9: 76.2, 10: 73.9, 11: 70.7, 12: 68.0, 13: 65.3, 14: 62.6, 15: 59.9,
  16: 57.3, 17: 54.8, 18: 52.4, 19: 50.0, 20: 47.6,
};
function pctForN(n) {
  if (n <= 1) return 100;
  if (n >= 20) return PCT[20];
  const lo = Math.floor(n), hi = Math.ceil(n);
  if (lo === hi) return PCT[lo];
  return PCT[lo] + (PCT[hi] - PCT[lo]) * (n - lo); // linear interp for half-RPEs
}
const repsToFailure = (reps, rpe) => reps + Math.max(0, 10 - rpe);
// Observed estimated 1RM from a completed set.
function e1rmFromSet(weight, reps, rpe) {
  return weight / (pctForN(repsToFailure(reps, rpe)) / 100);
}
// Predict the weight for a prescribed (reps, rpe) given an estimated 1RM.
function weightForTarget(e1rm, reps, rpe) {
  return e1rm * (pctForN(repsToFailure(reps, rpe)) / 100);
}
// Confidence that a set's RPE rating is accurate. Near failure you can clearly feel
// "one, maybe two left"; on light sets the reps-in-reserve guess is fuzzy and can be off
// by a full point or more, so those sets should barely move the 1RM estimate. This is
// why a heavy RPE 9 set outweighs a light RPE 5 one even when the light set is newer.
function rpeConfidence(rpe) {
  return 0.2 + 0.8 * Math.max(0, Math.min(1, (rpe - 5) / 4)); // RPE5→.2, 7→.6, 8→.8, 9-10→1
}
// The rep→%1RM table is sharp at low reps and frays as reps climb (rep-endurance varies
// a lot between lifters), so long sets are noisier predictors regardless of effort.
function repsAccuracy(reps) {
  return reps <= 5 ? 1 : Math.max(0.5, 1 - (reps - 5) * 0.05); // 5→1, 10→.75, 15→.5
}
// How much a logged set should move the estimate: heaviest weight on hard, low-rep sets.
function reliability(reps, rpe) {
  return repsAccuracy(reps) * rpeConfidence(rpe);
}
// Fatigue model. A set spends capacity in proportion to volume (reps) and how close
// to failure it was — effort grows steeply toward RPE 10, so a grind costs far more
// than an easy set. The per-lifter sensitivity K is learned from their own history.
const DEFAULT_FATIGUE_K = 0.027;
function fatigueEffort(rpe) {
  const p = Math.max(0, (Math.min(10, rpe) - 4) / 6); // RPE6→.11, 8→.44, 9.5→.84, 10→1
  return p * p;
}
function fatigueDrop(reps, rpe, k) {
  // Volume cost: reps × how close to failure the set was.
  const volume = k * Math.max(1, reps) * fatigueEffort(rpe);
  // Neural cost: a hard top set taxes the CNS beyond its rep count — biggest for heavy
  // low-rep work, fading as reps climb (where volume already accounts for it). This is
  // what keeps the first back-off off a heavy single/triple from landing too high.
  const effort = Math.max(0, Math.min(1, (Math.min(10, rpe) - 4) / 6)); // RPE7→.5, 8→.67, 10→1
  const neural = 0.15 * effort / (1 + 0.35 * (Math.max(1, reps) - 1));
  return Math.max(0, Math.min(0.34, volume + neural));
}
// Learn how fast THIS lifter's capacity falls across a session, from descending
// (back-off) steps: each step's implied-1RM drop ÷ the prior set's fatigue stimulus.
// Median is robust to noise; the result is shrunk toward the default so sparse data
// stays sane and it only drifts to a personal value once there's real evidence.
function learnDropScale(sets, k, forTop) {
  // How much THIS lifter actually drops on a given transition type, learned per lift.
  // Top-set→first-back-off and back-off→back-off are learned SEPARATELY (forTop), since
  // many lifters barely drop off their top set but descend through their chain. Every
  // observation counts: holding or gaining strength into a back-off is the strongest
  // possible evidence of minimal drop, not noise to discard.
  const byDay = {};
  for (const s of sets) { const d = new Date(s.ts).toDateString(); (byDay[d] = byDay[d] || []).push(s); }
  const scales = [];
  for (const d in byDay) {
    const day = byDay[d].slice().sort((a, b) => a.ts - b.ts);
    for (let i = 0; i < day.length - 1; i++) {
      const a = day[i], b = day[i + 1];
      if (!b.backoff) continue;                 // only transitions INTO a back-off
      if (!a.backoff !== forTop) continue;      // split: top→BO1 vs BO→BO
      const ea = e1rmFromSet(a.weight, a.reps, a.rpe), eb = e1rmFromSet(b.weight, b.reps, b.rpe);
      if (!(ea > 0) || !(eb > 0)) continue;
      const obs = 1 - eb / ea;
      if (obs > 0.35) continue;
      const pred = fatigueDrop(a.reps, a.rpe, k);
      if (pred < 0.015) continue;
      const sc = obs <= 0.001 ? 0.2 : obs / pred; // held/gained → strongest low-drop evidence
      if (sc < 2.6) scales.push(Math.max(0.2, sc));
    }
  }
  if (!scales.length) return forTop ? 1.15 : 1.05; // no history: stay a touch cautious
  scales.sort((x, y) => x - y);
  const med = scales[Math.floor(scales.length / 2)], n = scales.length, W0 = 3;
  const blended = (n * med + W0 * 1.0) / (n + W0);
  return Math.max(0.2, Math.min(1.9, blended));
}
// Inverse of pctForN: max reps achievable at a given %1RM (lets % training show a
// predicted RPE/RIR, so the two styles speak the same language).
function repsAtPct(pct) {
  if (pct >= 100) return 1;
  let prev = 1, prevP = pctForN(1);
  for (let n = 2; n <= 24; n++) {
    const p = pctForN(n);
    if (p <= pct) return prev + (prevP - pct) / (prevP - p || 1);
    prev = n; prevP = p;
  }
  return 24;
}
// Fold the whole (time-ordered) history into a learned 1RM + a trajectory.
function buildModel(sets, allSets) {
  const sorted = [...sets].sort((a, b) => a.ts - b.ts);
  const ctx = allSets || sets;
  const rsc = learnRecoveryScale(ctx);
  let e = null;
  const points = [];
  for (const s of sorted) {
    const raw = e1rmFromSet(s.weight, s.reps, s.rpe);
    let obs = freshCorrect(raw, s, ctx, rsc);
    // The one guarantee that keeps check-ins honest, and it is worth stating in a
    // single line: a check-in can HOLD your estimate up, but it can never PUSH it up.
    // The correction is allowed to undo the drop a handicapped day would have caused
    // and not one pound more, so a rough day protects your max while a real PR is
    // still credited at exactly the weight you actually moved. Declaring yourself
    // wrecked can therefore never be used to talk your numbers upward.
    if (s.cond != null && s.cond < 1) obs = Math.min(obs, Math.max(e != null ? e : raw, raw));
    e = e == null ? obs : e + 0.35 * reliability(s.reps, s.rpe) * (obs - e);
    points.push({ ts: s.ts, value: e, obs });
  }
  const out = { e1rm: e, points, count: sorted.length };
  return out;
}

/* ----------------------------------------------------------------------------
   INSIGHT ENGINE — reads the data the app already has and turns it into plain
   reads. Pure local rules: strength trend, hidden gains from variations, RPE
   calibration, weak points. No AI/backend.
---------------------------------------------------------------------------- */
// A snapshot of everything logged today: which lifts, the top set on each, whether the
// session pushed any estimate to a new high, and total working/back-off set counts.
function sessionToday(state, models) {
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const t0 = start.getTime();
  const lifts = []; let totalSets = 0, backoffs = 0;
  for (const [name, ex] of Object.entries(state.exercises)) {
    const today = ex.sets.filter((s) => s.ts >= t0);
    if (!today.length) continue;
    const work = today.filter((s) => !s.backoff);
    const bo = today.filter((s) => s.backoff);
    totalSets += today.length; backoffs += bo.length;
    const pool = work.length ? work : today;
    const top = pool.reduce((a, b) => (b.weight > a.weight ? b : a), pool[0]);
    const m = models[name]; let e1rm = null, up = false;
    if (m && m.e1rm != null) {
      e1rm = m.e1rm; let before = null;
      for (const p of m.points) { if (p.ts < t0) before = p.value; else break; }
      up = before != null && e1rm - before > 0.5;
    }
    lifts.push({ name, top, e1rm, up, sets: today.length, bo: bo.length });
  }
  if (!lifts.length) return null;
  lifts.sort((a, b) => b.top.weight - a.top.weight);
  return { lifts, totalSets, backoffs, anyUp: lifts.some((l) => l.up) };
}

function analyze(state, models, unit) {
  const ex = state.exercises;
  const U = unit || "lb";
  const names = Object.keys(ex);
  const mains = names.filter((n) => !ex[n].parent && !isAccessory(n, state));
  const now = Date.now(), DAY = 864e5;
  const r1 = (x) => fmt(Math.round(x));
  const valueAt = (pts, t) => { let v = null; for (const p of pts) { if (p.ts <= t) v = p.value; else break; } return v; };
  const out = [];
  const add = (sev, title, detail, scope) => out.push({ id: (scope || "g") + "|" + title, sev, title, detail });

  // projected total + per-lift estimates
  const find = (kw) => mains.find((n) => n.toLowerCase() === kw) || mains.find((n) => n.toLowerCase().includes(kw));
  const S = find("squat"), B = find("bench"), D = find("deadlift");
  const parts = mains.filter((n) => models[n] && models[n].e1rm != null).map((n) => {
    const m = models[n]; const ago = valueAt(m.points, now - 30 * DAY);
    return { name: n, e1rm: m.e1rm, delta: ago != null ? m.e1rm - ago : null };
  });
  let total = null, totalDelta = null;
  if (S && B && D && models[S].e1rm != null && models[B].e1rm != null && models[D].e1rm != null) {
    total = models[S].e1rm + models[B].e1rm + models[D].e1rm;
    totalDelta = [S, B, D].reduce((acc, n) => { const a = valueAt(models[n].points, now - 30 * DAY); return acc + (a != null ? models[n].e1rm - a : 0); }, 0);
  }

  for (const M of mains) {
    const m = models[M]; if (!m || m.e1rm == null) continue;
    const pts = m.points, latest = m.e1rm, lastTs = pts.length ? pts[pts.length - 1].ts : null;
    const priorMax = pts.length > 1 ? Math.max(...pts.slice(0, -1).map((p) => p.value)) : -Infinity;
    let prFired = false;
    if (pts.length >= 4 && latest > priorMax + 0.5 && lastTs && now - lastTs < 21 * DAY) {
      add("win", "New " + M + " high", "Your estimated " + M + " 1RM just hit a new high of " + r1(latest) + " " + U + ".", M); prFired = true;
    }
    const ago30 = valueAt(pts, now - 30 * DAY);
    if (ago30 != null && ago30 > 0) {
      const d = latest - ago30, pct = (d / ago30) * 100, thr = Math.max(2, ago30 * 0.015);
      if (!prFired && d > thr) add("win", M + " trending up", "Up " + r1(d) + " " + U + " (" + pct.toFixed(1) + "%) over the last 30 days.", M);
      else if (d < -thr) add("watch", M + " slipping", "Down " + r1(-d) + " " + U + " over 30 days — could be fatigue or a rough stretch.", M);
    }
    const kids = names.filter((n) => ex[n].parent === M);
    if (kids.length) {
      const ownM = m.own && m.own.e1rm;
      const recentKids = kids.filter((k) => ex[k].sets.some((s) => now - s.ts < 21 * DAY));
      const kidLabel = (recentKids.length ? recentKids : kids).join(" & ");
      if (ownM == null) add("win", M + " from variations", "You haven't done straight " + M + " lately — based on your " + kidLabel + ", your " + M + " 1RM is about " + r1(latest) + " " + U + ".", M);
      else if (latest > ownM * 1.02) add("win", "Hidden " + M + " strength", "Your " + kidLabel + " suggests your " + M + " 1RM is ~" + r1(latest - ownM) + " " + U + " higher than your recent straight " + M + " shows (" + r1(latest) + " vs " + r1(ownM) + ").", M);
    }
    if (lastTs && now - lastTs > 14 * DAY && pts.length >= 4) add("note", M + " has gone quiet", Math.round((now - lastTs) / DAY) + " days since your last " + M + " work.", M);
  }

  for (const V of names) {
    const x = ex[V]; if (!x.parent || !ex[x.parent] || typeof x.ratioManual === "number") continue;
    const mv = models[V], own = mv && mv.own && mv.own.e1rm, ownP = models[x.parent] && models[x.parent].own && models[x.parent].own.e1rm;
    if (!own || !ownP) continue;
    const r = mv.ratio, base = typeof x.ratio === "number" ? x.ratio : defaultRatio(V), lc = V.toLowerCase();
    const zone = /block|board|pin|lockout|rack/.test(lc) ? "lockout strength" : /pause|deficit|bottom|dead\s*stop|tempo/.test(lc) ? "bottom-end strength" : "that range";
    if (r > base + 0.03) add("win", V + " catching up", "Your " + V + " is now " + Math.round(r * 100) + "% of " + x.parent + " (was ~" + Math.round(base * 100) + "%) — " + zone + " is improving.", V);
    else if (r < base - 0.04) add("watch", V + " lagging", "Your " + V + " has dropped to " + Math.round(r * 100) + "% of " + x.parent + " — " + zone + " may be a weak point.", V);
  }

  const recSets = [];
  for (const n of names) for (const s of ex[n].sets) if (s.fromRec && typeof s.tRpe === "number" && now - s.ts < 49 * DAY) recSets.push(s);
  if (recSets.length >= 4) {
    const errs = recSets.map((s) => s.rpe - s.tRpe);
    const bias = errs.reduce((a, b) => a + b, 0) / errs.length;
    const mae = errs.reduce((a, b) => a + Math.abs(b), 0) / errs.length;
    if (mae <= 0.6 && recSets.length >= 6) add("note", "Your RPE is dialed in", "Across your last " + recSets.length + " prescribed sets you're within ±" + mae.toFixed(1) + " RPE of target — trust your top sets.", "rpe");
    else if (bias >= 0.5) add("note", "Sets landing harder than asked", "On average ~" + bias.toFixed(1) + " RPE above target — the model is nudging your loads down to match.", "rpe");
    else if (bias <= -0.5) add("note", "More in the tank than you think", "Sets land ~" + Math.abs(bias).toFixed(1) + " RPE easier than asked — the model is nudging loads up.", "rpe");
    else if (mae >= 1.2) add("note", "RPE calls are swingy", "Your effort ratings vary ±" + mae.toFixed(1) + " RPE — an occasional set to true failure will recalibrate your gauge.", "rpe");
  }

  if (S && B && D && models[S].e1rm && models[B].e1rm && models[D].e1rm) {
    const sq = models[S].e1rm, be = models[B].e1rm;
    if (be / sq < 0.58) add("watch", "Bench is your lagging lift", "Your bench is " + Math.round((be / sq) * 100) + "% of your squat (typical is ~65–75%) — likely the biggest lever on your total.", "bal");
  }

  // Conditions: the read that answers "am I actually getting weaker, or was that
  // just a bad month?" — which is the only question a lifter asks after a rough
  // stretch, and the one the raw trend line answers badly.
  const condSets = [];
  for (const n of names) for (const s of ex[n].sets) if (s.cond != null && s.cond < 0.995 && now - s.ts < 28 * DAY) condSets.push(s);
  if (condSets.length >= 2) {
    const dayCount = new Set(condSets.map((s) => new Date(s.ts).toDateString())).size;
    const avgTrim = Math.round((1 - condSets.reduce((a, b) => a + b.cond, 0) / condSets.length) * 1000) / 10;
    add("note", "Training through rough conditions",
      dayCount + " recent session" + (dayCount > 1 ? "s were" : " was") + " logged under a check-in, with loads trimmed about " +
      avgTrim + "% on average. Those sets are being read in the conditions you actually lifted them in, so a bad stretch isn't quietly scored as lost strength.", "cond");
  } else if (!state.checkins || !Object.keys(state.checkins).length) {
    // Nobody discovers a feature they've never needed. This appears only for the
    // lifter whose own data already shows the problem it solves.
    const recentRec = [];
    for (const n of names) for (const s of ex[n].sets) if (!s.backoff && s.fromRec && s.tRpe != null && s.rpe != null && now - s.ts < 24 * DAY) recentRec.push(s);
    const misses = recentRec.filter((s) => s.rpe - s.tRpe >= 0.5).length;
    if (recentRec.length >= 3 && misses >= 2) {
      add("watch", "Sets landing harder than prescribed",
        misses + " of your last " + recentRec.length + " prescribed sets came in half an RPE or more above target. If life outside the gym is part of that — sleep, illness, a week away — the daily check-in on Train shades your loads to match, without marking a rough patch down as lost strength.", "cond-suggest");
    }
  }

  const rank = { alert: 0, win: 1, watch: 2, note: 3 };
  out.sort((a, b) => rank[a.sev] - rank[b.sev]);
  const big = {
    squat: S ? { name: S, e1rm: models[S].e1rm } : null,
    bench: B ? { name: B, e1rm: models[B].e1rm } : null,
    deadlift: D ? { name: D, e1rm: models[D].e1rm } : null,
  };
  return { total, totalDelta, parts, insights: out.slice(0, 8), big, session: sessionToday(state, models) };
}

/* ----------------------------------------------------------------------------
   SHARE CARDS — draw a clean, branded IRONSET image on a canvas (no deps,
   offline) and hand it to the iOS share sheet, with a save/preview fallback.
---------------------------------------------------------------------------- */
function _round(ctx, x, y, w, h, r) {
  ctx.beginPath();

// Round a raw axis step to a human number (1, 2, 2.5, 5, 10 x a power of ten), so the
// y-axis reads 575/600/625 instead of 586/616/647.
function niceStep(range, target) {
  const raw = (range || 1) / Math.max(1, target);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
}
// Catmull-Rom to cubic bezier, with control points clamped inside each segment so the
// curve stays smooth without ever overshooting a real logged value.
function smoothPath(pts) {
  if (pts.length < 2) return "";
  let d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
  const T = 0.2;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const lo = Math.min(p1[1], p2[1]), hi = Math.max(p1[1], p2[1]);
    const c1x = p1[0] + (p2[0] - p0[0]) * T, c2x = p2[0] - (p3[0] - p1[0]) * T;
    const c1y = Math.max(lo, Math.min(hi, p1[1] + (p2[1] - p0[1]) * T));
    const c2y = Math.max(lo, Math.min(hi, p2[1] - (p3[1] - p1[1]) * T));
    d += " C" + c1x.toFixed(1) + " " + c1y.toFixed(1) + ", " + c2x.toFixed(1) + " " + c2y.toFixed(1) +
         ", " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
  }
  return d;
}
function LineChart({ data, color = C.red, height = 176, unit = "" }) {
  const uid = useMemo(() => "c" + Math.random().toString(36).slice(2, 8), []);
  if (!data || data.length === 0)
    return <div style={{ color: C.faint, fontSize: 13, padding: "36px 4px", textAlign: "center" }}>No data yet — log a set to start your trend.</div>;
  const W = 320, H = height, gutter = 38, padR = 14, padT = 28, padB = 26;
  const xs = data.map((d) => d.ts), ys = data.map((d) => d.value);
  const lo = Math.min(...ys), hi = Math.max(...ys), mid = (lo + hi) / 2;
  // Keep small changes from looking like a cliff, then snap the window to round numbers.
  const half = Math.max(((hi - lo) / 2) * 1.3, mid * 0.045, 5);
  const step = niceStep(half * 2, 4);
  const minY = Math.floor((mid - half) / step) * step;
  const maxY = Math.ceil((mid + half) / step) * step;
  const ticks = [];
  for (let v = minY; v <= maxY + 0.001; v += step) ticks.push(v);
  const minX = Math.min(...xs), maxX = Math.max(...xs), spanX = maxX - minX || 1;
  const px = (t) => gutter + ((t - minX) / spanX) * (W - gutter - padR);
  const py = (v) => padT + (1 - (v - minY) / (maxY - minY)) * (H - padT - padB);
  const pts = data.map((d) => [px(d.ts), py(d.value)]);
  const line = smoothPath(pts);
  const base = (H - padB).toFixed(1);
  const area = pts.length > 1
    ? line + " L" + pts[pts.length - 1][0].toFixed(1) + " " + base + " L" + pts[0][0].toFixed(1) + " " + base + " Z" : "";
  const last = pts[pts.length - 1], lastVal = data[data.length - 1].value;
  const showBest = ys.indexOf(hi) !== data.length - 1 && data.length > 3 && hi - lastVal > (maxY - minY) * 0.04;
  const labW = 56, labX = Math.max(gutter, Math.min(last[0] - labW / 2, W - padR - labW));
  const labY = Math.max(15, last[1] - 24);
  return (
    <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", height: "auto", display: "block" }}>
      <defs>
        <linearGradient id={uid + "a"} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.32" />
          <stop offset="55%" stopColor={color} stopOpacity="0.10" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
        <linearGradient id={uid + "l"} x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="#6D7885" />
          <stop offset="60%" stopColor="#B4553F" />
          <stop offset="100%" stopColor={color} />
        </linearGradient>
      </defs>
      {ticks.map((v, i) => (
        <g key={i}>
          <line x1={gutter} x2={W - padR} y1={py(v)} y2={py(v)} stroke={C.line}
            strokeWidth="1" strokeDasharray="2 4" opacity="0.7" />
          <text x={gutter - 8} y={py(v) + 3} fill={C.faint} fontSize="8.5" fontFamily={MONO} textAnchor="end">{fmt(v)}</text>
        </g>
      ))}
      {showBest && (
        <g>
          <line x1={gutter} x2={W - padR} y1={py(hi)} y2={py(hi)} stroke={C.good} strokeWidth="1" strokeDasharray="3 3" opacity="0.4" />
          <text x={W - padR} y={py(hi) - 5} fill={C.good} fontSize="8" fontFamily={SANS} fontWeight="700" textAnchor="end" opacity="0.75">PEAK {fmt(Math.round(hi))}</text>
        </g>
      )}
      {pts.length > 1 && <path d={area} fill={"url(#" + uid + "a)"} />}
      {pts.length > 1 && <path d={line} fill="none" stroke={color} strokeWidth="7" strokeLinecap="round" strokeLinejoin="round" opacity="0.12" />}
      {pts.length > 1 && <path d={line} fill="none" stroke={"url(#" + uid + "l)"} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" />}
      <line x1={last[0]} x2={last[0]} y1={last[1]} y2={H - padB} stroke={color} strokeWidth="1" strokeDasharray="2 3" opacity="0.35" />
      <circle cx={last[0]} cy={last[1]} r="7" fill={color} opacity="0.2" />
      <circle cx={last[0]} cy={last[1]} r="3.6" fill={color} stroke="#0C0D10" strokeWidth="1.6" />
      <rect x={labX} y={labY - 12} width={labW} height="17" rx="5" fill="#20242C" stroke={C.line2} strokeWidth="1" />
      <text x={labX + labW / 2} y={labY} fill={C.text} fontSize="10" fontWeight="700" fontFamily={MONO} textAnchor="middle">
        {fmt(Math.round(lastVal))}{unit}
      </text>
      <line x1={gutter} x2={W - padR} y1={H - padB} y2={H - padB} stroke={C.line2} strokeWidth="1" />
      <text x={gutter} y={H - 8} fill={C.faint} fontSize="8.5" fontFamily={MONO}>{dshort(minX)}</text>
      <text x={W - padR} y={H - 8} fill={C.faint} fontSize="8.5" fontFamily={MONO} textAnchor="end">{dshort(maxX)}</text>
    </svg>
  );
}

const KEY = "lift-weight-suggester-v1";

  bodyweight: [], // [{id, ts, kg}]
  meet: { date: null, name: "", attempts: {} }, // attempts: { liftName: { opener, second, third } in kg }
  checkins: {}, // "YYYY-MM-DD" -> { score 1-10, gear: [..], ts }

};
// Default strength ratio of a variation to its main lift, guessed from its name.
const VAR_RATIOS = [
  [/front\s*squat/, 0.82], [/pause|paused|tempo|\bpin\b|dead\s*stop|bottom|deficit/, 0.9],
  [/spoto|larsen|close\s*grip|cgbp|2\s*ct|3\s*ct|count/, 0.93],
  [/block|board|rack|pin\s*press|touch\s*and\s*go|tng/, 1.04],
];
function defaultRatio(name) {
  const n = (name || "").toLowerCase();
  for (const [re, r] of VAR_RATIOS) if (re.test(n)) return r;
  return 0.9;
}
const PRESETS = ["Squat", "Bench Press", "Deadlift", "Overhead Press"];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function App() {
  const [state, setState] = useState(loadState);

  useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }, [state]);
  useEffect(() => { if (!sel) { const k = Object.keys(state.exercises); if (k.length) setSel(k[0]); } }, [state.exercises, sel]);

  // one-time repairs: (1) older builds switched the unit label without converting
  // stored loads; (2) stamp existing users as onboarded so they skip first-launch.
  useEffect(() => {
    setState((s) => {
      if (!s.settings) return s;
      let st = s;
      if (st.settings.unitSchema !== 2) {
        let exercises = st.exercises;
        if (st.settings.unit === "kg") {
          const f = 1 / LBKG, cv = (w) => (typeof w === "number" ? Math.round(w * f * 10) / 10 : w);
          exercises = {};
          for (const [k, e] of Object.entries(st.exercises))
            exercises[k] = { ...e, sets: e.sets.map((x) => ({ ...x, weight: cv(x.weight), rec: x.rec != null ? cv(x.rec) : x.rec })), tmax: e.tmax != null ? cv(e.tmax) : e.tmax };
        }
        st = { ...st, exercises, settings: { ...st.settings, unitSchema: 2 } };
      }

  const { unit, round, bar, inputMode } = state.settings;
  const denoms = unit === "kg" ? [25, 20, 15, 10, 5, 2.5, 1.25] : [45, 35, 25, 10, 5, 2.5];

  const models = useMemo(() => {
    const ex = state.exercises;
    const own = {};
    for (const [k, e] of Object.entries(ex)) own[k] = buildModel(e.sets.filter((s) => !s.backoff), e.sets);
    // ratio of a variation's strength to its parent: learned from own numbers, else default
    const ratioOf = (name) => {
      const x = ex[name];
      if (!x || !x.parent || !ex[x.parent]) return 1;
      if (typeof x.ratioManual === "number") return x.ratioManual;
      const a = own[name] && own[name].e1rm, b = own[x.parent] && own[x.parent].e1rm;
      if (a && b) return Math.min(1.2, Math.max(0.5, a / b));
      return typeof x.ratio === "number" ? x.ratio : 0.9;
    };
    // pooled main-equivalent estimate across a main lift + all its variations
    const famCache = {};
    const family = (root) => {
      if (famCache[root]) return famCache[root];
      const members = [root, ...Object.keys(ex).filter((k) => ex[k].parent === root)];
      const all = [];
      for (const m of members) {
        const r = m === root ? 1 : ratioOf(m);
        const rscM = learnRecoveryScale(ex[m].sets);
        for (const s of ex[m].sets) {
          if (s.backoff) continue;
          const ob = freshCorrect(e1rmFromSet(s.weight, s.reps, s.rpe), s, ex[m].sets, rscM);
          all.push({ ts: s.ts, obs: ob / r, reps: s.reps, rpe: s.rpe });
        }
      }
      all.sort((a, b) => a.ts - b.ts);
      let e = null; const points = [];
      for (const x of all) { e = e == null ? x.obs : e + 0.35 * reliability(x.reps, x.rpe) * (x.obs - e); points.push({ ts: x.ts, value: e }); }
      const out = { e1rm: e, points, count: all.length };
      famCache[root] = out; return out;
    };
    const view = {};
    for (const k of Object.keys(ex)) {
      const hasParent = ex[k].parent && ex[ex[k].parent];
      const root = hasParent ? ex[k].parent : k;
      const f = family(root);
      const r = root === k ? 1 : ratioOf(k);
      view[k] = {
        e1rm: f.e1rm != null ? f.e1rm * r : null,

  // Deleting a lift never destroys it outright — it moves to a recoverable bin, and any

      return { ...s, exercises: e, trash };

  };

/* ---- Inter-session (week-over-week) fatigue ---- */
// Work above ~RPE 8 leaves a recovery debt into the NEXT session of that lift. The
// debt scales with how far past 8 the sets went, decays over the days between
// sessions, and its true size is learned per lift from this lifter's own history —
// so a deadlift can learn a heavier carryover than a bench.
function strainExcess(rpe) {

//               wastes a session; being 3% light costs nothing, being 15% light ruins a day.

  // one odd session, and it shrinks toward a slightly-cautious prior until proven.

/* ----------------------------------------------------------------------------

   Residual fatigue above explains what your TRAINING did to you. It has no way of
   knowing you slept five hours, that the house has had flu for a fortnight, or that
   you left your belt at home and are lifting on a bar you've never touched. Those
   get declared rather than inferred, and they work exactly like fatigue does: they
   shade what gets PRESCRIBED today, and they are never allowed to mean you got
   weaker. Your estimated max stays anchored to what you can do rested and properly

// feels like. Under-trimming costs you a slightly easy session; over-trimming

  sleeves: { label: "No sleeves",  squat: 0.990, deadlift: 0.999, bench: 1.000, press: 1.000, other: 0.997 },

const isAccessory = (name, state) => {
  const ex = state && state.exercises && state.exercises[name];

};

const DAY_KEYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const MODES = [{ v: "rpe", t: "RPE" }, { v: "rir", t: "RIR" }, { v: "pct", t: "%" }];
const emptyWeek = (label) => ({ id: uid(), label, days: DAY_KEYS.reduce((a, d) => (a[d] = [], a), {}) });
const newProgram = () => ({ name: "My program", startDate: todayStr(), active: true, weeks: [emptyWeek("Week 1")] });
const newSlot = (name) => {
  const L = libFind(name);
  const mode = L ? L.d : "rpe";
  return { id: uid(), ex: name, role: L && L.m ? "main" : (L && L.d === "rpe" ? "main" : "accessory"),
    sets: 1, reps: mode === "rpe" ? 3 : 8, mode, val: mode === "rpe" ? 8 : mode === "rir" ? 2 : 75, bo: null, note: "" };
};
// Which week of the block today falls in. Blocks repeat, so a 4-week plan keeps
// running rather than falling off the end mid-prep.
function weekIndexFor(program, dateStr) {
  if (!program || !program.weeks || !program.weeks.length) return 0;
  const start = tsFromDateStr(program.startDate || todayStr());
  const d0 = new Date(start); d0.setHours(0, 0, 0, 0);
  const d1 = new Date(tsFromDateStr(dateStr)); d1.setHours(0, 0, 0, 0);
  const days = Math.floor((d1 - d0) / 86400000);
  if (days < 0) return 0;
  return Math.floor(days / 7) % program.weeks.length;
}
const dayKeyFor = (dateStr) => DAY_KEYS[(new Date(tsFromDateStr(dateStr)).getDay() + 6) % 7];
function slotsFor(program, dateStr) {
  if (!program || !program.active || !program.weeks || !program.weeks.length) return [];
  const w = program.weeks[weekIndexFor(program, dateStr)];
  return (w && w.days && w.days[dayKeyFor(dateStr)]) || [];
}
// Target effort in RPE terms, whatever language the slot was written in.
const slotRpe = (slot) => slot.mode === "rir" ? Math.max(5, Math.min(10, 10 - slot.val)) : slot.mode === "rpe" ? slot.val : 8;
const slotLabel = (slot) => slot.mode === "pct" ? `${fmt(slot.val)}%` : slot.mode === "rir" ? `${fmt(slot.val)} RIR` : `RPE ${fmt(slot.val)}`;
const slotSummary = (slot) => `${slot.sets > 1 ? slot.sets + "×" : ""}${slot.reps} @ ${slotLabel(slot)}`;

// Where the projected total comes from — each lift's contribution and its 30-day move.
function TotalSheet({ open, onClose, parts, models, total, unit }) {
  const now = Date.now(), CUT = now - 30 * 86400000;
  return (
    <Sheet open={open} onClose={onClose} title="Projected total">
      <div style={{ fontSize: 13, color: C.muted, lineHeight: 1.6, marginBottom: 14 }}>
        Your squat, bench and deadlift estimates added together — each one built from the sets you've
        logged, weighted toward your hardest and most recent work.
      </div>
      {(parts || []).map((p) => {
        const m = models[p.name], pts = m ? m.points : [];
        let then = null;
        for (const q of pts) { if (q.ts <= CUT) then = q.value; }
        const d = then != null ? p.e1rm - then : null;
        const share = total ? Math.round((p.e1rm / total) * 100) : 0;
        return (
          <div key={p.name} style={{ borderTop: `1px solid ${C.line}`, padding: "13px 0" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
              <span style={{ fontWeight: 700, fontSize: 14.5 }}>{p.name}</span>
              <span style={{ fontFamily: MONO, fontSize: 18, fontWeight: 700 }}>{fmt(Math.round(p.e1rm))}
                <span style={{ fontFamily: SANS, fontSize: 11, color: C.faint, marginLeft: 3 }}>{unit}</span></span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 5, fontSize: 11.5 }}>
              <span style={{ color: C.faint }}>{share}% of total</span>
              {d != null && Math.round(d) !== 0 && (
                <span style={{ color: d > 0 ? C.good : C.red, fontWeight: 700 }}>
                  {d > 0 ? "▲" : "▼"} {fmt(Math.abs(Math.round(d)))} in 30 days
                </span>
              )}
            </div>
            <div style={{ height: 4, borderRadius: 2, background: "rgba(255,255,255,0.05)", marginTop: 7, overflow: "hidden" }}>
              <div style={{ width: `${share}%`, height: "100%", background: G.blue, borderRadius: 2 }} />
            </div>
          </div>
        );
      })}
    </Sheet>
  );
}
// Where the week's tonnage came from — day by day, and which lifts carried it.
function LoadSheet({ open, onClose, state, unit }) {
  const cut = Date.now() - 7 * 86400000;
  const byDay = {}, byLift = {};
  for (const [name, ex] of Object.entries(state.exercises))
    for (const s of ex.sets) if (s.ts >= cut) {
      const k = new Date(s.ts).toDateString(), v = s.weight * Math.max(1, s.reps);
      byDay[k] = byDay[k] || { ton: 0, sets: 0 };
      byDay[k].ton += v; byDay[k].sets++;
      byLift[name] = (byLift[name] || 0) + v;
    }
  const days = Object.keys(byDay).sort((a, b) => new Date(b) - new Date(a));
  const peak = Math.max(1, ...days.map((d) => byDay[d].ton));
  const lifts = Object.entries(byLift).sort((a, b) => b[1] - a[1]);
  const tot = lifts.reduce((s, l) => s + l[1], 0);
  const k = (v) => (v >= 1000 ? (v / 1000).toFixed(1) + "k" : fmt(Math.round(v)));
  return (
    <Sheet open={open} onClose={onClose} title="7-day load">
      <div style={{ fontSize: 13, color: C.muted, lineHeight: 1.6, marginBottom: 14 }}>
        Total tonnage — every set's weight times its reps — across the last seven days. A rough
        read on how much work you've actually put in, separate from how hard it felt.
      </div>
      {days.length === 0 && <div style={{ fontSize: 13, color: C.faint }}>Nothing logged in the last week.</div>}
      {days.map((d) => (
        <div key={d} style={{ borderTop: `1px solid ${C.line}`, padding: "11px 0" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
            <span style={{ fontSize: 13, fontWeight: 700 }}>{dshort(new Date(d).getTime())}</span>
            <span style={{ fontFamily: MONO, fontSize: 13.5, fontWeight: 700 }}>{k(byDay[d].ton)}
              <span style={{ fontFamily: SANS, fontSize: 10.5, color: C.faint, marginLeft: 3 }}>{unit}</span></span>
          </div>
          <div style={{ height: 4, borderRadius: 2, background: "rgba(255,255,255,0.05)", marginTop: 6, overflow: "hidden" }}>
            <div style={{ width: `${(byDay[d].ton / peak) * 100}%`, height: "100%", background: G.amber, borderRadius: 2 }} />
          </div>
          <div style={{ fontSize: 11, color: C.faint, marginTop: 4 }}>{byDay[d].sets} sets</div>
        </div>
      ))}
      {lifts.length > 0 && (
        <div style={{ marginTop: 16 }}>
          <div style={{ ...label, fontSize: 9.5, marginBottom: 9 }}>By lift</div>
          <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
            {lifts.map(([n, v]) => <Tag key={n} color={C.amber}>{n} {Math.round((v / tot) * 100)}%</Tag>)}
          </div>
        </div>
      )}
    </Sheet>
  );
}
// Tapping readiness opens the reasoning: which session cost what, and how it clears.
function ReadinessSheet({ open, onClose, rows }) {
  return (
    <Sheet open={open} onClose={onClose} title="Why this score">
      <div style={{ fontSize: 13, color: C.muted, lineHeight: 1.6, marginBottom: 14 }}>
        Readiness is built per lift from work you logged above roughly RPE 8. Each hard session
        leaves a debt that decays over the days after it, and IRONSET learns how fast you personally
        clear it. It trims prescribed loads by at most {Math.round(TRIM_CAP * 100)}%.
      </div>
      {rows.map((r) => (
        <div key={r.name} style={{ borderTop: `1px solid ${C.line}`, padding: "13px 0" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
            <span style={{ fontWeight: 700, fontSize: 14.5 }}>{r.name}</span>
            <span style={{ fontFamily: MONO, fontSize: 17, fontWeight: 700, color: freshColor(r.pct) }}>{r.pct}</span>
          </div>
          <div style={{ fontSize: 12, color: C.faint, marginTop: 5, lineHeight: 1.5 }}>
            {r.trim >= 0.01
              ? `Loads trimmed ${fmt(Math.round(r.trim * 1000) / 10)}%${r.peak ? ` — hardest recent work was RPE ${fmt(r.peak)}${r.days ? `, ${r.days}d ago` : ""}` : ""}.`
              : "Nothing recent still weighing on this lift — prescriptions run at full strength."}
          </div>
        </div>
      ))}
      <div style={{ fontSize: 11.5, color: C.faint, marginTop: 14, lineHeight: 1.55 }}>
        100 means fully recovered. The scale is deliberately sensitive, so a genuinely hard week
        shows up rather than hiding in the high 90s.
      </div>
    </Sheet>
  );
}
function DashboardTab({ state, models, analysis, unit, setTab, setState, setSel }) {
  const [share, setShare] = useState(null);
  const [why, setWhy] = useState(false);
  const [showTotal, setShowTotal] = useState(false);
  const [showLoad, setShowLoad] = useState(false);
  const now = Date.now();
  const mains = Object.entries(state.exercises).filter(([n, e]) => !e.parent && e.sets.length && !isAccessory(n, state));
  const fresh = mains.map(([name, ex]) => {
    const rr = residualFatigue(ex.sets, now, true), sc = learnRecoveryScale(ex.sets);
    return { name, pct: readinessFor(rr.raw, sc), trim: trimFor(rr.raw, sc), peak: rr.peak, days: rr.days };
  }).sort((a, b) => a.pct - b.pct);
  const trainScore = fresh.length ? Math.round(fresh.reduce((s, r) => s + r.pct, 0) / fresh.length) : 100;
  // A card titled "Readiness · Today" cannot only know what your training did to you.
  // Declared life readiness lands on the same scale as predicted training debt, so
  // one number answers the question the card is actually asking. Kit is deliberately
  // left out of it: forgetting a belt says nothing about how recovered you are.
  const ckToday = checkinOn(state, todayStr());
  const lifeM = ckToday ? readyInfo(ckToday.score).m : 1;
  const score = Math.max(15, Math.min(100, Math.round(trainScore - (Math.max(0, 1 - lifeM) / READY_SPAN) * 62)));
  const sc = freshColor(score);
  // Copy reads the individual lifts, not just the average — a 90 overall means nothing
  // if your squat is sitting at 72.
  const listOf = (a) => (a.length === 1 ? a[0] : a.length === 2 ? `${a[0]} and ${a[1]}`
    : `${a.slice(0, -1).join(", ")} and ${a[a.length - 1]}`);
  const hot = fresh.filter((r) => r.pct < 80).map((r) => r.name);
  const mid = fresh.filter((r) => r.pct >= 80 && r.pct < 92).map((r) => r.name);
  const okL = fresh.filter((r) => r.pct >= 92).map((r) => r.name);
  const worst = fresh.length ? fresh[0].pct : 100;
  const status = !fresh.length ? "Ready to work"
    : worst >= 92 ? "Primed to train"
    : hot.length && okL.length ? "Split readiness"
    : worst >= 80 ? "Ready to work"
    : worst >= 62 ? "Carrying fatigue" : "Focus on recovery";
  const note = (() => {
    if (!fresh.length) return "Log a few sets and readiness starts tracking.";
    if (hot.length && okL.length) return `${listOf(hot)} still recovering — ${listOf(okL)} ready to push.`;
    if (hot.length && mid.length) return `${listOf(hot)} needs care today; ${listOf(mid)} is close.`;
    if (hot.length) return `${listOf(hot)} still carrying real fatigue. Keep today controlled.`;
    if (mid.length && okL.length) return `${listOf(mid)} slightly taxed — ${listOf(okL)} good to go.`;
    if (mid.length) return "Everything is a touch taxed. Good day for quality work.";
    return "Everything has cleared. Good day to chase a top set.";
  })();
  const week = (() => {
    const cut = now - 7 * 86400000;
    let tonnage = 0, sets = 0; const days = new Set();
    for (const ex of Object.values(state.exercises))
      for (const s of ex.sets) if (s.ts >= cut) {
        tonnage += s.weight * Math.max(1, s.reps); sets++; days.add(new Date(s.ts).toDateString());

    return { tonnage: Math.round(tonnage), sets, days: days.size };
  })();
  const liftCards = Object.entries(state.exercises)
    .filter(([n, e]) => !e.parent && e.sets.length && models[n] && models[n].e1rm != null && !isAccessory(n, state))

    .sort((a2, b2) => b2.e1rm - a2.e1rm);
  const bwKg = state.bodyweight && state.bodyweight.length ? state.bodyweight[state.bodyweight.length - 1].kg : null;
  const dots = (bwKg && analysis.total != null)
    ? Math.round(toKg(analysis.total, unit) * dotsCoeff(bwKg, (state.settings && state.settings.sex) || "male")) : null;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
          <span style={{ ...label, fontSize: 9.5 }}>Readiness · Today</span>
          <span style={{ display: "flex", alignItems: "center", gap: 2 }}>
            <button aria-label="Share readiness" onClick={() => doShare(setShare, { type: "stat", label: "Readiness",
              value: String(score), unit: "/100",
              sub: fresh.slice(0, 3).map((r) => `${r.name} ${r.pct}`).join("    "),
              date: new Date().toLocaleDateString(undefined, { month: "short", day: "numeric" }) })}

            <span style={{ fontFamily: MONO, fontSize: 52, fontWeight: 700, lineHeight: 0.9, letterSpacing: "-0.05em",
              color: C.text, textShadow: `0 0 40px ${sc}66` }}>{score}</span>

          </div>
          <div style={{ minWidth: 0 }}>

            <div style={{ fontSize: 12, color: C.muted, marginTop: 4, lineHeight: 1.45 }}>{note}</div>
          </div>
        </div>
        {ckToday ? (
          <div onClick={() => setTab("train")} style={{ marginTop: 12, display: "flex", alignItems: "center",
            justifyContent: "space-between", gap: 10, cursor: "pointer", background: "rgba(255,255,255,0.03)",
            border: `1px solid ${C.line}`, borderRadius: 12, padding: "9px 12px" }}>
            <span style={{ fontSize: 11.5, color: C.muted, fontWeight: 600 }}>
              Checked in <b style={{ color: C.text }}>{ckToday.score} · {readyInfo(ckToday.score).t}</b>
              {(ckToday.gear || []).length ? <span style={{ color: C.faint }}> · {(ckToday.gear || []).length} kit note{(ckToday.gear || []).length > 1 ? "s" : ""}</span> : null}
            </span>
            <span style={{ fontFamily: MONO, fontSize: 11, color: C.faint, fontWeight: 700 }}>edit</span>
          </div>
        ) : (
          <div onClick={() => setTab("train")} style={{ marginTop: 12, display: "flex", alignItems: "center",
            justifyContent: "space-between", gap: 10, cursor: "pointer", background: "rgba(255,255,255,0.03)",
            border: `1px solid ${C.line}`, borderRadius: 12, padding: "9px 12px" }}>
            <span style={{ fontSize: 11.5, color: C.muted, fontWeight: 600 }}>

            </span>
            <span style={{ fontFamily: MONO, fontSize: 11, color: C.red, fontWeight: 700 }}>add</span>
          </div>
        )}
        {fresh.length > 0 && (
          <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 8 }}>
            {fresh.map((r) => (
              <div key={r.name}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>

      <Grid2>

                value: fmt(Math.round(analysis.total)), unit,

                sub: (analysis.parts || []).slice(0, 3).map((p) => `${p.name} ${fmt(Math.round(p.e1rm))}`).join("    "),
                date: new Date().toLocaleDateString(undefined, { month: "short", day: "numeric" }) })}

            {analysis.total != null ? fmt(Math.round(analysis.total)) : "—"}

// The 1-10 strip. One tap sets it — no dragging, no confirming, no modal.

          <button key={v} onClick={() => onChange(v)} style={{

            background: on ? G.red : "rgba(255,255,255,0.03)",
            color: on ? "#fff" : C.faint, fontFamily: MONO, fontSize: 13, fontWeight: 700,

// Today's check-in. The only place in the app where the lifter tells the engine
// something it had no way of working out for itself.
function CheckinCard({ state, setState, sel, dateStr }) {
  const day = dateStr || todayStr();
  const ck = checkinOn(state, day);
  const [open, setOpen] = useState(false);
  const cls = liftClass(sel);
  const write = (patch) => setState((st) => {
    const cur = (st.checkins || {})[day] || { score: READY_DEFAULT, gear: [] };
    return { ...st, checkins: { ...(st.checkins || {}), [day]: { ...cur, ...patch, ts: Date.now() } } };
  });
  const toggleGear = (g) => {
    const cur = (ck && ck.gear) || [];
    write({ gear: cur.indexOf(g) >= 0 ? cur.filter((x) => x !== g) : cur.concat([g]) });
  };
  const factor = conditionFactor(ck, cls);
  const trim = Math.round((1 - factor) * 1000) / 10;
  const editing = open || !ck;
  const info = ck ? readyInfo(ck.score) : null;
  return (
    <Card accent={C.blue}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 9 }}>
          <span style={{ width: 3, height: 14, borderRadius: 2, background: C.blue, boxShadow: `0 0 10px ${C.blue}88` }} />
          <span style={{ ...label, fontSize: 9.5 }}>{day === todayStr() ? "Today's check-in" : "Check-in · " + dshort(tsFromDateStr(day))}</span>
        </span>
        {ck && <button onClick={() => setOpen((v) => !v)} style={{ background: "none", border: "none",
          color: C.red, fontWeight: 800, fontSize: 11.5, cursor: "pointer", padding: 0 }}>{open ? "Done" : "Change"}</button>}
      </div>

      {!editing ? (
        <div style={{ marginTop: 10, display: "flex", alignItems: "baseline", gap: 11, flexWrap: "wrap" }}>
          <span style={{ fontFamily: MONO, fontSize: 27, fontWeight: 700, letterSpacing: "-0.04em", lineHeight: 1 }}>{ck.score}</span>
          <span style={{ fontSize: 14.5, fontWeight: 800, color: C.text, letterSpacing: "-0.01em" }}>{info.t}</span>
          {trim > 0
            ? <span style={{ fontFamily: MONO, fontSize: 11.5, color: C.gold, fontWeight: 700 }}>loads −{trim}%</span>
            : <span style={{ fontFamily: MONO, fontSize: 11.5, color: C.faint, fontWeight: 700 }}>loads as normal</span>}
          {(ck.gear || []).length > 0 && (
            <span style={{ fontSize: 11.5, color: C.faint, width: "100%" }}>
              {(ck.gear || []).map((g) => GEAR[g] && GEAR[g].label).filter(Boolean).join(" · ")}
            </span>
          )}
        </div>
      ) : (
        <>
          <div style={{ fontSize: 12, color: C.faint, marginTop: 5, lineHeight: 1.5 }}>
            Sleep, stress, illness, food, life outside the gym. 8 is an ordinary day.
          </div>
          {/* Setting the number must not snap the card shut — kit and the explanation
              live below it, and the first tap is exactly when they matter most. */}
          <ReadinessStrip value={ck ? ck.score : null} onChange={(v) => { write({ score: v }); setOpen(true); }} />
          {ck && (
            <>
              <div style={{ fontSize: 13, fontWeight: 800, color: C.text, marginTop: 11 }}>
                {ck.score} · {info.t}
              </div>
              <div style={{ ...label, fontSize: 9, marginTop: 15, marginBottom: 8 }}>Kit &amp; venue</div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {GEAR_KEYS.map((g) => (
                  <Chip key={g} sm active={(ck.gear || []).indexOf(g) >= 0} onClick={() => toggleGear(g)}>{GEAR[g].label}</Chip>
                ))}
              </div>
              <div style={{ fontSize: 11.5, color: C.muted, marginTop: 13, lineHeight: 1.55,
                borderTop: `1px solid ${C.line}`, paddingTop: 11 }}>
                {trim > 0
                  ? <>Today&rsquo;s suggested loads drop <b style={{ color: C.gold }}>{trim}%</b>{sel ? <> for {sel}</> : null}. Your estimated max is left exactly where it is — a rough day changes what you&rsquo;re asked to lift, never what you&rsquo;re capable of.</>
                  : <>Loads run as normal. Drop the number on a day sleep, stress or illness has caught up with you and the suggestions follow, without touching your estimated max.</>}
              </div>
            </>
          )}
        </>
      )}
    </Card>
  );
}

// Pick a movement out of the library (or name your own). Search first, because by

  const hits = LIB.filter((x) => (!query || x.n.toLowerCase().includes(query))
    && (query || !cat || x.c === cat) && (query || !eq || x.e === eq));
  const own = (existing || []).filter((n) => !libFind(n) && (!query || n.toLowerCase().includes(query)));
  const canCustom = query.length > 1 && !LIB.some((x) => x.n.toLowerCase() === query) && !(existing || []).some((n) => n.toLowerCase() === query);
  const eqName = (k) => { const E = LIB_EQUIP.find((x) => x.k === k); return E ? E.t : ""; };
  return (

      <input value={q} onChange={(e) => setQ(e.target.value)} placeholder={`Search ${LIB.length} movements…`} autoFocus
        style={{ width: "100%", background: "rgba(0,0,0,0.35)", border: `1px solid ${C.line2}`, borderRadius: R.input,
          padding: "12px 13px", color: C.text, fontFamily: SANS, fontSize: 15, outline: "none", marginBottom: 11 }} />
      {!query && (
        <>
          <div style={{ display: "flex", gap: 5, overflowX: "auto", paddingBottom: 6, margin: "0 -4px 2px", padding: "0 4px 6px" }}>
            <Chip sm active={!cat} onClick={() => setCat(null)}>All</Chip>
            {LIB_CATS.map((c) => <Chip key={c.k} sm active={cat === c.k} onClick={() => setCat(c.k)}>{c.t}</Chip>)}
          </div>
          <div style={{ display: "flex", gap: 5, overflowX: "auto", margin: "0 -4px 10px", padding: "0 4px 6px" }}>
            <Chip sm active={!eq} onClick={() => setEq(null)}>Any kit</Chip>
            {LIB_EQUIP.map((c) => <Chip key={c.k} sm active={eq === c.k} onClick={() => setEq(c.k)}>{c.t}</Chip>)}
          </div>
        </>
      )}
      {canCustom && (
        <Btn kind="solid" style={{ width: "100%", marginBottom: 12 }} onClick={() => { onPick(q.trim()); onClose(); }}>
          <Plus size={15} /> Add "{q.trim()}" as a custom movement
        </Btn>
      )}
      <div style={{ ...label, fontSize: 9, marginBottom: 6 }}>
        {own.length + hits.length} movement{own.length + hits.length === 1 ? "" : "s"}
      </div>
      <div style={{ maxHeight: "52vh", overflowY: "auto", margin: "0 -4px", padding: "0 4px" }}>
        {own.map((n) => (
          <button key={n} onClick={() => { onPick(n); onClose(); }} style={pickRow}>
            <span style={{ fontWeight: 700, fontSize: 13.5, textAlign: "left" }}>{n}</span>
            <span style={{ fontSize: 10.5, color: C.faint, fontFamily: MONO }}>yours</span>
          </button>
        ))}
        {hits.map((x) => (
          <button key={x.n} onClick={() => { onPick(x.n); onClose(); }} style={pickRow}>
            <span style={{ minWidth: 0, flex: 1 }}>
              <span style={{ display: "block", fontWeight: 700, fontSize: 13.5, textAlign: "left" }}>{x.n}</span>
              <span style={{ display: "block", fontSize: 10.5, color: C.faint, fontFamily: MONO, marginTop: 2, textAlign: "left" }}>
                {eqName(x.e)}{x.m ? ` · feeds ${x.m} at ${Math.round(x.r * 100)}%` : ` · ${x.d === "rpe" ? "RPE" : x.d === "pct" ? "%" : "RIR"}`}
              </span>
            </span>
          </button>
        ))}
        {!hits.length && !own.length && !canCustom && (
          <div style={{ color: C.faint, fontSize: 13, textAlign: "center", padding: "22px 0" }}>Nothing matches that.</div>
        )}
      </div>
    </Sheet>
  );
}
const pickRow = { width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10,
  background: "none", border: "none", borderBottom: `1px solid ${C.line}`, color: C.text, padding: "12px 2px",
  cursor: "pointer", fontFamily: SANS, WebkitTapHighlightColor: "transparent" };

// One movement in one day. Collapsed it is a single readable line; a day of eight
// movements should fit on a screen, not demand eight cards of steppers.
function SlotCard({ slot, onChange, onDelete, onRename }) {
  const [open, setOpen] = useState(false);
  const up = (patch) => onChange({ ...slot, ...patch });
  const modeVal = { rpe: { step: 0.5, min: 5, max: 10 }, rir: { step: 0.5, min: 0, max: 6 }, pct: { step: 2.5, min: 30, max: 105 } }[slot.mode];
  return (
    <Card style={{ padding: 0, marginBottom: 9, overflow: "hidden" }}>
      <button onClick={() => setOpen((v) => !v)} style={{ width: "100%", background: "none", border: "none",
        padding: "13px 14px", cursor: "pointer", display: "flex", alignItems: "center", gap: 10, textAlign: "left",
        color: C.text, WebkitTapHighlightColor: "transparent" }}>
        <span style={{ width: 3, height: 26, borderRadius: 2, flexShrink: 0,
          background: slot.role === "main" ? C.red : C.blue, boxShadow: `0 0 10px ${slot.role === "main" ? C.red : C.blue}66` }} />
        <span style={{ minWidth: 0, flex: 1 }}>
          <span style={{ display: "block", fontWeight: 800, fontSize: 13.5, whiteSpace: "nowrap",
            overflow: "hidden", textOverflow: "ellipsis" }}>{slot.ex}</span>
          <span style={{ display: "block", fontFamily: MONO, fontSize: 11.5, color: C.muted, marginTop: 3 }}>
            {slotSummary(slot)}{slot.bo ? ` + ${slot.bo.sets}×${slot.bo.reps} @ ${slot.bo.mode === "pct" ? fmt(slot.bo.val) + "%" : slot.bo.mode === "rir" ? fmt(slot.bo.val) + " RIR" : "RPE " + fmt(slot.bo.val)}` : ""}
          </span>
        </span>
        <ChevronDown size={16} style={{ color: C.faint, flexShrink: 0, transform: open ? "rotate(180deg)" : "none", transition: ".2s" }} />
      </button>
      {open && (
        <div style={{ padding: "0 14px 14px", borderTop: `1px solid ${C.line}` }}>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", margin: "13px 0" }}>
            <Chip sm active={slot.role === "main"} onClick={() => up({ role: "main" })}>Counts toward strength</Chip>
            <Chip sm active={slot.role === "accessory"} onClick={() => up({ role: "accessory" })}>Accessory</Chip>
          </div>
          <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
            <div>
              <div style={{ fontSize: 10.5, color: C.muted, marginBottom: 5, fontWeight: 700 }}>Sets</div>
              <Stepper compact value={slot.sets} min={1} max={12} onChange={(v) => up({ sets: v })} />
            </div>
            <div>
              <div style={{ fontSize: 10.5, color: C.muted, marginBottom: 5, fontWeight: 700 }}>Reps</div>
              <Stepper compact value={slot.reps} min={1} max={30} onChange={(v) => up({ reps: v })} />
            </div>
            <div>
              <div style={{ fontSize: 10.5, color: C.muted, marginBottom: 5, fontWeight: 700 }}>{slot.mode === "pct" ? "% of max" : slot.mode.toUpperCase()}</div>
              <Stepper compact value={slot.val} step={modeVal.step} min={modeVal.min} max={modeVal.max} onChange={(v) => up({ val: v })} />
            </div>
          </div>
          <div style={{ marginTop: 13 }}>
            <div style={{ fontSize: 10.5, color: C.muted, marginBottom: 6, fontWeight: 700 }}>Prescribe this one in</div>
            <Segmented value={slot.mode} onChange={(m) => up({ mode: m, val: m === "pct" ? 75 : m === "rir" ? 2 : 8 })} options={MODES.map((m) => ({ value: m.v, label: m.t }))} />
          </div>
          <div style={{ height: 1, background: C.line, margin: "14px -14px" }} />
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
