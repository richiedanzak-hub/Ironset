}

// Most weeks of a block are the previous week with the top sets nudged. Cloning is
// therefore the primary way a week gets built, not a convenience bolted on after.
function CloneSheet({ open, onClose, onClone, fromLabel }) {
  const RULES = [
    { k: "same", t: "Repeat exactly", d: "Same movements, same targets." },
    { k: "rpe", t: "+0.5 RPE on main work", d: "Same loads asked harder — the usual way a block tightens." },
    { k: "pct", t: "+2.5% on anything by percent", d: "Moves percentage-based slots up a notch." },
    { k: "rep", t: "−1 rep on main work", d: "Same effort, heavier bar — intensification." },
  ];
  return (
    <Sheet open={open} onClose={onClose} title={`Clone ${fromLabel || "week"}`}>
      <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14, lineHeight: 1.55 }}>
        Copies every day into a new week, then applies one progression rule to the slots you marked as counting toward strength. Accessories are copied untouched.
      </div>
      {RULES.map((r) => (
        <button key={r.k} onClick={() => { onClone(r.k); onClose(); }} style={{ width: "100%", textAlign: "left",
          background: G.card, border: `1px solid ${C.line2}`, borderRadius: R.surface, padding: "14px 15px",
          cursor: "pointer", color: C.text, marginBottom: 9, WebkitTapHighlightColor: "transparent" }}>
          <div style={{ fontWeight: 800, fontSize: 14 }}>{r.t}</div>
          <div style={{ fontSize: 12, color: C.muted, marginTop: 4, lineHeight: 1.5 }}>{r.d}</div>
        </button>
      ))}
    </Sheet>
  );
}

function ProgramTab({ state, setState, setTab, setSel }) {
  const program = state.program || null;
  const [wi, setWi] = useState(() => (state.program ? weekIndexFor(state.program, todayStr()) : 0));
  const [day, setDay] = useState(dayKeyFor(todayStr()));
  const [picking, setPicking] = useState(null);   // null | {mode:"add"} | {mode:"swap", id}
  const [cloning, setCloning] = useState(false);
  const setProgram = (fn) => setState((s) => ({ ...s, program: typeof fn === "function" ? fn(s.program) : fn }));

  if (!program) {
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <Card style={{ textAlign: "center", padding: "30px 20px" }}>
          <div style={{ fontFamily: DISPLAY, fontWeight: 700, fontSize: 24, letterSpacing: "0.04em" }}>BUILD A PROGRAM</div>
          <div style={{ fontSize: 13.5, color: C.muted, marginTop: 10, lineHeight: 1.6 }}>
            Lay out your week once — main work, variations, accessories — and Train opens each day already loaded.
            Every load still comes from your own estimator; the program only decides what you&rsquo;re doing, never how heavy.
          </div>
          <Btn kind="primary" style={{ width: "100%", marginTop: 20 }} onClick={() => setProgram(newProgram())}>Start building</Btn>
        </Card>
        <div style={{ fontSize: 11.5, color: C.faint, textAlign: "center", lineHeight: 1.6 }}>
          Nothing here is required. Skip it and the app works exactly as it does now.
        </div>
      </div>
    );
  }

  const weeks = program.weeks || [];
  const week = weeks[Math.min(wi, weeks.length - 1)] || weeks[0];
  const slots = (week && week.days && week.days[day]) || [];
  const liveWeek = weekIndexFor(program, todayStr());

  const writeSlots = (next) => setProgram((pr) => ({
    ...pr, weeks: pr.weeks.map((w, i) => i !== wi ? w : { ...w, days: { ...w.days, [day]: next } }) }));
  const addSlot = (name) => writeSlots([...slots, newSlot(name)]);
  const swapSlot = (id, name) => writeSlots(slots.map((s) => s.id === id ? { ...newSlot(name), id: s.id, sets: s.sets, reps: s.reps, mode: s.mode, val: s.val, bo: s.bo } : s));
  const cloneWeek = (rule) => setProgram((pr) => {
    const src = pr.weeks[wi];
    const bump = (sl) => {
      if (sl.role !== "main") return { ...sl, id: uid() };
      if (rule === "rpe" && sl.mode === "rpe") return { ...sl, id: uid(), val: Math.min(10, sl.val + 0.5) };
      if (rule === "rpe" && sl.mode === "rir") return { ...sl, id: uid(), val: Math.max(0, sl.val - 0.5) };
      if (rule === "pct" && sl.mode === "pct") return { ...sl, id: uid(), val: Math.min(105, sl.val + 2.5) };
      if (rule === "rep") return { ...sl, id: uid(), reps: Math.max(1, sl.reps - 1) };
      return { ...sl, id: uid() };
    };
    const days = DAY_KEYS.reduce((a, d) => (a[d] = (src.days[d] || []).map(bump), a), {});
    const next = { id: uid(), label: "Week " + (pr.weeks.length + 1), days };
    return { ...pr, weeks: [...pr.weeks, next] };
  });

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card accent={C.red}>
        <input value={program.name} onChange={(e) => setProgram((pr) => ({ ...pr, name: e.target.value }))}
          style={{ width: "100%", background: "none", border: "none", outline: "none", color: C.text,
            fontFamily: SANS, fontWeight: 800, fontSize: 21, letterSpacing: "-0.02em", padding: 0 }} />
        <div style={{ display: "flex", gap: 12, marginTop: 14, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div style={{ flex: "1 1 150px" }}>
            <div style={{ fontSize: 10.5, color: C.muted, marginBottom: 6, fontWeight: 700 }}>Block starts</div>
            <input type="date" value={program.startDate} onChange={(e) => setProgram((pr) => ({ ...pr, startDate: e.target.value || todayStr() }))}
              style={{ width: "100%", background: "rgba(0,0,0,0.35)", border: `1px solid ${C.line}`, borderRadius: R.input,
                padding: "0 13px", height: 44, color: C.text, fontFamily: MONO, fontSize: 14.5, fontWeight: 700,
                outline: "none", colorScheme: "dark" }} />
          </div>
          <Btn kind={program.active ? "solid" : "ghost"} style={{ minHeight: 44, fontSize: 12.5 }}
            onClick={() => setProgram((pr) => ({ ...pr, active: !pr.active }))}>
            {program.active ? <><Check size={15} /> Running</> : "Paused"}
          </Btn>
        </div>
        <div style={{ fontSize: 11.5, color: C.faint, marginTop: 11, lineHeight: 1.5 }}>
          {program.active
            ? <>Today is <b style={{ color: C.text }}>{(weeks[liveWeek] || {}).label}</b>, {dayKeyFor(todayStr())}. The block repeats once it runs out.</>
            : "Paused — Train won't pre-load anything until you start it again."}
        </div>
      </Card>

      <div>
        <SectionHead accent={C.blue} right={
          <button onClick={() => setCloning(true)} style={{ background: "none", border: "none", color: C.red,
            fontWeight: 800, fontSize: 11.5, cursor: "pointer", padding: 0 }}>Clone week</button>
        }>Weeks</SectionHead>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {weeks.map((w, i) => (
            <Chip key={w.id} active={i === wi} onClick={() => setWi(i)}>
              {w.label}{i === liveWeek && program.active ? " ·now" : ""}
            </Chip>
          ))}
          {weeks.length > 1 && (
            <Chip sm onClick={() => { if (weeks.length <= 1) return; setProgram((pr) => ({ ...pr, weeks: pr.weeks.filter((_, i) => i !== wi) })); setWi(0); }}>
              <Trash2 size={13} />
            </Chip>
          )}
        </div>
      </div>

      <div>
        <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginBottom: 13 }}>
          {DAY_KEYS.map((d) => {
            const n = ((week && week.days && week.days[d]) || []).length;
            return <Chip key={d} sm active={d === day} onClick={() => setDay(d)}>{d}{n ? ` ·${n}` : ""}</Chip>;
          })}
        </div>
        {slots.map((sl, i) => (
          <SlotCard key={sl.id} slot={sl}
            onChange={(next) => writeSlots(slots.map((x) => x.id === sl.id ? next : x))}
            onDelete={() => writeSlots(slots.filter((x) => x.id !== sl.id))}
            onRename={() => setPicking({ mode: "swap", id: sl.id })} />
        ))}
        {!slots.length && (
          <Card style={{ textAlign: "center", color: C.muted, fontSize: 13, padding: "24px 16px", lineHeight: 1.6 }}>
            Nothing on {day} in {week ? week.label : "this week"}. A rest day is a perfectly good answer.
          </Card>
        )}
        <Btn kind="solid" style={{ width: "100%", marginTop: 10 }} onClick={() => setPicking({ mode: "add" })}>
          <Plus size={16} /> Add movement to {day}
        </Btn>
      </div>

      <ExercisePicker open={!!picking} onClose={() => setPicking(null)} existing={Object.keys(state.exercises)}
        onPick={(name) => { if (picking && picking.mode === "swap") swapSlot(picking.id, name); else addSlot(name); }} />
      <CloneSheet open={cloning} onClose={() => setCloning(false)} fromLabel={week ? week.label : "week"}
        onClone={(rule) => { cloneWeek(rule); setWi(weeks.length); }} />
    </div>
  );
}

/* =============================== TRAIN TAB =============================== */
function TrainTab({ state, setState, sel, setSel, models, addExercise, updateExercise, logSet, settings, setSetting, denoms, meetDays, meetName, plan, onEditPlan, setTab }) {
  const { unit, round, bar } = settings;
  // A programmed slot carries its own intensity language, so the tab's mode is an
  // override on top of the global setting rather than the setting itself: the top
  // single can be RPE while the leg extensions after it are reps in reserve.
  const [modeOverride, setModeOverride] = useState(null);
  const inputMode = modeOverride === "rir" ? "rir" : modeOverride === "rpe" ? "rpe" : settings.inputMode;
  const names = Object.keys(state.exercises);
  const mains = names.filter((n) => !state.exercises[n].parent);
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState("");
  const [linking, setLinking] = useState(false);

  // prescription
  const [tReps, setTReps] = useState(3);
  const [tInt, setTInt] = useState(inputMode === "rir" ? 1 : 8); // value in current mode
  const tRpe = inputMode === "rir" ? 10 - tInt : tInt;

  // log panel
  const [log, setLog] = useState({ weight: "", reps: 3, int: inputMode === "rir" ? 1 : 8 });
  const [fromRec, setFromRec] = useState(false);
  const [note, setNote] = useState("");
  const [showPlates, setShowPlates] = useState(false);
  const [showHow, setShowHow] = useState(false);
  const [justLogged, setJustLogged] = useState(false);
  const [logDate, setLogDate] = useState(todayStr());

  const model = (sel && models[sel]) ? models[sel] : { e1rm: null, points: [], count: 0 };
  const e1rm = model.e1rm;
  const selEx = sel ? state.exercises[sel] : null;
  const DAYK = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const todayPlan = (plan || {})[DAYK[(new Date(tsFromDateStr(logDate)).getDay() + 6) % 7]] || [];
  // Today's session, straight off the block. The program decides WHAT; every load
  // on this screen still comes from the estimator, so a programmed day and a
  // freestyle day are the same machinery with a different starting point.
  const sessionSlots = slotsFor(state.program, logDate);
  const progWeek = state.program && state.program.weeks
    ? (state.program.weeks[weekIndexFor(state.program, logDate)] || {}).label : null;
  const doneSlots = useMemo(() => {
    const dk = new Date(tsFromDateStr(logDate)).toDateString();
    const done = {};
    for (const sl of sessionSlots) {
      const ex = state.exercises[sl.ex];
      done[sl.id] = !!(ex && ex.sets.some((x) => !x.backoff && new Date(x.ts).toDateString() === dk));
    }
    return done;
  }, [sessionSlots, state.exercises, logDate]);
  const loadSlot = (sl) => {
    // A movement programmed but never trained yet gets created on first tap, wired
    // to its main lift so a paused squat still feeds the squat model.
    if (!state.exercises[sl.ex]) {
      const L = libFind(sl.ex);
      const parent = L && L.m && state.exercises[L.m] ? L.m : null;
      addExercise(sl.ex, parent, L ? L.r : undefined);
      if (sl.role === "accessory") updateExercise(sl.ex, { accessory: true });
    } else setSel(sl.ex);
    setModeOverride(sl.mode);
    setTReps(sl.reps);
    if (sl.mode === "pct") setTopPct(sl.val); else setTInt(sl.val);
    if (sl.bo && setSetting) {
      const b = sl.bo;
      setSetting("backoff", { ...(settings.backoff || {}), sets: b.sets, reps: b.reps,
        rpe: b.mode === "rir" ? Math.max(5, 10 - b.val) : b.mode === "rpe" ? b.val : 7,
        pct: b.mode === "pct" ? b.val : (settings.backoff || {}).pct, steps: [] });
    }
  };
  const loadPlanned = (it) => {
    if (state.exercises[it.name]) setSel(it.name);
    setTReps(it.reps);
    setTInt(inputMode === "rir" ? 10 - it.rpe : it.rpe);
    if (it.bo && setSetting) setSetting("backoff", { ...(settings.backoff || {}), sets: it.bo.sets, reps: it.bo.reps, rpe: it.bo.rpe, steps: [] });
  };
  const childNames = sel ? names.filter((n) => state.exercises[n].parent === sel) : [];
  const parentName = selEx && selEx.parent && state.exercises[selEx.parent] ? selEx.parent : null;
  const ratioPct = Math.round((model.ratio || 1) * 100);
  // training mode + reference max that percentages run off
  const percentMode = modeOverride ? modeOverride === "pct" : settings.trainingMode === "percent";
  const locked = percentMode && settings.maxMode === "locked";
  const tmax = selEx ? selEx.tmax : null;
  const setTmax = (val) => { if (sel) updateExercise(sel, { tmax: val }); };
  const [editTmax, setEditTmax] = useState(false);
  const [tmaxInput, setTmaxInput] = useState("");
  // Week-over-week carryover trims today's targets. Weights are movement-pattern
  // aware: this lift's own strain in full, its variation family at 60%, same-pattern
  // lifts (squat↔deadlift) at 35%, and unrelated patterns at a whisper (5%) — a
  // brutal deadlift day reaches your squat, but barely touches your bench.
  const recovery = useMemo(() => {
    if (!selEx || e1rm == null) return { drop: 0, days: 0, peak: 0, from: null };
    const refTs = tsFromDateStr(logDate) + 1;
    const scale = learnRecoveryScale(selEx.sets);
    const rootOf = (n) => { let r = n, hop = 0; while (state.exercises[r] && state.exercises[r].parent && hop++ < 4) r = state.exercises[r].parent; return r; };
    const groupOf = (n) => { const r = rootOf(n).toLowerCase(); if (/squat|dead|pull|hinge|rdl/.test(r)) return "lower"; if (/bench|press|dip/.test(r)) return "press"; return "other"; };
    const own = residualFatigue(selEx.sets, refTs);
    let total = own.raw, top = { c: own.raw, days: own.days, peak: own.peak, name: null };
    const gSel = groupOf(sel);
    for (const [name, other] of Object.entries(state.exercises)) {
      if (name === sel) continue;
      const fam = rootOf(name) === rootOf(sel);
      const gOther = groupOf(name);
      const w = fam ? 0.6 : (gSel !== "other" && gSel === gOther ? 0.35 : (gSel === "other" || gOther === "other" ? 0.15 : 0.05));
      const r = residualFatigue(other.sets, refTs);
      const c = w * r.raw;
      total += c;
      if (c > top.c) top = { c, days: r.days, peak: r.peak, name };
    }
    return { drop: trimFor(total, scale), days: top.days, peak: top.peak, from: top.name };
  }, [selEx, sel, state.exercises, e1rm, logDate]);
  // Declared conditions ride on top of predicted training debt: independent causes
  // of the same shortfall, so they multiply. Everything downstream — the top set,
  // every back-off, the strong/tough-day bracket, the plate maths — reads this one
  // number, so the whole session shifts together.
  const dayCheckin = checkinOn(state, logDate);
  const condFactor = conditionFactor(dayCheckin, liftClass(sel));
  const condWhy = conditionWhy(dayCheckin, liftClass(sel));
  const effE1rm = e1rm != null ? e1rm * (1 - recovery.drop) * condFactor : null;

  const ref = percentMode ? (locked ? (tmax != null ? tmax : (e1rm != null ? roundTo(e1rm, round) : null)) : (effE1rm != null ? roundTo(effE1rm, round) : null)) : effE1rm;
  const topPct = settings.topPct || 85;
  const setTopPct = (v) => setSetting && setSetting("topPct", Math.max(30, Math.min(105, v)));

  const rec = percentMode ? (ref != null ? ref * (topPct / 100) : null) : (effE1rm != null ? weightForTarget(effE1rm, tReps, tRpe) : null);
  const recR = rec != null ? roundTo(rec, round) : null;
  // predicted effort for a % prescription, measured against the app's true estimate
  const predRpe = (percentMode && effE1rm != null && recR != null) ? Math.max(1, Math.min(10, 10 - (repsAtPct((recR / effE1rm) * 100) - tReps))) : null;
  const strongDay = (!percentMode && effE1rm != null && tRpe < 10) ? roundTo(weightForTarget(effE1rm, tReps, Math.min(10, tRpe + 0.5)), round) : null;
  const toughDay = (!percentMode && effE1rm != null) ? roundTo(weightForTarget(effE1rm, tReps, tRpe - 0.5), round) : null;

  // back-off sets — fatigue-aware in RPE mode; a flat % in percentage mode
  const bo = settings.backoff || { sets: 1, reps: 5, rpe: 8, pct: 75 };
  const setBo = (patch) => setSetting && setSetting("backoff", { ...bo, ...patch });
  const boPct = bo.pct || 75;
  // Each back-off targets bo.reps @ bo.rpe; the load is what hits that target given how
  // much capacity the *actual* prior set spent. The first comes off your top set, each
  // next off the back-off before it, so a grindy set pulls the next one down harder.
  const [boDraft, setBoDraft] = useState(null);
  const scaleTop = useMemo(() => learnDropScale(selEx ? selEx.sets : [], DEFAULT_FATIGUE_K, true), [selEx]);
  const scaleChain = useMemo(() => learnDropScale(selEx ? selEx.sets : [], DEFAULT_FATIGUE_K, false), [selEx]);
  const boDayStr = new Date(tsFromDateStr(logDate)).toDateString();
  // A back-off can be run as a linked variation. Fatigue still chains off the main lift's
  // spent capacity; the load is then scaled by how that variation measures up to the main.
  const boFamily = sel ? [sel].concat(Object.keys(state.exercises).filter((n) => state.exercises[n].parent === sel)) : [];
  const ratioOf = (n) => (n === sel ? 1 : ((models[n] && models[n].ratio) || (state.exercises[n] && state.exercises[n].ratio) || 1));
  useEffect(() => { setBoDraft(null); }, [sel]);
  // Every back-off carries its OWN prescription — reps, intensity, and which lift in the
  // family it runs on — so a session can descend (5 @ 8, then 4 @ 6, then a single on a
  // paused variation) without rewriting one shared target between sets. A slot you have
  // never touched inherits the slot before it, and the first falls back to the card
  // defaults, which is also what the block planner writes.
  const boSteps = Array.isArray(bo.steps) ? bo.steps : [];
  const stepAt = (i) => {
    let s = { reps: bo.reps, rpe: bo.rpe, pct: boPct, lift: null };
    for (let k = 0; k <= i; k++) if (boSteps[k]) s = { ...s, ...boSteps[k] };
    return s;
  };
  const setStep = (i, patch) => {
    const next = boSteps.slice();
    while (next.length <= i) next.push(null);
    next[i] = { ...stepAt(i), ...patch };
    setBo({ steps: next });
  };
  const todayBos = boFamily
    .reduce((acc, n) => acc.concat((state.exercises[n] ? state.exercises[n].sets : [])
      .filter((x) => x.backoff && new Date(x.ts).toDateString() === boDayStr)
      .map((x) => ({ ...x, lift: n }))), [])
    .sort((a, b) => a.ts - b.ts);
  const doneCount = todayBos.length;
  const lastBo = doneCount ? todayBos[doneCount - 1] : null;
  const boStep = stepAt(doneCount);
  const boReps = boStep.reps, boRpe = boStep.rpe, boStepPct = boStep.pct || boPct;
  // a remembered variation only applies while it is still part of this lift's family
  const boTarget = (boStep.lift && state.exercises[boStep.lift] && boFamily.indexOf(boStep.lift) >= 0) ? boStep.lift : sel;
  // the driving set, always normalised into MAIN-lift terms so the chain stays comparable
  const prevForBo = (() => {
    if (lastBo) return { implied: e1rmFromSet(lastBo.weight, lastBo.reps, lastBo.rpe) / (ratioOf(lastBo.lift) || 1), reps: lastBo.reps, rpe: lastBo.rpe };
    const topToday = (selEx ? selEx.sets : []).filter((x) => !x.backoff && new Date(x.ts).toDateString() === boDayStr).pop();
    if (topToday) return { implied: e1rmFromSet(topToday.weight, topToday.reps, topToday.rpe), reps: topToday.reps, rpe: topToday.rpe };
    if (effE1rm != null) return { implied: effE1rm, reps: tReps, rpe: tRpe };
    return null;
  })();
  const boSug = (() => {
    const r = ratioOf(boTarget) || 1;
    if (percentMode) return ref != null ? roundTo(ref * (boStepPct / 100) * r, round) : null;
    if (!prevForBo) return null;
    const effCap = prevForBo.implied * (1 - fatigueDrop(prevForBo.reps, prevForBo.rpe, DEFAULT_FATIGUE_K) * (lastBo ? scaleChain : scaleTop));
    return roundTo(weightForTarget(effCap * r, boReps, boRpe), round);
  })();
  // What the prescription says this set should feel like: the target RPE directly, or in
  // percentage mode the effort that load works out to against the current estimate.
  const boBaseRpe = (() => {
    if (!percentMode) return boRpe;
    if (effE1rm != null && boSug != null) return Math.max(1, Math.min(10, 10 - (repsAtPct((boSug / effE1rm) * 100) - boReps)));
    return 9;
  })();
  // The weight is a free-text draft; `feel` is a signed RPE nudge for a set that landed
  // harder or easier than asked. Keeping them apart means correcting how a set actually
  // felt never quietly moves the load you just lifted.
  const boFeel = (boDraft && boDraft.feel) || 0;
  const boRpeActual = Math.max(5, Math.min(10, Math.round((boBaseRpe + boFeel) * 2) / 2));
  const curBo = { weight: (boDraft && boDraft.weight != null) ? boDraft.weight : (boSug != null ? String(boSug) : ""), rpe: boRpeActual };
  const boDirty = !!(boDraft && boDraft.weight != null);
  const setBoW = (v) => setBoDraft({ ...(boDraft || {}), weight: v });
  const nudgeBo = (d) => setBoDraft({ ...(boDraft || {}), feel: Math.max(-3, Math.min(3, boFeel + d)) });
  const logCurBackoff = () => {
    if (!boTarget) return;
    const w = parseFloat(curBo.weight);
    if (!isFinite(w) || w <= 0) return;
    logSet(boTarget, { weight: roundTo(w, round), reps: boReps, rpe: curBo.rpe, ts: tsFromDateStr(logDate),
      backoff: true, fromRec: false, tReps: boReps, tRpe: percentMode ? Math.round(boBaseRpe * 2) / 2 : boRpe,
      cond: conditionFactor(dayCheckin, liftClass(boTarget)) < 1 ? conditionFactor(dayCheckin, liftClass(boTarget)) : undefined,
      rec: boSug != null ? boSug : roundTo(w, round) });
    setBoDraft(null);
  };

  const useRec = () => {
    if (recR == null) return;
    let intVal;
    if (percentMode) {
      const pr = predRpe != null ? predRpe : 8;
      intVal = inputMode === "rir" ? Math.max(0, Math.round((10 - pr) * 2) / 2) : Math.round(pr * 2) / 2;
    } else {
      intVal = inputMode === "rir" ? 10 - tRpe : tRpe;
    }
    setLog({ weight: String(recR), reps: tReps, int: intVal });
    setFromRec(true);
  };
  const nudge = (d) => setLog((l) => ({ ...l, int: inputMode === "rir" ? Math.max(0, l.int - d) : Math.min(10, Math.max(5, l.int + d)) }));

  const doLog = () => {
    const w = parseFloat(log.weight);
    if (!sel || isNaN(w) || w <= 0) return;
    const actualRpe = inputMode === "rir" ? 10 - log.int : log.int;
    logSet(sel, {
      weight: w, reps: log.reps, rpe: actualRpe, ts: tsFromDateStr(logDate),
      fromRec, tReps, tRpe, rec: recR, note: note.trim() || undefined,
      cond: condFactor < 1 ? condFactor : undefined,
    });
    setNote(""); setFromRec(false); setJustLogged(true);
    setTimeout(() => setJustLogged(false), 1400);
  };

  if (names.length === 0)
    return (
      <Card style={{ textAlign: "center", padding: "26px 18px" }}>
        <div style={{ fontWeight: 900, fontSize: 18, marginBottom: 6 }}>Add your first lift</div>
        <div style={{ color: C.muted, fontSize: 13.5, marginBottom: 18, lineHeight: 1.5 }}>
          Pick one to start. Log any set — a known 1RM or a working set — and IRONSET calibrates your strength from it.
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, justifyContent: "center", marginBottom: 14 }}>
          {PRESETS.map((p) => <Chip key={p} onClick={() => addExercise(p)}>{p}</Chip>)}
        </div>
        <AddRow {...{ newName, setNewName, addExercise, mains }} />
      </Card>
    );

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      {/* exercise selector */}
      <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4 }}>
        {names.map((n) => <Chip key={n} active={n === sel} onClick={() => setSel(n)}>{n}</Chip>)}
        <Chip onClick={() => setAdding((v) => !v)}><Plus size={15} style={{ marginTop: -1 }} /></Chip>
      </div>
      {adding && <Card style={{ padding: 12 }}><AddRow {...{ newName, setNewName, mains, addExercise: (n, p) => { addExercise(n, p); setAdding(false); } }} /></Card>}
      {sel && (
        <button onClick={() => setLinking(true)} style={{ alignSelf: "flex-start", background: "none", border: "none",
          color: C.muted, fontSize: 12, fontWeight: 600, cursor: "pointer", padding: "0", display: "inline-flex", alignItems: "center", gap: 6, marginTop: -4 }}>
          <span style={{ color: C.red, fontSize: 14 }}>↔</span>
          {parentName ? `Feeds ${parentName} · ${ratioPct}%` : childNames.length ? `Includes ${childNames.join(", ")}` : "Link as a variation"}
        </button>
      )}

      {meetDays != null && meetDays >= 0 && (
        <div style={{ background: C.redSoft, border: `1px solid ${C.redLine}`, borderRadius: 12, padding: "9px 12px",
          fontSize: 12.5, color: C.text, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <b style={{ color: C.red }}>{meetName || "Meet"}</b>
          <span style={{ fontFamily: MONO, fontWeight: 700 }}>{meetDays === 0 ? "Meet day" : meetDays + " day" + (meetDays === 1 ? "" : "s") + " out"}</span>
        </div>
      )}

      {/* strength readout */}
      <Card accent={C.blue}>
        {locked ? (
          <div>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <div style={label}>Training max{sel ? ` · ${sel}` : ""}</div>
              {!editTmax && <button onClick={() => { setTmaxInput(ref != null ? String(ref) : ""); setEditTmax(true); }}
                style={{ background: "none", border: "none", color: C.red, fontWeight: 800, fontSize: 12.5, cursor: "pointer" }}>Edit</button>}
            </div>
            {editTmax ? (
              <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 8 }}>
                <div style={{ flex: 1 }}><NumField value={tmaxInput} onChange={setTmaxInput} suffix={unit} /></div>
                <Btn kind="primary" onClick={() => { const v = parseFloat(tmaxInput); if (isFinite(v) && v > 0) setTmax(roundTo(v, round)); setEditTmax(false); }}>Save</Btn>
              </div>
            ) : (
              <>
                <div style={{ fontFamily: SKETCH, fontSize: 30, fontWeight: 700, color: C.chalk, lineHeight: 1.1, fontVariantNumeric: "tabular-nums", marginTop: 2 }}>
                  {ref != null ? fmt(ref) : "—"}<span style={{ fontSize: 14, color: C.muted, marginLeft: 4 }}>{unit}</span>
                </div>
                <div style={{ fontSize: 11.5, color: C.faint, marginTop: 2 }}>
                  {e1rm != null ? `app estimate ${fmt(roundTo(e1rm, round))} ${unit}` : "log a set to see your estimate"}{tmax == null ? " · using estimate — set yours" : ""}
                </div>
              </>
            )}
          </div>
        ) : (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div>
              <div style={{ ...label, fontSize: 9.5 }}>Estimated 1RM</div>
              <div style={{ fontFamily: MONO, fontSize: 34, fontWeight: 700, color: C.text, lineHeight: 1.05,
                marginTop: 5, letterSpacing: "-0.035em", fontVariantNumeric: "tabular-nums",
                textShadow: `0 0 34px ${C.blue}55` }}>
                {e1rm != null ? fmt(roundTo(e1rm, round)) : "—"}<span style={{ fontFamily: SANS, fontSize: 13, color: C.faint, marginLeft: 5, fontWeight: 600 }}>{unit}</span>
              </div>
            </div>
            <div style={{ textAlign: "right", fontSize: 11.5, color: C.muted, lineHeight: 1.5 }}>
              {model.count > 0
                ? <>from {model.count} set{model.count > 1 ? "s" : ""}<br />updated {dshort(model.points[model.points.length - 1].ts)}</>
                : "not calibrated"}
            </div>
          </div>
        )}
      </Card>

      <CheckinCard state={state} setState={setState} sel={sel} dateStr={logDate} />

      {/* TOP SET widget — prescribe, see the load, log it, all in one */}
      {sessionSlots.length > 0 ? (
      <Card accent={C.amber} style={{ padding: "14px 15px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 9 }}>
            <span style={{ width: 3, height: 14, borderRadius: 2, background: C.amber, boxShadow: `0 0 10px ${C.amber}88` }} />
            <span style={{ ...label, fontSize: 9.5 }}>{progWeek ? progWeek + " · " + dayKeyFor(logDate) : "Today's session"}</span>
          </span>
          <button onClick={() => setTab && setTab("plan")} style={{ background: "none", border: "none", color: C.red,
            fontWeight: 800, fontSize: 11.5, cursor: "pointer", padding: 0 }}>Edit block</button>
        </div>
        <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 7 }}>
          {sessionSlots.map((sl) => {
            const on = sl.ex === sel;
            const done = doneSlots[sl.id];
            return (
              <button key={sl.id} onClick={() => loadSlot(sl)} style={{ display: "flex", alignItems: "center", gap: 10,
                background: on ? "rgba(255,255,255,0.06)" : "rgba(255,255,255,0.02)",
                border: `1px solid ${on ? C.line2 : C.line}`, borderRadius: 12, padding: "10px 12px",
                cursor: "pointer", textAlign: "left", color: C.text, WebkitTapHighlightColor: "transparent" }}>
                <span style={{ width: 18, height: 18, borderRadius: 99, flexShrink: 0, display: "grid", placeItems: "center",
                  background: done ? C.good : "transparent", border: done ? "none" : `1px solid ${C.line2}` }}>
                  {done ? <Check size={11} style={{ color: "#07100B" }} /> : null}
                </span>
                <span style={{ minWidth: 0, flex: 1 }}>
                  <span style={{ display: "block", fontWeight: 800, fontSize: 13, whiteSpace: "nowrap",
                    overflow: "hidden", textOverflow: "ellipsis", opacity: done ? 0.55 : 1 }}>{sl.ex}</span>
                  <span style={{ display: "block", fontFamily: MONO, fontSize: 11, color: C.muted, marginTop: 2 }}>
                    {slotSummary(sl)}{sl.bo ? ` + ${sl.bo.sets}×${sl.bo.reps}` : ""}
                  </span>
                </span>
                {sl.role === "accessory" && <span style={{ fontSize: 9.5, color: C.faint, fontFamily: MONO, letterSpacing: "0.08em" }}>ACC</span>}
              </button>
            );
          })}
        </div>
      </Card>
      ) : (
      <Card accent={C.amber} style={{ padding: "14px 15px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 9 }}>
            <span style={{ width: 3, height: 14, borderRadius: 2, background: C.amber, boxShadow: `0 0 10px ${C.amber}88` }} />
            <span style={{ ...label, fontSize: 9.5 }}>Today's plan</span>
          </span>
          <button onClick={() => (state.program ? (setTab && setTab("plan")) : onEditPlan())} style={{ background: "none", border: "none", color: C.red,
            fontWeight: 800, fontSize: 11.5, cursor: "pointer", padding: 0 }}>{state.program ? "Open block" : (todayPlan.length ? "Edit" : "Set up")}</button>
        </div>
        {todayPlan.length ? (
          <div style={{ display: "flex", gap: 7, flexWrap: "wrap", marginTop: 9 }}>
            {todayPlan.map((it, i) => {
              const on = it.name === sel && it.reps === tReps && (inputMode === "rir" ? 10 - it.rpe : it.rpe) === tInt;
              return (
                <Chip key={i} active={on} onClick={() => loadPlanned(it)}>
                  {it.name} · {it.reps}@{inputMode === "rir" ? `${fmt(10 - it.rpe)}R` : fmt(it.rpe)}{it.bo ? ` +${it.bo.sets}×${it.bo.reps}` : ""}
                </Chip>
              );
            })}
          </div>
        ) : (
          <div style={{ fontSize: 11.5, color: C.faint, marginTop: 6, lineHeight: 1.5 }}>
            {state.program ? "Nothing programmed for today — a rest day, or train whatever you like below." : "No lifts planned for today. Build a block in Plan and Train opens ready to go."}
          </div>
        )}
      </Card>
      )}

      <Card accent={C.red} glow="none">
        <SectionHead accent={C.red} sub="Set your target, see the load, then log what you actually hit.">Top set</SectionHead>
        <div style={{ display: "flex", gap: 14, marginTop: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div>
            <div style={{ fontSize: 11, color: C.muted, marginBottom: 6, fontWeight: 700 }}>Reps</div>
            <Stepper value={tReps} onChange={setTReps} min={1} max={20} />
          </div>
          <div>
            <div style={{ fontSize: 11, color: C.muted, marginBottom: 6, fontWeight: 700 }}>{percentMode ? "% of max" : (inputMode === "rir" ? "RIR" : "RPE")}</div>
            {percentMode
              ? <Stepper value={topPct} onChange={setTopPct} step={2.5} min={30} max={105} suffix="%" />
              : <Stepper value={tInt} onChange={setTInt} step={0.5} min={inputMode === "rir" ? 0 : 5} max={inputMode === "rir" ? 5 : 10} />}
          </div>
        </div>
        <div style={{ display: "flex", gap: 6, marginTop: 12, flexWrap: "wrap" }}>
          {percentMode
            ? [70, 75, 80, 85, 90].map((v) => <Chip key={v} active={topPct === v} onClick={() => setTopPct(v)}>{v}%</Chip>)
            : (inputMode === "rir" ? [3, 2, 1, 0] : [7, 8, 9, 10]).map((v) => <Chip key={v} active={tInt === v} onClick={() => setTInt(v)}>{inputMode === "rir" ? `${v} RIR` : `RPE ${v}`}</Chip>)}
        </div>
      <div style={{ height: 1, background: C.line, boxShadow: "0 1px 0 rgba(255,255,255,0.03)", margin: "16px -16px" }} />

      {/* recommendation */}
      <div style={{ textAlign: "center", margin: "0 -17px", padding: "20px 17px 6px",
        background: "linear-gradient(180deg, rgba(255,74,61,0.09), rgba(255,74,61,0.02) 55%, transparent)" }}>
        <div style={{ ...label, fontSize: 9.5 }}>Recommended load</div>
        {recR != null ? (
          <>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "center", gap: 8, marginTop: 10,
              whiteSpace: "nowrap" }}>
              <span style={{ fontFamily: MONO, fontSize: 62, fontWeight: 700, lineHeight: 0.96, color: C.text,
                letterSpacing: "-0.045em", fontVariantNumeric: "tabular-nums",
                textShadow: `0 0 46px ${C.red}55`, transition: "color .2s" }}>{fmt(recR)}</span>
              <span style={{ fontFamily: SANS, fontSize: 17, color: C.muted, fontWeight: 600 }}>{unit}</span>
            </div>
            <div style={{ height: 2, borderRadius: 2, margin: "15px auto 12px", width: 96,
              background: `linear-gradient(90deg, transparent, ${C.red}, transparent)`, opacity: 0.75 }} />
            <div style={{ fontSize: 13, color: C.muted, fontWeight: 600 }}>
              {percentMode
                ? `${tReps} rep${tReps > 1 ? "s" : ""} @ ${fmt(topPct)}%`
                : `${tReps} rep${tReps > 1 ? "s" : ""} @ ${inputMode === "rir" ? `${10 - tRpe} RIR` : `RPE ${fmt(tRpe)}`}`}
            </div>
            {percentMode
              ? (predRpe != null && <div style={{ fontSize: 11.5, color: C.faint, marginTop: 8, fontFamily: MONO }}>≈ RPE {fmt(Math.round(predRpe * 2) / 2)} · {fmt(Math.max(0, Math.round((10 - predRpe) * 2) / 2))} RIR</div>)
              : ((strongDay || toughDay) && (
                <div style={{ fontSize: 11.5, color: C.faint, marginTop: 8, fontFamily: MONO }}>
                  {strongDay ? `strong day ${fmt(strongDay)}` : ""}{strongDay && toughDay ? "  ·  " : ""}{toughDay ? `tough day ${fmt(toughDay)}` : ""}
                </div>
              ))}
            {recovery.drop >= 0.01 && (
              <div style={{ fontSize: 11, color: C.gold, marginTop: 7, fontWeight: 700 }}>
                Trimmed {fmt(Math.round(recovery.drop * 1000) / 10)}% — RPE {fmt(recovery.peak)} {(recovery.from || sel) + " "}session {recovery.days}d ago
              </div>
            )}
            {condFactor < 0.999 && (
              <div style={{ fontSize: 11, color: C.gold, marginTop: 7, fontWeight: 700 }}>
                Trimmed {fmt(Math.round((1 - condFactor) * 1000) / 10)}% — {condWhy}
              </div>
            )}
            {/* plates */}
            <button onClick={() => setShowPlates((v) => !v)} style={{ marginTop: 12, background: "none", border: "none",

      <div style={{ height: 1, background: C.line, boxShadow: "0 1px 0 rgba(255,255,255,0.03)", margin: "16px -16px" }} />

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>

          </span>
          {recR != null && <button onClick={useRec} style={{ background: "rgba(255,255,255,0.04)", border: `1px solid ${C.line2}`,

          <div style={{ fontSize: 11, color: C.muted, marginBottom: 6, fontWeight: 700 }}>

              <Chip onClick={() => nudge(-0.5)}>Easier</Chip>

              <Chip onClick={() => nudge(0.5)}>Harder</Chip>
            </div>
          </div>

        <div style={{ display: "flex", gap: 10, marginTop: 14, alignItems: "flex-end", flexWrap: "wrap" }}>

            <div style={{ fontSize: 11, color: C.muted, marginBottom: 6, fontWeight: 700 }}>Weight</div>
            <NumField value={log.weight} onChange={(v) => setLog((l) => ({ ...l, weight: v }))} suffix={unit} />
          </div>
          <div>
            <div style={{ fontSize: 11, color: C.muted, marginBottom: 6, fontWeight: 700 }}>Reps</div>
            <Stepper value={log.reps} onChange={(v) => setLog((l) => ({ ...l, reps: v }))} min={1} max={30} />
          </div>
          <div>
            <div style={{ fontSize: 11, color: C.muted, marginBottom: 6, fontWeight: 700 }}>{inputMode === "rir" ? "RIR" : "RPE"}</div>
            <Stepper value={log.int} onChange={(v) => setLog((l) => ({ ...l, int: v }))} step={0.5}
              min={inputMode === "rir" ? 0 : 5} max={inputMode === "rir" ? 6 : 10} />
          </div>
        </div>
        <input value={note} onChange={(e) => setNote(e.target.value)} placeholder="Note (optional)"
          style={{ width: "100%", marginTop: 12, background: C.bg2, border: `1px solid ${C.line}`, borderRadius: 12,
            padding: "11px 12px", color: C.text, fontFamily: SANS, fontSize: 14, outline: "none" }} />
        <Btn kind="primary" onClick={doLog} style={{ width: "100%", marginTop: 12 }} disabled={!parseFloat(log.weight)}>
          {justLogged ? <><Check size={17} /> Logged</> : "Log set"}
        </Btn>
        <div style={{ fontSize: 11, color: C.faint, marginTop: 8, textAlign: "center" }}>
          Every set you log retunes your 1RM — heavier feedback than expected lowers it, easier raises it.
        </div>
      </Card>

      {/* back-off sets */}
      {recR != null && (
        <Card accent={C.good}>
          <SectionHead accent={C.good} right={
            <span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 11, color: C.muted, fontWeight: 700 }}>Sets</span>
              <Stepper compact value={bo.sets} onChange={(v) => setBo({ sets: Math.max(1, Math.min(6, v)) })} min={1} max={6} />
            </span>
          }>Back-off sets</SectionHead>
          <div style={{ fontSize: 11, color: C.faint, marginTop: 4 }}>{percentMode ? "Set each back-off's own reps and % — the next one follows the set before it." : "Set each back-off's own reps and RPE; the load reads the fatigue from the set before it, so a grind drops the next one more."}</div>

          <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 10 }}>
            {todayBos.map((s, i) => (
              <div key={s.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between",
                background: C.bg2, border: `1px solid ${C.line}`, borderRadius: 12, padding: "9px 13px" }}>
                <div style={{ fontSize: 12, color: C.muted, fontWeight: 700 }}>
                  Back-off {i + 1}{s.lift !== sel ? <span style={{ color: C.blue }}> · {s.lift}</span> : null} · <span style={{ fontFamily: MONO, color: C.text }}>{fmt(s.weight)}{unit}</span> × {s.reps} <span style={{ color: C.faint }}>@ {inputMode === "rir" ? `${fmt(10 - s.rpe)} RIR` : `RPE ${fmt(s.rpe)}`}</span>
                </div>
                <Check size={15} style={{ color: C.good }} />
              </div>
            ))}

            {doneCount < bo.sets && (
              <div style={{ background: C.bg2, border: `1px solid ${C.redLine}`, borderRadius: 12, padding: "12px 14px" }}>
                <div style={{ fontSize: 11, color: C.muted, fontWeight: 700, marginBottom: 10 }}>
                  Back-off {doneCount + 1} of {bo.sets}{!percentMode && prevForBo ? ` · off your ${inputMode === "rir" ? `${fmt(10 - prevForBo.rpe)} RIR` : `RPE ${fmt(prevForBo.rpe)}`} set` : ""}
                </div>
                {boFamily.length > 1 && (
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
                    {boFamily.map((n) => (
                      <Chip key={n} active={n === boTarget} onClick={() => setStep(doneCount, { lift: n === sel ? null : n })}>
                        {n === sel ? n : `${n} · ${Math.round(ratioOf(n) * 100)}%`}
                      </Chip>
                    ))}
                  </div>
                )}
                {boTarget !== sel && (
                  <div style={{ fontSize: 11, color: C.blue, fontWeight: 700, marginBottom: 10 }}>
                    Scaled to {Math.round(ratioOf(boTarget) * 100)}% of {sel} · fatigue still chains off your last set
                  </div>
                )}
                {/* this back-off's own target — drives the suggested weight below */}
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
                  <div>
                    <div style={{ fontSize: 11, color: C.muted, marginBottom: 6, fontWeight: 700 }}>Reps</div>
                    <Stepper value={boReps} onChange={(v) => setStep(doneCount, { reps: Math.max(1, Math.min(20, v)) })} min={1} max={20} />
                  </div>
                  <div>
                    <div style={{ fontSize: 11, color: C.muted, marginBottom: 6, fontWeight: 700 }}>{percentMode ? "% of max" : (inputMode === "rir" ? "RIR" : "RPE")}</div>
                    {percentMode
                      ? <Stepper value={boStepPct} onChange={(v) => setStep(doneCount, { pct: Math.max(30, Math.min(100, v)) })} step={2.5} min={30} max={100} suffix="%" />
                      : <Stepper value={inputMode === "rir" ? 10 - boRpe : boRpe} step={0.5} min={inputMode === "rir" ? 0 : 5} max={inputMode === "rir" ? 5 : 10}
                          onChange={(v) => setStep(doneCount, { rpe: inputMode === "rir" ? 10 - v : v })} />}
                  </div>
                  <div style={{ flex: "1 1 110px" }}>
                    <div style={{ fontSize: 11, color: C.muted, marginBottom: 6, fontWeight: 700 }}>Weight{boDirty ? "" : <span style={{ color: C.faint, fontWeight: 600 }}> · suggested</span>}</div>
                    <NumField value={curBo.weight} onChange={setBoW} suffix={unit} />
                  </div>
                </div>
                {boDirty && boSug != null && (
                  <button onClick={() => setBoDraft({ ...(boDraft || {}), weight: null })} style={{ background: "none", border: "none", color: C.faint,
                    fontSize: 11.5, fontWeight: 700, cursor: "pointer", marginTop: 8, padding: 0 }}>
                    ↺ suggested {fmt(boSug)}{unit} × {boReps}
                  </button>
                )}
                {/* how it actually landed — nudges only the logged RPE, never the load */}
                <div style={{ display: "flex", alignItems: "center", gap: 5, marginTop: 10, flexWrap: "wrap" }}>
                  <span style={{ fontSize: 11, color: C.faint, fontWeight: 700 }}>Felt</span>
                  <Chip sm active={boFeel < 0} onClick={() => nudgeBo(-0.5)}>Easier</Chip>
                  <Chip sm active={boFeel === 0} onClick={() => setBoDraft({ ...(boDraft || {}), feel: 0 })}>As asked</Chip>
                  <Chip sm active={boFeel > 0} onClick={() => nudgeBo(0.5)}>Harder</Chip>
                  {boFeel !== 0 && (
                    <span style={{ fontFamily: MONO, fontSize: 11, color: C.gold, fontWeight: 700 }}>
                      logging {inputMode === "rir" ? `${fmt(10 - curBo.rpe)} RIR` : `RPE ${fmt(curBo.rpe)}`}
                    </span>
                  )}
                </div>
                {(parseFloat(curBo.weight) || boSug) ? <PlateView total={parseFloat(curBo.weight) || boSug} bar={bar} denoms={denoms} unit={unit} /> : null}
                <Btn kind="primary" onClick={logCurBackoff} style={{ width: "100%", marginTop: 10 }}>Log {boTarget !== sel ? boTarget : `back-off ${doneCount + 1}`}</Btn>
              </div>
            )}

            {doneCount >= bo.sets && (
              <div style={{ fontSize: 12, color: C.muted, textAlign: "center", padding: "8px 0 2px" }}>
                All {bo.sets} back-off{bo.sets > 1 ? "s" : ""} logged.{" "}
                <button onClick={() => setBo({ sets: bo.sets + 1 })} style={{ background: "none", border: "none", color: C.red, fontWeight: 800, fontSize: 12, cursor: "pointer", padding: 0 }}>add another</button>
              </div>
            )}
          </div>
        </Card>
      )}

      <button onClick={() => setShowHow((v) => !v)} style={{ background: "none", border: "none", color: C.faint,
        fontSize: 12, fontWeight: 700, cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 5, alignSelf: "center" }}>
        <Info size={14} /> How the numbers work
      </button>
      {showHow && (
        <Card style={{ fontSize: 12.5, color: C.muted, lineHeight: 1.6 }}>
          Your RPE tells the calculator how close to failure a set was — RPE 8 means 2 reps left (2 RIR). That maps every set to a percent of your
          one-rep max using the standard RPE chart, so a triple at RPE 9 and a heavy single both inform the same estimate. New sets are blended in
          with recent ones weighted more, and low-rep top sets count more than long high-rep sets. Recommendations just run that estimate backward
          for the reps and RPE you prescribe. Back-offs read the fatigue from your last set's actual reps and how close to failure it was — a grindy RPE 9
          set drops the next one further than an easy one — and each set, top or back-off, feeds the one after it. The app also learns how fast you personally
          fade from past sessions. Back-offs stay out of your 1RM estimate so a tired one never drags your numbers down. Your daily check-in works the same way
          from the other end: it trims what you're asked to lift by a few percent, records that handicap against every set you log under it, and divides it back
          out before your max is updated — so a rough week changes today's loads without ever being recorded as lost strength.
        </Card>
      )}

      {linking && sel && (
        <LinkSheet
          name={sel} exercise={state.exercises[sel]} mains={mains} childNames={childNames}
          effectiveRatio={model.ratio || 1}
          onClose={() => setLinking(false)}
          onSave={(patch) => { updateExercise(sel, patch); setLinking(false); }}
        />
      )}
    </div>
  );
}

  return (
    <div>
      <div style={{ display: "flex", gap: 8 }}>
        <input value={newName} onChange={(e) => setNewName(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") submit(); }}
          placeholder="e.g. Pause Squat"
          style={{ flex: 1, background: C.bg2, border: `1px solid ${C.line2}`, borderRadius: 12, padding: "11px 12px",
            color: C.text, fontFamily: SANS, fontSize: 14, outline: "none" }} />
        <Btn kind="primary" onClick={submit}>Add lift</Btn>
      </div>
      {mains && mains.length > 0 && (
        <div style={{ marginTop: 12 }}>
          <div style={{ fontSize: 11, color: C.muted, marginBottom: 6, fontWeight: 700 }}>Variation of (optional)</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            <Chip active={parent === ""} onClick={() => setParent("")}>None</Chip>
            {mains.map((m) => <Chip key={m} active={parent === m} onClick={() => setParent(m)}>{m}</Chip>)}
          </div>
          {parent && <div style={{ fontSize: 11, color: C.faint, marginTop: 7 }}>
            Feeds your {parent} estimate (≈{Math.round(defaultRatio(newName || "") * 100)}% to start, then auto-tunes from your numbers).
          </div>}
        </div>
      )}
    </div>
  );
}

function PlateView({ total, bar, denoms, unit }) {
  const r = platesPerSide(total, bar, denoms);
  if (r.below)
    return <div style={{ fontSize: 12, color: C.faint, marginTop: 10 }}>Below bar weight ({fmt(bar)} {unit}).</div>;
  if (r.items.length === 0)
    return <div style={{ fontSize: 12, color: C.faint, marginTop: 10 }}>Empty bar — {fmt(bar)} {unit}.</div>;
  const sizeFor = (p) => 30 + Math.min(26, (p / denoms[0]) * 26);
  return (
    <div style={{ marginTop: 12 }}>
      <div style={{ display: "flex", gap: 6, justifyContent: "center", alignItems: "center", flexWrap: "wrap" }}>
        {r.items.flatMap(({ p, c }) =>
          Array.from({ length: c }).map((_, i) => (
            <div key={p + "-" + i} style={{ width: 26, height: sizeFor(p), borderRadius: 12, background: C.surface2,
              border: `1px solid ${C.line2}`, display: "grid", placeItems: "center", fontFamily: MONO, fontSize: 10.5,
              fontWeight: 700, color: C.text }}>{fmt(p)}</div>
          ))
        )}
      </div>
      <div style={{ fontSize: 11, color: C.faint, marginTop: 8, textAlign: "center", fontFamily: MONO }}>
        {r.items.map((x) => `${fmt(x.p)}×${x.c}`).join("  ")} per side{r.leftover > 0 ? `  ·  +${fmt(r.leftover)} ${unit} off` : ""}
      </div>
    </div>
  );
}

/* ============================== HISTORY TAB ============================== */
function HistoryTab({ state, sel, setSel, models, deleteSet, updateSet, deleteExercise, unit, inputMode }) {
  const names = Object.keys(state.exercises);
  if (names.length === 0)
    return <Card style={{ textAlign: "center", color: C.muted, fontSize: 14, padding: "28px 16px" }}>
      No lifts yet. Add one in the Train tab to start tracking strength over time.
    </Card>;
  const cur = sel && state.exercises[sel] ? sel : names[0];
  const [armName, setArmName] = useState(null);
  const [confirmText, setConfirmText] = useState("");
  const [editing, setEditing] = useState(null);
  const iconBtn = { background: "none", border: "none", color: C.faint, cursor: "pointer", padding: 4 };
  const ex = state.exercises[cur];
  const model = models[cur];
  const sets = [...ex.sets].sort((a, b) => b.ts - a.ts);

  const best = model.points.length ? Math.max(...model.points.map((p) => p.value)) : null;
  const cutoff = Date.now() - 30 * 864e5;
  const before = model.points.filter((p) => p.ts <= cutoff).slice(-1)[0]?.value;
  const delta = before != null && model.e1rm != null ? model.e1rm - before : null;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4 }}>
        {names.map((n) => <Chip key={n} active={n === cur} onClick={() => setSel(n)}>{n}</Chip>)}
      </div>

      <Card glow={`radial-gradient(120% 90% at 50% -10%, ${C.blue}1F, transparent 70%)`}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 16 }}>
          {[["Current 1RM", model.e1rm, C.text], ["Best", best, C.text],
            ["30-day", delta, delta > 0 ? C.good : delta < 0 ? C.red : C.text]].map(([l, v, col]) => (
            <div key={l} style={{ background: "rgba(255,255,255,0.03)", border: `1px solid ${C.line}`,
              borderRadius: 14, padding: "11px 12px" }}>
              <div style={{ ...label, fontSize: 8.5 }}>{l}</div>
              <div style={{ fontFamily: MONO, fontSize: 20, fontWeight: 700, marginTop: 4, color: col,
                letterSpacing: "-0.035em", fontVariantNumeric: "tabular-nums" }}>
                {l === "30-day" && v != null && v > 0 ? "+" : ""}{v != null ? fmt(v) : "—"}
              </div>
            </div>
          ))}
        </div>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 9, marginBottom: 6 }}>
          <span style={{ width: 3, height: 13, borderRadius: 2, background: C.blue, boxShadow: `0 0 10px ${C.blue}88` }} />
          <span style={{ ...label, fontSize: 9.5 }}>Strength trend ({unit})</span>
        </span>
        <LineChart data={model.points} height={176} unit={unit} />
      </Card>

      <Card style={{ padding: 0, overflow: "hidden" }}>
        <div style={{ padding: "14px 16px 6px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 9 }}>
            <span style={{ width: 3, height: 13, borderRadius: 2, background: C.amber, boxShadow: `0 0 10px ${C.amber}88` }} />
            <span style={label}>Set log</span>
          </span>
          <span style={{ fontSize: 11.5, color: C.faint }}>{sets.length} total</span>
        </div>
        {sets.length === 0 && <div style={{ padding: "8px 16px 18px", color: C.faint, fontSize: 13 }}>No sets logged.</div>}
        {sets.map((s) => (
          <div key={s.id} style={{ padding: "11px 16px", borderTop: `1px solid ${C.line}`, display: "flex",
            alignItems: "center", justifyContent: "space-between", gap: 10 }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontFamily: MONO, fontSize: 15, fontWeight: 600 }}>
                {fmt(s.weight)}{unit} × {s.reps} <span style={{ color: C.muted }}>@ {inputMode === "rir" ? `${fmt(10 - s.rpe)} RIR` : `RPE ${fmt(s.rpe)}`}</span>
                {s.backoff && <span style={{ fontFamily: SANS, fontSize: 10, fontWeight: 800, color: C.muted,
                  border: `1px solid ${C.line2}`, borderRadius: 6, padding: "1px 6px", marginLeft: 8, letterSpacing: "0.04em", textTransform: "uppercase" }}>Back-off</span>}
              </div>
              <div style={{ fontSize: 11, color: C.faint, marginTop: 2 }}>
                {dshort(s.ts)}{s.backoff ? "" : ` · e1RM ${fmt(e1rmFromSet(s.weight, s.reps, s.rpe))}${unit}`}
                {s.cond != null && s.cond < 1
                  ? <span style={{ color: C.gold }}> · −{fmt(Math.round((1 - s.cond) * 1000) / 10)}% conditions</span>
                  : null}
                {s.fromRec && s.tRpe != null && (
                  <span style={{ color: Math.abs(s.rpe - s.tRpe) < 0.25 ? C.good : C.red }}>
                    {"  ·  target " + (inputMode === "rir" ? `${fmt(10 - s.tRpe)} RIR` : `RPE ${fmt(s.tRpe)}`) + (Math.abs(s.rpe - s.tRpe) < 0.25 ? " ✓" : ` → felt ${inputMode === "rir" ? `${fmt(10 - s.rpe)} RIR` : `RPE ${fmt(s.rpe)}`}`)}
                  </span>
                )}
                {s.note ? `  ·  ${s.note}` : ""}
              </div>
            </div>
            <div style={{ display: "flex", gap: 2, flexShrink: 0 }}>
              <button onClick={() => setEditing(s)} style={iconBtn}><Pencil size={15} /></button>
              <button onClick={() => deleteSet(cur, s.id)} style={iconBtn}><Trash2 size={16} /></button>
            </div>
          </div>
        ))}
      </Card>

      {armName === cur ? (
        <Card accent={C.red}>
          <div style={{ fontWeight: 800, fontSize: 14.5, marginBottom: 6 }}>Delete {cur}?</div>
          <div style={{ fontSize: 12.5, color: C.muted, lineHeight: 1.55, marginBottom: 12 }}>
            This removes {cur} and all {(state.exercises[cur] ? state.exercises[cur].sets.length : 0)} of its logged
            sets from your training. It moves to Recently deleted in Settings, where you can restore it.
            Type <b style={{ color: C.text }}>{cur}</b> below to confirm.
          </div>
          <input value={confirmText} onChange={(e) => setConfirmText(e.target.value)} placeholder={cur}
            style={{ width: "100%", background: "rgba(0,0,0,0.35)", border: `1px solid ${C.line2}`, borderRadius: R.input,
              padding: "0 13px", height: 46, color: C.text, fontFamily: SANS, fontSize: 15, fontWeight: 600,
              outline: "none", boxSizing: "border-box" }} />
          <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
            <Btn kind="danger" disabled={confirmText.trim() !== cur}
              onClick={() => { deleteExercise(cur); setArmName(null); setConfirmText(""); }}
              style={{ flex: 1 }}><Trash2 size={15} /> Delete</Btn>
            <Btn kind="ghost" onClick={() => { setArmName(null); setConfirmText(""); }} style={{ flex: 1 }}>Cancel</Btn>
          </div>
        </Card>
      ) : (
        <Btn kind="ghost" onClick={() => { setArmName(cur); setConfirmText(""); }} style={{ alignSelf: "flex-start", color: C.muted }}>
          <Trash2 size={15} /> Delete this lift
        </Btn>
      )}

      {editing && (
        <EditSetSheet
          set={editing} unit={unit} inputMode={inputMode}
          onClose={() => setEditing(null)}
          onSave={(patch) => { updateSet(cur, editing.id, patch); setEditing(null); }}
          onDelete={() => { deleteSet(cur, editing.id); setEditing(null); }}
        />
      )}
    </div>
  );
}

/* ===================== STRENGTH SCORE + MEET PREP ====================== */
function ScoreCard({ analysis, unit, state, setState }) {
  const sex = (state.settings && state.settings.sex) || "male";
  const bwArr = state.bodyweight || [];
  const bwKg = bwArr.length ? bwArr[bwArr.length - 1].kg : null;
  const [share, setShare] = useState(null);
  const [editing, setEditing] = useState(bwKg == null);
  const [inp, setInp] = useState(bwKg != null ? fmt(fromKg(bwKg, unit)) : "");
  const totalUnit = analysis.total;
  const totalKg = totalUnit != null ? toKg(totalUnit, unit) : null;
  const dots = bwKg != null && totalKg != null ? dotsCoeff(bwKg, sex) * totalKg : null;
  const wilks = bwKg != null && totalKg != null ? wilksCoeff(bwKg, sex) * totalKg : null;
  const tier = dotsTier(dots);
  const setSex = (v) => setState((s) => ({ ...s, settings: { ...s.settings, sex: v } }));
  const saveBw = () => {
    const v = parseFloat(inp);
    if (!isFinite(v) || v <= 0) return;
    const kg = toKg(v, unit);
    setState((s) => {
      const arr = [...(s.bodyweight || [])];
      const today = dateStrFromTs(Date.now());
      const i = arr.findIndex((e) => dateStrFromTs(e.ts) === today);
      if (i >= 0) arr[i] = { ...arr[i], kg }; else arr.push({ id: Date.now() + Math.random(), ts: Date.now(), kg });
      return { ...s, bodyweight: arr };
    });
    setEditing(false);
  };
  const doShareScore = () => doShare(setShare, { type: "stat", label: "DOTS score", value: fmt(Math.round(dots)), unit: "",
    sub: "Total " + fmt(Math.round(totalKg)) + " kg  @  " + fmt(Math.round(fromKg(bwKg, unit))) + " " + unit,
    date: new Date().toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) });

  if (totalKg == null) return (
    <Card accent={C.amber}>
      <div style={label}>Strength score</div>
      <div style={{ fontSize: 12.5, color: C.muted, marginTop: 8, lineHeight: 1.5 }}>
        Log squat, bench, and deadlift to see your DOTS and Wilks score.
      </div>
    </Card>
  );

  return (
    <Card style={{ position: "relative" }}>
      {dots != null && <button onClick={doShareScore} aria-label="Share" style={{ background: "none", border: "none", color: C.faint, cursor: "pointer", padding: 4, position: "absolute", top: 10, right: 10 }}><Share size={16} /></button>}
      <div style={label}>Strength score</div>
      {bwKg != null && !editing ? (
        <div>
          <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginTop: 8, flexWrap: "wrap" }}>
            <span style={{ fontFamily: SKETCH, fontSize: 40, fontWeight: 700, color: C.chalk, lineHeight: 1 }}>{fmt(Math.round(dots))}</span>
            <span style={{ ...label, fontSize: 10 }}>DOTS</span>
            {tier && <span style={{ fontSize: 11, color: C.muted, fontWeight: 700 }}>≈ {tier}</span>}
          </div>
          <div style={{ display: "flex", gap: 16, marginTop: 8, fontSize: 12.5, color: C.muted }}>
            <span>Wilks <b style={{ color: C.text, fontFamily: MONO }}>{fmt(Math.round(wilks))}</b></span>
            <span>Total <b style={{ color: C.text, fontFamily: MONO }}>{fmt(Math.round(totalKg))}</b> kg</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 12, gap: 10 }}>
            <span style={{ fontSize: 12.5, color: C.muted }}>BW {fmt(fromKg(bwKg, unit))} {unit}
              <button onClick={() => { setInp(fmt(fromKg(bwKg, unit))); setEditing(true); }} style={{ background: "none", border: "none", color: C.red, fontWeight: 700, fontSize: 12.5, cursor: "pointer" }}>Edit</button>
            </span>
            <Segmented value={sex} onChange={setSex} options={[{ value: "male", label: "M" }, { value: "female", label: "F" }]} />
          </div>
        </div>
      ) : (
        <div style={{ marginTop: 10 }}>
          <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 8 }}>Enter your bodyweight to see DOTS &amp; Wilks.</div>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <div style={{ flex: 1 }}><NumField value={inp} onChange={setInp} suffix={unit} /></div>
            <Btn kind="primary" onClick={saveBw}>Save</Btn>
          </div>
          <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 10 }}>
            <Segmented value={sex} onChange={setSex} options={[{ value: "male", label: "Male" }, { value: "female", label: "Female" }]} />
          </div>
        </div>
      )}
      {share && <ShareSheet data={share} onClose={() => setShare(null)} />}
    </Card>
  );
}

function MeetSheet({ open, onClose, analysis, unit, state, setState }) {
  const meet = state.meet || { date: null, name: "", attempts: {} };
  const [share, setShare] = useState(null);
  const sex = (state.settings && state.settings.sex) || "male";
  const bwArr = state.bodyweight || [];
  const bwKg = bwArr.length ? bwArr[bwArr.length - 1].kg : null;
  const setMeet = (patch) => setState((s) => ({ ...s, meet: { ...(s.meet || { date: null, name: "", attempts: {} }), ...patch } }));
  const lifts = [analysis.big.squat, analysis.big.bench, analysis.big.deadlift].filter(Boolean);

  const attemptsFor = (lf) => {
    const ov = (meet.attempts && meet.attempts[lf.name]) || {};
    const kg = toKg(lf.e1rm, unit);
    return {
      opener: ov.opener != null ? ov.opener : round2_5(kg * 0.9),
      second: ov.second != null ? ov.second : round2_5(kg * 0.95),
      third: ov.third != null ? ov.third : round2_5(kg * 1.0),
    };
  };
  const setAttempt = (name, key, val) => setMeet({ attempts: { ...(meet.attempts || {}), [name]: { ...((meet.attempts || {})[name] || {}), [key]: val } } });
  const autoLift = (name) => setMeet({ attempts: { ...(meet.attempts || {}), [name]: {} } });

  const thirdsTotal = lifts.reduce((a, lf) => a + attemptsFor(lf).third, 0);
  const openersTotal = lifts.reduce((a, lf) => a + attemptsFor(lf).opener, 0);
  const dots = bwKg != null && lifts.length === 3 ? dotsCoeff(bwKg, sex) * thirdsTotal : null;
  const pct = { opener: "90%", second: "95%", third: "100%" };
  const lblmap = { opener: "Opener", second: "Second", third: "Third" };

  const shareMeet = () => {
    const sub = lifts.map((lf) => { const n = lf.name.toLowerCase(); const ab = n.includes("squat") ? "S" : n.includes("bench") ? "B" : "D"; return ab + " " + fmt(attemptsFor(lf).third); }).join("    ");
    doShare(setShare, { type: "stat", label: meet.name || "Projected meet total", value: fmt(thirdsTotal), unit: "kg", sub, date: meet.date ? fmtMeetDate(meet.date) : "" });
  };

  const inputStyle = { width: "100%", background: C.bg2, border: `1px solid ${C.line2}`, borderRadius: 12, padding: "0 12px", height: 44, color: C.text, fontSize: 15, fontWeight: 600, outline: "none" };

  return (
    <Sheet open={open} onClose={onClose} title="Meet prep">
      <div style={{ marginBottom: 12 }}>
        <div style={{ ...label, fontSize: 10, marginBottom: 6 }}>Meet date</div>
        <input type="date" value={meet.date || ""} onChange={(e) => setMeet({ date: e.target.value || null })}
          style={{ ...inputStyle, fontFamily: MONO, colorScheme: "dark" }} />
      </div>
      <div style={{ marginBottom: 14 }}>
        <div style={{ ...label, fontSize: 10, marginBottom: 6 }}>Meet name (optional)</div>
        <input value={meet.name || ""} onChange={(e) => setMeet({ name: e.target.value })} placeholder="e.g. State Championship"
          style={{ ...inputStyle, fontFamily: SANS }} />
      </div>

      {lifts.length === 0 ? (
        <div style={{ fontSize: 13, color: C.muted, padding: "10px 2px", lineHeight: 1.5 }}>
          Log squat, bench, and deadlift first — your attempts build off their estimated maxes.
        </div>
      ) : (
        <>
          <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 12, padding: "14px 16px", position: "relative", marginBottom: 12, textAlign: "center" }}>
            <button onClick={shareMeet} aria-label="Share" style={{ background: "none", border: "none", color: C.faint, cursor: "pointer", padding: 4, position: "absolute", top: 8, right: 8 }}><Share size={16} /></button>
            <div style={{ ...label, fontSize: 10 }}>If you hit your thirds</div>
            <div style={{ fontFamily: MONO, fontSize: 38, fontWeight: 700, lineHeight: 1, marginTop: 6 }}>{fmt(thirdsTotal)}<span style={{ fontSize: 15, color: C.muted, marginLeft: 4 }}>kg</span></div>
            <div style={{ fontSize: 12, color: C.muted, marginTop: 6 }}>
              Openers in the bag <b style={{ color: C.text, fontFamily: MONO }}>{fmt(openersTotal)}</b> kg{dots != null && <> · DOTS <b style={{ color: C.text, fontFamily: MONO }}>{fmt(Math.round(dots))}</b></>}
            </div>
          </div>

          {lifts.map((lf) => {
            const at = attemptsFor(lf);
            return (
              <Card key={lf.name} style={{ marginBottom: 10 }}>
                <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
                  <b style={{ fontSize: 15 }}>{lf.name}</b>
                  <span style={{ fontSize: 11.5, color: C.muted }}>e1RM {fmt(lf.e1rm)} {unit} · <button onClick={() => autoLift(lf.name)} style={{ background: "none", border: "none", color: C.red, fontWeight: 700, fontSize: 11.5, cursor: "pointer", padding: 0 }}>Auto</button></span>
                </div>
                {["opener", "second", "third"].map((k) => (
                  <div key={k} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 10 }}>
                    <div>
                      <div style={{ fontWeight: 800, fontSize: 13 }}>{lblmap[k]}</div>
                      <div style={{ fontSize: 11, color: C.faint }}>{pct[k]} · {fmt(Math.round(at[k] * LBKG))} lb</div>
                    </div>
                    <Stepper value={at[k]} step={2.5} min={0} suffix="kg" onChange={(v) => setAttempt(lf.name, k, v)} />
                  </div>
                ))}
              </Card>
            );
          })}
          {meet.date && <Btn kind="danger" onClick={() => setMeet({ date: null, attempts: {} })} style={{ width: "100%", marginTop: 4 }}>Clear meet</Btn>}
        </>
      )}
      {share && <ShareSheet data={share} onClose={() => setShare(null)} />}
    </Sheet>
  );
}

// Continuous freshness color: red-orange when badly depleted, through amber, into
// green as capacity returns — anchored to the app palette so 98% and 82% never read
// the same. `dim` darkens for the gradient's left edge.
function freshColor(pct, dim) {
  const t = Math.max(0, Math.min(1, (pct - 45) / 50));
  const A = [5, 76, 53], B = [42, 67, 55], D = [135, 38, 62]; // red -> gold -> green (HSL)
  const lerp = (a, b, k) => a + (b - a) * k;
  let h, s, l;
  if (t < 0.5) { const k = t / 0.5; h = lerp(A[0], B[0], k); s = lerp(A[1], B[1], k); l = lerp(A[2], B[2], k); }
  else { const k = Math.pow((t - 0.5) / 0.5, 0.72); h = lerp(B[0], D[0], k); s = lerp(B[1], D[1], k); l = lerp(B[2], D[2], k); }
  return `hsl(${Math.round(h)}, ${Math.round(s)}%, ${Math.round(l - (dim || 0))}%)`;
}

function FreshnessCard({ state }) {
  const [share, setShare] = useState(null);
  const mains = Object.entries(state.exercises).filter(([n, e]) => !e.parent && e.sets.length);
  if (!mains.length) return null;
  const now = Date.now(), DAY = 86400000;
  const rows = mains.map(([name, ex]) => {
    const scale = learnRecoveryScale(ex.sets);
    const rawAt = (d) => residualFatigue(ex.sets, now + d * DAY, true).raw;
    let full = 0;
    for (let d = 0; d <= 12; d++) { full = d; if (trimFor(rawAt(d), scale) < 0.01) break; }
    return { name, pct: readinessFor(rawAt(0), scale), full, ready: trimFor(rawAt(0), scale) < 0.01 };
  }).sort((a, b) => a.pct - b.pct);
  return (
    <Card accent={C.blue}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div style={{ ...label, fontSize: 10, marginBottom: 3 }}>Freshness forecast</div>
        <button onClick={() => doShare(setShare, { type: "freshness",
          date: new Date().toLocaleDateString(undefined, { month: "short", day: "numeric" }),
          rows: rows.map((r) => ({ name: r.name, pct: r.pct, color: freshColor(r.pct),
            note: r.ready ? "ready" : `full in ${r.full}d` })) })}
          aria-label="Share forecast" style={{ background: "none", border: "none", color: C.faint,
            cursor: "pointer", padding: 4, marginTop: -2, display: "flex" }}><Share size={16} /></button>
      </div>
      <div style={{ fontSize: 11.5, color: C.faint, marginBottom: 13, lineHeight: 1.5 }}>
        Estimated capacity right now, per lift — and when recent hard work has fully cleared.
      </div>
      {rows.map((r) => (
        <div key={r.name} style={{ marginBottom: 12 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 5 }}>
            <span style={{ fontWeight: 700, fontSize: 13.5 }}>{r.name}</span>
            <span style={{ fontSize: 11.5, color: freshColor(r.pct), fontWeight: 700 }}>
              <span style={{ fontFamily: MONO, fontSize: 14 }}>{r.pct}%</span>
              {r.ready ? " · ready" : ` · full in ${r.full}d`}
            </span>
          </div>
          <div style={{ height: 6, borderRadius: 3, background: "#0F1216", overflow: "hidden", boxShadow: "0 1px 3px rgba(0,0,0,0.4) inset" }}>
            <div style={{ width: `${Math.max(6, Math.min(100, r.pct))}%`, height: "100%", borderRadius: 3,
              background: `linear-gradient(90deg, ${freshColor(r.pct, 11)}, ${freshColor(r.pct)})`,
              boxShadow: `0 0 8px ${freshColor(r.pct)}55` }} />
          </div>
        </div>
      ))}
      {share && <ShareSheet data={share} onClose={() => setShare(null)} />}
    </Card>
  );
}

          {anyUp ? "New estimated high today — strength trending up." : "Logged and in the books. Keep stacking sessions."}
        </div>
      </div>
      {share && <ShareSheet data={share} onClose={() => setShare(null)} />}
    </Card>
  );
}

// Surfaces what the engine has actually learned about this lifter — data we compute on
// every render and have never shown. Always present, so Insights has a floor.
function ProfileCard({ state, unit }) {
  const [share, setShare] = useState(null);
  const rows = Object.entries(state.exercises)
    .filter(([n, e]) => !e.parent && e.sets.length >= 5)
    .map(([name, ex]) => ({
      name,
      top: learnDropScale(ex.sets, DEFAULT_FATIGUE_K, true),
      chain: learnDropScale(ex.sets, DEFAULT_FATIGUE_K, false),
      rec: learnRecoveryScale(ex.sets),
    }));
  if (!rows.length) return null;
  const read = (v, lo, mid, hi) => (v < 0.78 ? { txt: lo, c: C.good } : v > 1.22 ? { txt: hi, c: C.red } : { txt: mid, c: C.amber });
  const dims = (r) => [
    ["After a top set", read(r.top, "Holds strength", "Normal drop-off", "Falls off fast")],
    ["Between back-offs", read(r.chain, "Holds weight", "Steady descent", "Drops quickly")],
    ["Week to week", read(r.rec, "Recovers fast", "Normal recovery", "Carries fatigue")],
  ];
  return (
    <Card accent={C.amber}>
      <SectionHead accent={C.amber}
        sub="Learned from your own logged sets — this is what shapes the loads IRONSET gives you."
        right={<button aria-label="Share profile" onClick={() => doShare(setShare, { type: "session",
          headline: "My fatigue profile", sub: "learned from logged sets",
          lifts: rows.map((r) => ({ name: r.name, detail: dims(r).map((d) => d[1].txt).join("  ·  "), e1rm: null })),
          date: new Date().toLocaleDateString(undefined, { month: "short", day: "numeric" }) })}
          style={{ background: "none", border: "none", color: C.faint, cursor: "pointer", padding: 4, display: "flex" }}>
          <Share size={14} /></button>}>
        Your profile
      </SectionHead>
      {rows.map((r, i) => (
        <div key={r.name} style={{ borderTop: i === 0 ? "none" : `1px solid ${C.line}`, padding: i === 0 ? "0 0 13px" : "13px 0" }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 9 }}>{r.name}</div>
          {dims(r).map(([k, v]) => (
            <div key={k} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, marginBottom: 6 }}>
              <span style={{ fontSize: 11.5, color: C.faint }}>{k}</span>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12.5, fontWeight: 700, color: v.c }}>
                <span style={{ width: 6, height: 6, borderRadius: 99, background: v.c }} />{v.txt}
              </span>
            </div>
          ))}
        </div>
      ))}
      {share && <ShareSheet data={share} onClose={() => setShare(null)} />}
    </Card>
  );
}

// Rolling record of the last training days, so the tab has substance on rest days too.
function RecentCard({ state, unit, inputMode }) {
  const [share, setShare] = useState(null);
  const today = new Date().toDateString();
  const byDay = {};
  for (const [name, ex] of Object.entries(state.exercises))
    for (const s of ex.sets) {
      const k = new Date(s.ts).toDateString();
      (byDay[k] = byDay[k] || []).push({ ...s, lift: name });
    }
  const days = Object.keys(byDay).sort((a, b) => new Date(b) - new Date(a)).slice(0, 5);
  if (!days.length) return null;
  const eff = (s) => (inputMode === "rir" ? `${fmt(10 - s.rpe)} RIR` : `RPE ${fmt(s.rpe)}`);
  return (
    <Card accent={C.blue}>
      <SectionHead accent={C.blue} right={<button aria-label="Share recent" onClick={() => doShare(setShare, { type: "session",
        headline: "Recent sessions", sub: `${days.length} training days`,
        lifts: days.map((d) => {
          const all = byDay[d], w = all.filter((s) => !s.backoff), p = w.length ? w : all;
          const tp = p.reduce((x, y) => (y.weight > x.weight ? y : x), p[0]);
          return { name: dshort(new Date(d).getTime()), detail: `${fmt(tp.weight)}${unit} × ${tp.reps} · ${all.length} sets`, e1rm: null };
        }),
        date: new Date().toLocaleDateString(undefined, { month: "short", day: "numeric" }) })}
        style={{ background: "none", border: "none", color: C.faint, cursor: "pointer", padding: 4, display: "flex" }}>
        <Share size={14} /></button>}>Recent sessions</SectionHead>
      {days.map((d, i) => {
        const all = byDay[d];
        const work = all.filter((s) => !s.backoff);
        const pool = work.length ? work : all;
        const top = pool.reduce((x, y) => (y.weight > x.weight ? y : x), pool[0]);
        const lifts = Array.from(new Set(all.map((s) => s.lift)));
        return (
          <div key={d} style={{ borderTop: i === 0 ? "none" : `1px solid ${C.line}`, padding: i === 0 ? "0 0 12px" : "12px 0" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 10 }}>
              <span style={{ fontWeight: 700, fontSize: 13.5 }}>{lifts.slice(0, 2).join(" · ")}{lifts.length > 2 ? ` +${lifts.length - 2}` : ""}</span>
              <span style={{ fontSize: 11, fontFamily: MONO, whiteSpace: "nowrap",
                color: d === today ? C.good : C.faint, fontWeight: d === today ? 700 : 400 }}>
                {d === today ? "Today" : dshort(new Date(d).getTime())}
              </span>
            </div>
            <div style={{ fontSize: 11.5, color: C.muted, marginTop: 4, fontFamily: MONO }}>
              top {fmt(top.weight)}{unit} × {top.reps} <span style={{ color: C.faint }}>@ {eff(top)}</span>
              <span style={{ color: C.faint }}>  ·  {all.length} sets</span>
            </div>
          </div>
        );
      })}
      {share && <ShareSheet data={share} onClose={() => setShare(null)} />}
    </Card>
  );
}
