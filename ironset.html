              <Chip onClick={() => nudge(-0.5)}>Easier</Chip>
              <Chip onClick={() => {}}>As expected</Chip>
              <Chip onClick={() => nudge(0.5)}>Harder</Chip>
            </div>
          </div>
        )}

        <div style={{ display: "flex", gap: 10, marginTop: 14, alignItems: "flex-end", flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 110px" }}>
            <div style={{ ...label, fontSize: 10, marginBottom: 8 }}>Weight</div>
            <NumField value={log.weight} onChange={(v) => setLog((l) => ({ ...l, weight: v }))} suffix={unit} />
          </div>
          <div>
            <div style={{ ...label, fontSize: 10, marginBottom: 8 }}>Reps</div>
            <Stepper value={log.reps} onChange={(v) => setLog((l) => ({ ...l, reps: v }))} min={1} max={30} />
          </div>
          <div>
            <div style={{ ...label, fontSize: 10, marginBottom: 8 }}>{inputMode === "rir" ? "RIR" : "RPE"}</div>
            <Stepper value={log.int} onChange={(v) => setLog((l) => ({ ...l, int: v }))} step={0.5}
              min={inputMode === "rir" ? 0 : 5} max={inputMode === "rir" ? 6 : 10} />
          </div>
        </div>
        <input value={note} onChange={(e) => setNote(e.target.value)} placeholder="Note (optional)"
          style={{ width: "100%", marginTop: 12, background: C.bg2, border: `1px solid ${C.line}`, borderRadius: 12,
            padding: "11px 12px", color: C.text, fontFamily: SANS, fontSize: 14, outline: "none" }} />
        <Btn kind="primary" onClick={doLog} style={{ width: "100%", marginTop: 12 }} disabled={!parseFloat(log.weight)}>
          {justLogged ? <><Check size={17} /> Logged</> : "Log set"}
        </Btn>
        <div style={{ fontSize: 11, color: C.faint, marginTop: 8, textAlign: "center" }}>
          Every set you log retunes your 1RM — heavier feedback than expected lowers it, easier raises it.
        </div>
      </Card>

      {/* back-off sets */}
      {recR != null && (
        <Card accent={C.good}>
          <SectionHead accent={C.good} right={
            <span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 11, color: C.muted, fontWeight: 700 }}>Sets</span>
              <Stepper compact value={bo.sets} onChange={(v) => setBo({ sets: Math.max(1, Math.min(6, v)) })} min={1} max={6} />
            </span>
          }>Back-off sets</SectionHead>
          <div style={{ fontSize: 11, color: C.faint, marginTop: 4 }}>{percentMode ? "Set each back-off's own reps and % — the next one follows the set before it." : "Set each back-off's own reps and RPE; the load reads the fatigue from the set before it, so a grind drops the next one more."}</div>

          <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 10 }}>
            {todayBos.map((s, i) => (
              <div key={s.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between",
                background: C.bg2, border: `1px solid ${C.line}`, borderRadius: 12, padding: "9px 13px" }}>
                <div style={{ fontSize: 12, color: C.muted, fontWeight: 700 }}>
                  Back-off {i + 1}{s.lift !== sel ? <span style={{ color: C.blue }}> · {s.lift}</span> : null} · <span style={{ fontFamily: MONO, color: C.text }}>{fmt(s.weight)}{unit}</span> × {s.reps} <span style={{ color: C.faint }}>@ {inputMode === "rir" ? `${fmt(10 - s.rpe)} RIR` : `RPE ${fmt(s.rpe)}`}</span>
                </div>
                <Check size={15} style={{ color: C.good }} />
              </div>
            ))}

            {doneCount < bo.sets && (
              <div style={{ background: C.bg2, border: `1px solid ${C.line2}`, borderRadius: 12, padding: "14px 15px" }}>
                <div style={{ fontSize: 11, color: C.muted, fontWeight: 700, marginBottom: 10 }}>
                  Back-off {doneCount + 1} of {bo.sets}{!percentMode && prevForBo ? ` · off your ${inputMode === "rir" ? `${fmt(10 - prevForBo.rpe)} RIR` : `RPE ${fmt(prevForBo.rpe)}`} set` : ""}
                </div>
                {boFamily.length > 1 && (
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
                    {boFamily.map((n) => (
                      <Chip key={n} active={n === boTarget} onClick={() => setStep(doneCount, { lift: n === sel ? null : n })}>
                        {n === sel ? n : `${n} · ${Math.round(ratioOf(n) * 100)}%`}
                      </Chip>
                    ))}
                  </div>
                )}
                {boTarget !== sel && (
                  <div style={{ fontSize: 11, color: C.blue, fontWeight: 700, marginBottom: 10 }}>
                    Scaled to {Math.round(ratioOf(boTarget) * 100)}% of {sel} · fatigue still chains off your last set
                  </div>
                )}
                {/* this back-off's own target — drives the suggested weight below */}
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
                  <div>
                    <div style={{ ...label, fontSize: 10, marginBottom: 8 }}>Reps</div>
                    <Stepper value={boReps} onChange={(v) => setStep(doneCount, { reps: Math.max(1, Math.min(20, v)) })} min={1} max={20} />
                  </div>
                  <div>
                    <div style={{ ...label, fontSize: 10, marginBottom: 8 }}>{percentMode ? "% of max" : (inputMode === "rir" ? "RIR" : "RPE")}</div>
                    {percentMode
                      ? <Stepper value={boStepPct} onChange={(v) => setStep(doneCount, { pct: Math.max(30, Math.min(100, v)) })} step={2.5} min={30} max={100} suffix="%" />
                      : <Stepper value={inputMode === "rir" ? 10 - boRpe : boRpe} step={0.5} min={inputMode === "rir" ? 0 : 5} max={inputMode === "rir" ? 5 : 10}
                          onChange={(v) => setStep(doneCount, { rpe: inputMode === "rir" ? 10 - v : v })} />}
                  </div>
                  <div style={{ flex: "1 1 110px" }}>
                    <div style={{ ...label, fontSize: 10, marginBottom: 8 }}>Weight{boDirty ? "" : <span style={{ color: C.faint, fontWeight: 600 }}> · suggested</span>}</div>
                    <NumField value={curBo.weight} onChange={setBoW} suffix={unit} />
                  </div>
                </div>
                {boDirty && boSug != null && (
                  <button onClick={() => setBoDraft({ ...(boDraft || {}), weight: null })} style={{ background: "none", border: "none", color: C.faint,
                    fontSize: 11.5, fontWeight: 700, cursor: "pointer", marginTop: 8, padding: 0 }}>
                    ↺ suggested {fmt(boSug)}{unit} × {boReps}
                  </button>
                )}
                {/* how it actually landed — nudges only the logged RPE, never the load */}
                <div style={{ display: "flex", alignItems: "center", gap: 5, marginTop: 10, flexWrap: "wrap" }}>
                  <span style={{ fontSize: 11, color: C.faint, fontWeight: 700 }}>Felt</span>
                  <Chip sm active={boFeel < 0} onClick={() => nudgeBo(-0.5)}>Easier</Chip>
                  <Chip sm active={boFeel === 0} onClick={() => setBoDraft({ ...(boDraft || {}), feel: 0 })}>As asked</Chip>
                  <Chip sm active={boFeel > 0} onClick={() => nudgeBo(0.5)}>Harder</Chip>
                  {boFeel !== 0 && (
                    <span style={{ fontFamily: MONO, fontSize: 11, color: C.gold, fontWeight: 700 }}>
                      logging {inputMode === "rir" ? `${fmt(10 - curBo.rpe)} RIR` : `RPE ${fmt(curBo.rpe)}`}
                    </span>
                  )}
                </div>
                {(parseFloat(curBo.weight) || boSug) ? <PlateView total={parseFloat(curBo.weight) || boSug} bar={bar} denoms={denoms} unit={unit} /> : null}
                <Btn kind="primary" onClick={logCurBackoff} style={{ width: "100%", marginTop: 10 }}>Log {boTarget !== sel ? boTarget : `back-off ${doneCount + 1}`}</Btn>
              </div>
            )}

            {doneCount >= bo.sets && (
              <div style={{ fontSize: 12, color: C.muted, textAlign: "center", padding: "8px 0 2px" }}>
                All {bo.sets} back-off{bo.sets > 1 ? "s" : ""} logged.{" "}
                <button onClick={() => setBo({ sets: bo.sets + 1 })} style={{ background: "none", border: "none", color: C.text, fontWeight: 500, fontSize: 12, cursor: "pointer", padding: 0 }}>add another</button>
              </div>
            )}
          </div>
        </Card>
      )}

      <button onClick={() => setShowHow((v) => !v)} style={{ background: "none", border: "none", color: C.faint,
        fontSize: 12, fontWeight: 700, cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 5, alignSelf: "center" }}>
        <Info size={14} /> How the numbers work
      </button>
      {showHow && (
        <Card style={{ fontSize: 12.5, color: C.muted, lineHeight: 1.6 }}>
          Your RPE tells the calculator how close to failure a set was — RPE 8 means 2 reps left (2 RIR). That maps every set to a percent of your
          one-rep max using the standard RPE chart, so a triple at RPE 9 and a heavy single both inform the same estimate. New sets are blended in
          with recent ones weighted more, and low-rep top sets count more than long high-rep sets. Recommendations just run that estimate backward
          for the reps and RPE you prescribe. Back-offs read the fatigue from your last set's actual reps and how close to failure it was — a grindy RPE 9
          set drops the next one further than an easy one — and each set, top or back-off, feeds the one after it. The app also learns how fast you personally
          fade from past sessions. Back-offs stay out of your 1RM estimate so a tired one never drags your numbers down.
        </Card>
      )}

      {linking && sel && (
        <LinkSheet
          name={sel} exercise={state.exercises[sel]} mains={mains} childNames={childNames}
          effectiveRatio={model.ratio || 1}
          onClose={() => setLinking(false)}
          onSave={(patch) => { updateExercise(sel, patch); setLinking(false); }}
        />
      )}
    </div>
  );
}

function AddRow({ newName, setNewName, addExercise, mains }) {
  const [parent, setParent] = useState("");
  const submit = () => { if (!newName.trim()) return; addExercise(newName, parent || undefined); setNewName(""); setParent(""); };
  return (
    <div>
      <div style={{ display: "flex", gap: 8 }}>
        <input value={newName} onChange={(e) => setNewName(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") submit(); }}
          placeholder="e.g. Pause Squat"
          style={{ flex: 1, background: C.bg2, border: `1px solid ${C.line2}`, borderRadius: 12, padding: "11px 12px",
            color: C.text, fontFamily: SANS, fontSize: 14, outline: "none" }} />
        <Btn kind="primary" onClick={submit}>Add lift</Btn>
      </div>
      {mains && mains.length > 0 && (
        <div style={{ marginTop: 12 }}>
          <div style={{ ...label, fontSize: 10, marginBottom: 8 }}>Variation of (optional)</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            <Chip active={parent === ""} onClick={() => setParent("")}>None</Chip>
            {mains.map((m) => <Chip key={m} active={parent === m} onClick={() => setParent(m)}>{m}</Chip>)}
          </div>
          {parent && <div style={{ fontSize: 11, color: C.faint, marginTop: 7 }}>
            Feeds your {parent} estimate (≈{Math.round(defaultRatio(newName || "") * 100)}% to start, then auto-tunes from your numbers).
          </div>}
        </div>
      )}
    </div>
  );
}

function PlateView({ total, bar, denoms, unit }) {
  const r = platesPerSide(total, bar, denoms);
  if (r.below)
    return <div style={{ fontSize: 12, color: C.faint, marginTop: 10 }}>Below bar weight ({fmt(bar)} {unit}).</div>;
  if (r.items.length === 0)
    return <div style={{ fontSize: 12, color: C.faint, marginTop: 10 }}>Empty bar — {fmt(bar)} {unit}.</div>;
  const sizeFor = (p) => 30 + Math.min(26, (p / denoms[0]) * 26);
  return (
    <div style={{ marginTop: 12 }}>
      <div style={{ display: "flex", gap: 6, justifyContent: "center", alignItems: "center", flexWrap: "wrap" }}>
        {r.items.flatMap(({ p, c }) =>
          Array.from({ length: c }).map((_, i) => (
            <div key={p + "-" + i} style={{ width: 26, height: sizeFor(p), borderRadius: 12, background: C.surface2,
              border: `1px solid ${C.line2}`, display: "grid", placeItems: "center", fontFamily: MONO, fontSize: 10.5,
              fontWeight: 700, color: C.text }}>{fmt(p)}</div>
          ))
        )}
      </div>
      <div style={{ fontSize: 11, color: C.faint, marginTop: 8, textAlign: "center", fontFamily: MONO }}>
        {r.items.map((x) => `${fmt(x.p)}×${x.c}`).join("  ")} per side{r.leftover > 0 ? `  ·  +${fmt(r.leftover)} ${unit} off` : ""}
      </div>
    </div>
  );
}

/* ============================== HISTORY TAB ============================== */
function HistoryTab({ state, sel, setSel, models, deleteSet, updateSet, deleteExercise, unit, inputMode }) {
  const names = Object.keys(state.exercises);
  if (names.length === 0)
    return <Card style={{ textAlign: "center", color: C.muted, fontSize: 14, padding: "28px 16px" }}>
      No lifts yet. Add one in the Train tab to start tracking strength over time.
    </Card>;
  const cur = sel && state.exercises[sel] ? sel : names[0];
  const [armName, setArmName] = useState(null);
  const [confirmText, setConfirmText] = useState("");
  const [editing, setEditing] = useState(null);
  const iconBtn = { background: "none", border: "none", color: C.faint, cursor: "pointer", padding: 4 };
  const ex = state.exercises[cur];
  const model = models[cur];
  const sets = [...ex.sets].sort((a, b) => b.ts - a.ts);

  const best = model.points.length ? Math.max(...model.points.map((p) => p.value)) : null;
  const cutoff = Date.now() - 30 * 864e5;
  const before = model.points.filter((p) => p.ts <= cutoff).slice(-1)[0]?.value;
  const delta = before != null && model.e1rm != null ? model.e1rm - before : null;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4 }}>
        {names.map((n) => <Chip key={n} active={n === cur} onClick={() => setSel(n)}>{n}</Chip>)}
      </div>

      <Card glow={`radial-gradient(120% 90% at 50% -10%, ${C.blue}1F, transparent 70%)`}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 16 }}>
          {[["Current 1RM", model.e1rm, C.text], ["Best", best, C.text],
            ["30-day", delta, delta > 0 ? C.good : delta < 0 ? C.red : C.text]].map(([l, v, col]) => (
            <div key={l} style={{ background: "rgba(255,255,255,0.03)", border: `1px solid ${C.line}`,
              borderRadius: 14, padding: "11px 12px" }}>
              <div style={{ ...label, fontSize: 8.5 }}>{l}</div>
              <div style={{ fontFamily: SANS, fontSize: 20, fontWeight: 700, marginTop: 5, color: col,
                letterSpacing: "-0.035em", fontVariantNumeric: "tabular-nums" }}>
                {l === "30-day" && v != null && v > 0 ? "+" : ""}{v != null ? fmt(v) : "—"}
              </div>
            </div>
          ))}
        </div>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 9, marginBottom: 6 }}>
          <span style={{ ...label, fontSize: 9.5 }}>Strength trend ({unit})</span>
        </span>
        <LineChart data={model.points} height={176} unit={unit} />
      </Card>

      <Card style={{ padding: 0, overflow: "hidden" }}>
        <div style={{ padding: "14px 16px 6px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 9 }}>
              <span style={label}>Set log</span>
          </span>
          <span style={{ fontSize: 11.5, color: C.faint }}>{sets.length} total</span>
        </div>
        {sets.length === 0 && <div style={{ padding: "8px 16px 18px", color: C.faint, fontSize: 13 }}>No sets logged.</div>}
        {sets.map((s) => (
          <div key={s.id} style={{ padding: "11px 16px", borderTop: `1px solid ${C.line}`, display: "flex",
            alignItems: "center", justifyContent: "space-between", gap: 10 }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontFamily: MONO, fontSize: 15, fontWeight: 600 }}>
                {fmt(s.weight)}{unit} × {s.reps} <span style={{ color: C.muted }}>@ {inputMode === "rir" ? `${fmt(10 - s.rpe)} RIR` : `RPE ${fmt(s.rpe)}`}</span>
                {s.backoff && <span style={{ fontFamily: SANS, fontSize: 10, fontWeight: 600, color: C.muted,
                  border: `1px solid ${C.line2}`, borderRadius: 6, padding: "1px 6px", marginLeft: 8, letterSpacing: "0.04em", textTransform: "uppercase" }}>Back-off</span>}
              </div>
              <div style={{ fontSize: 11, color: C.faint, marginTop: 2 }}>
                {dshort(s.ts)}{s.backoff ? "" : ` · e1RM ${fmt(e1rmFromSet(s.weight, s.reps, s.rpe))}${unit}`}
                {s.fromRec && s.tRpe != null && (
                  <span style={{ color: Math.abs(s.rpe - s.tRpe) < 0.25 ? C.good : C.red }}>
                    {"  ·  target " + (inputMode === "rir" ? `${fmt(10 - s.tRpe)} RIR` : `RPE ${fmt(s.tRpe)}`) + (Math.abs(s.rpe - s.tRpe) < 0.25 ? " ✓" : ` → felt ${inputMode === "rir" ? `${fmt(10 - s.rpe)} RIR` : `RPE ${fmt(s.rpe)}`}`)}
                  </span>
                )}
                {s.note ? `  ·  ${s.note}` : ""}
              </div>
            </div>
            <div style={{ display: "flex", gap: 2, flexShrink: 0 }}>
              <button onClick={() => setEditing(s)} style={iconBtn}><Pencil size={15} /></button>
              <button onClick={() => deleteSet(cur, s.id)} style={iconBtn}><Trash2 size={16} /></button>
            </div>
          </div>
        ))}
      </Card>

      {armName === cur ? (
        <Card accent={C.red}>
          <div style={{ fontWeight: 600, fontSize: 14.5, marginBottom: 6 }}>Delete {cur}?</div>
          <div style={{ fontSize: 12.5, color: C.muted, lineHeight: 1.55, marginBottom: 12 }}>
            This removes {cur} and all {(state.exercises[cur] ? state.exercises[cur].sets.length : 0)} of its logged
            sets from your training. It moves to Recently deleted in Settings, where you can restore it.
            Type <b style={{ color: C.text }}>{cur}</b> below to confirm.
          </div>
          <input value={confirmText} onChange={(e) => setConfirmText(e.target.value)} placeholder={cur}
            style={{ width: "100%", background: "rgba(0,0,0,0.35)", border: `1px solid ${C.line2}`, borderRadius: R.input,
              padding: "0 13px", height: 46, color: C.text, fontFamily: SANS, fontSize: 15, fontWeight: 600,
              outline: "none", boxSizing: "border-box" }} />
          <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
            <Btn kind="danger" disabled={confirmText.trim() !== cur}
              onClick={() => { deleteExercise(cur); setArmName(null); setConfirmText(""); }}
              style={{ flex: 1 }}><Trash2 size={15} /> Delete</Btn>
            <Btn kind="ghost" onClick={() => { setArmName(null); setConfirmText(""); }} style={{ flex: 1 }}>Cancel</Btn>
          </div>
        </Card>
      ) : (
        <Btn kind="ghost" onClick={() => { setArmName(cur); setConfirmText(""); }} style={{ alignSelf: "flex-start", color: C.muted }}>
          <Trash2 size={15} /> Delete this lift
        </Btn>
      )}

      {editing && (
        <EditSetSheet
          set={editing} unit={unit} inputMode={inputMode}
          onClose={() => setEditing(null)}
          onSave={(patch) => { updateSet(cur, editing.id, patch); setEditing(null); }}
          onDelete={() => { deleteSet(cur, editing.id); setEditing(null); }}
        />
      )}
    </div>
  );
}

/* ===================== STRENGTH SCORE + MEET PREP ====================== */
function ScoreCard({ analysis, unit, state, setState }) {
  const sex = (state.settings && state.settings.sex) || "male";
  const bwArr = state.bodyweight || [];
  const bwKg = bwArr.length ? bwArr[bwArr.length - 1].kg : null;
  const [share, setShare] = useState(null);
  const [editing, setEditing] = useState(bwKg == null);
  const [inp, setInp] = useState(bwKg != null ? fmt(fromKg(bwKg, unit)) : "");
  const totalUnit = analysis.total;
  const totalKg = totalUnit != null ? toKg(totalUnit, unit) : null;
  const dots = bwKg != null && totalKg != null ? dotsCoeff(bwKg, sex) * totalKg : null;
  const wilks = bwKg != null && totalKg != null ? wilksCoeff(bwKg, sex) * totalKg : null;
  const tier = dotsTier(dots);
  const setSex = (v) => setState((s) => ({ ...s, settings: { ...s.settings, sex: v } }));
  const saveBw = () => {
    const v = parseFloat(inp);
    if (!isFinite(v) || v <= 0) return;
    const kg = toKg(v, unit);
    setState((s) => {
      const arr = [...(s.bodyweight || [])];
      const today = dateStrFromTs(Date.now());
      const i = arr.findIndex((e) => dateStrFromTs(e.ts) === today);
      if (i >= 0) arr[i] = { ...arr[i], kg }; else arr.push({ id: Date.now() + Math.random(), ts: Date.now(), kg });
      return { ...s, bodyweight: arr };
    });
    setEditing(false);
  };
  const doShareScore = () => doShare(setShare, { type: "stat", label: "DOTS score", value: fmt(Math.round(dots)), unit: "",
    sub: "Total " + fmt(Math.round(totalKg)) + " kg  @  " + fmt(Math.round(fromKg(bwKg, unit))) + " " + unit,
    date: new Date().toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) });

  if (totalKg == null) return (
    <Card accent={C.amber}>
      <div style={label}>Strength score</div>
      <div style={{ fontSize: 12.5, color: C.muted, marginTop: 8, lineHeight: 1.5 }}>
        Log squat, bench, and deadlift to see your DOTS and Wilks score.
      </div>
    </Card>
  );

  return (
    <Card style={{ position: "relative" }}>
      {dots != null && <button onClick={doShareScore} aria-label="Share" style={{ background: "none", border: "none", color: C.faint, cursor: "pointer", padding: 4, position: "absolute", top: 10, right: 10 }}><Share size={16} /></button>}
      <div style={label}>Strength score</div>
      {bwKg != null && !editing ? (
        <div>
          <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginTop: 8, flexWrap: "wrap" }}>
            <span style={{ fontFamily: SKETCH, fontSize: 40, fontWeight: 700, color: C.chalk, lineHeight: 1 }}>{fmt(Math.round(dots))}</span>
            <span style={{ ...label, fontSize: 10 }}>DOTS</span>
            {tier && <span style={{ fontSize: 11, color: C.muted, fontWeight: 700 }}>≈ {tier}</span>}
          </div>
          <div style={{ display: "flex", gap: 16, marginTop: 8, fontSize: 12.5, color: C.muted }}>
            <span>Wilks <b style={{ color: C.text, fontFamily: MONO }}>{fmt(Math.round(wilks))}</b></span>
            <span>Total <b style={{ color: C.text, fontFamily: MONO }}>{fmt(Math.round(totalKg))}</b> kg</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 12, gap: 10 }}>
            <span style={{ fontSize: 12.5, color: C.muted }}>BW {fmt(fromKg(bwKg, unit))} {unit}
              <button onClick={() => { setInp(fmt(fromKg(bwKg, unit))); setEditing(true); }} style={{ background: "none", border: "none", color: C.text, fontWeight: 500, fontSize: 12.5, cursor: "pointer" }}>Edit</button>
            </span>
            <Segmented value={sex} onChange={setSex} options={[{ value: "male", label: "M" }, { value: "female", label: "F" }]} />
          </div>
        </div>
      ) : (
        <div style={{ marginTop: 10 }}>
          <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 8 }}>Enter your bodyweight to see DOTS &amp; Wilks.</div>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <div style={{ flex: 1 }}><NumField value={inp} onChange={setInp} suffix={unit} /></div>
            <Btn kind="primary" onClick={saveBw}>Save</Btn>
          </div>
          <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 10 }}>
            <Segmented value={sex} onChange={setSex} options={[{ value: "male", label: "Male" }, { value: "female", label: "Female" }]} />
          </div>
        </div>
      )}
      {share && <ShareSheet data={share} onClose={() => setShare(null)} />}
    </Card>
  );
}

function MeetSheet({ open, onClose, analysis, unit, state, setState }) {
  const meet = state.meet || { date: null, name: "", attempts: {} };
  const [share, setShare] = useState(null);
  const sex = (state.settings && state.settings.sex) || "male";
  const bwArr = state.bodyweight || [];
  const bwKg = bwArr.length ? bwArr[bwArr.length - 1].kg : null;
  const setMeet = (patch) => setState((s) => ({ ...s, meet: { ...(s.meet || { date: null, name: "", attempts: {} }), ...patch } }));
  const lifts = [analysis.big.squat, analysis.big.bench, analysis.big.deadlift].filter(Boolean);

  const attemptsFor = (lf) => {
    const ov = (meet.attempts && meet.attempts[lf.name]) || {};
    const kg = toKg(lf.e1rm, unit);
    return {
      opener: ov.opener != null ? ov.opener : round2_5(kg * 0.9),
      second: ov.second != null ? ov.second : round2_5(kg * 0.95),
      third: ov.third != null ? ov.third : round2_5(kg * 1.0),
    };
  };
  const setAttempt = (name, key, val) => setMeet({ attempts: { ...(meet.attempts || {}), [name]: { ...((meet.attempts || {})[name] || {}), [key]: val } } });
  const autoLift = (name) => setMeet({ attempts: { ...(meet.attempts || {}), [name]: {} } });

  const thirdsTotal = lifts.reduce((a, lf) => a + attemptsFor(lf).third, 0);
  const openersTotal = lifts.reduce((a, lf) => a + attemptsFor(lf).opener, 0);
  const dots = bwKg != null && lifts.length === 3 ? dotsCoeff(bwKg, sex) * thirdsTotal : null;
  const pct = { opener: "90%", second: "95%", third: "100%" };
  const lblmap = { opener: "Opener", second: "Second", third: "Third" };

  const shareMeet = () => {
    const sub = lifts.map((lf) => { const n = lf.name.toLowerCase(); const ab = n.includes("squat") ? "S" : n.includes("bench") ? "B" : "D"; return ab + " " + fmt(attemptsFor(lf).third); }).join("    ");
    doShare(setShare, { type: "stat", label: meet.name || "Projected meet total", value: fmt(thirdsTotal), unit: "kg", sub, date: meet.date ? fmtMeetDate(meet.date) : "" });
  };

  const inputStyle = { width: "100%", background: C.bg2, border: `1px solid ${C.line2}`, borderRadius: 12, padding: "0 12px", height: 44, color: C.text, fontSize: 15, fontWeight: 600, outline: "none" };

  return (
    <Sheet open={open} onClose={onClose} title="Meet prep">
      <div style={{ marginBottom: 12 }}>
        <div style={{ ...label, fontSize: 10, marginBottom: 6 }}>Meet date</div>
        <input type="date" value={meet.date || ""} onChange={(e) => setMeet({ date: e.target.value || null })}
          style={{ ...inputStyle, fontFamily: MONO, colorScheme: "dark" }} />
      </div>
      <div style={{ marginBottom: 14 }}>
        <div style={{ ...label, fontSize: 10, marginBottom: 6 }}>Meet name (optional)</div>
        <input value={meet.name || ""} onChange={(e) => setMeet({ name: e.target.value })} placeholder="e.g. State Championship"
          style={{ ...inputStyle, fontFamily: SANS }} />
      </div>

      {lifts.length === 0 ? (
        <div style={{ fontSize: 13, color: C.muted, padding: "10px 2px", lineHeight: 1.5 }}>
          Log squat, bench, and deadlift first — your attempts build off their estimated maxes.
        </div>
      ) : (
        <>
          <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 12, padding: "14px 16px", position: "relative", marginBottom: 12, textAlign: "center" }}>
            <button onClick={shareMeet} aria-label="Share" style={{ background: "none", border: "none", color: C.faint, cursor: "pointer", padding: 4, position: "absolute", top: 8, right: 8 }}><Share size={16} /></button>
            <div style={{ ...label, fontSize: 10 }}>If you hit your thirds</div>
            <div style={{ fontFamily: SANS, fontSize: 36, fontWeight: 700, lineHeight: 1, marginTop: 8, letterSpacing: "-0.04em", fontVariantNumeric: "tabular-nums" }}>{fmt(thirdsTotal)}<span style={{ fontSize: 15, color: C.muted, marginLeft: 4 }}>kg</span></div>
            <div style={{ fontSize: 12, color: C.muted, marginTop: 6 }}>
              Openers in the bag <b style={{ color: C.text, fontFamily: MONO }}>{fmt(openersTotal)}</b> kg{dots != null && <> · DOTS <b style={{ color: C.text, fontFamily: MONO }}>{fmt(Math.round(dots))}</b></>}
            </div>
          </div>

          {lifts.map((lf) => {
            const at = attemptsFor(lf);
            return (
              <Card key={lf.name} style={{ marginBottom: 10 }}>
                <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
                  <b style={{ fontSize: 15 }}>{lf.name}</b>
                  <span style={{ fontSize: 11.5, color: C.muted }}>e1RM {fmt(lf.e1rm)} {unit} · <button onClick={() => autoLift(lf.name)} style={{ background: "none", border: "none", color: C.text, fontWeight: 500, fontSize: 11.5, cursor: "pointer", padding: 0 }}>Auto</button></span>
                </div>
                {["opener", "second", "third"].map((k) => (
                  <div key={k} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 10 }}>
                    <div>
                      <div style={{ fontWeight: 600, fontSize: 13 }}>{lblmap[k]}</div>
                      <div style={{ fontSize: 11, color: C.faint }}>{pct[k]} · {fmt(Math.round(at[k] * LBKG))} lb</div>
                    </div>
                    <Stepper value={at[k]} step={2.5} min={0} suffix="kg" onChange={(v) => setAttempt(lf.name, k, v)} />
                  </div>
                ))}
              </Card>
            );
          })}
          {meet.date && <Btn kind="danger" onClick={() => setMeet({ date: null, attempts: {} })} style={{ width: "100%", marginTop: 4 }}>Clear meet</Btn>}
        </>
      )}
      {share && <ShareSheet data={share} onClose={() => setShare(null)} />}
    </Sheet>
  );
}

// Continuous freshness color: red-orange when badly depleted, through amber, into
// green as capacity returns — anchored to the app palette so 98% and 82% never read
// the same. `dim` darkens for the gradient's left edge.
function freshColor(pct, dim) {
  const t = Math.max(0, Math.min(1, (pct - 45) / 50));
  // Desaturated on purpose: these are materials (rust, brass, sage), not traffic
  // lights. A readiness bar should inform at a glance without competing with the
  // one red thing on the screen that is actually asking to be pressed.
  // Fully recovered is deliberately near-neutral: on a good day the whole card
  // reads as chalk, and colour only appears as a lift starts to fall behind. It
  // means the eye is drawn to a problem rather than to a row of green bars
  // congratulating you for nothing.
  const A = [10, 48, 46], B = [34, 38, 50], D = [150, 7, 53]; // rust -> brass -> chalk (HSL)
  const lerp = (a, b, k) => a + (b - a) * k;
  let h, s, l;
  if (t < 0.5) { const k = t / 0.5; h = lerp(A[0], B[0], k); s = lerp(A[1], B[1], k); l = lerp(A[2], B[2], k); }
  else { const k = Math.pow((t - 0.5) / 0.5, 0.72); h = lerp(B[0], D[0], k); s = lerp(B[1], D[1], k); l = lerp(B[2], D[2], k); }
  return `hsl(${Math.round(h)}, ${Math.round(s)}%, ${Math.round(l - (dim || 0))}%)`;
}

function FreshnessCard({ state }) {
  const [share, setShare] = useState(null);
  const mains = Object.entries(state.exercises).filter(([n, e]) => !e.parent && e.sets.length);
  if (!mains.length) return null;
  const now = Date.now(), DAY = 86400000;
  const rows = mains.map(([name, ex]) => {
    const scale = learnRecoveryScale(ex.sets);
    const rawAt = (d) => residualFatigue(ex.sets, now + d * DAY, true).raw;
    let full = 0;
    for (let d = 0; d <= 12; d++) { full = d; if (trimFor(rawAt(d), scale) < 0.01) break; }
    return { name, pct: readinessFor(rawAt(0), scale), full, ready: trimFor(rawAt(0), scale) < 0.01 };
  }).sort((a, b) => a.pct - b.pct);
  return (
    <Card accent={C.blue}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div style={{ ...label, fontSize: 10, marginBottom: 3 }}>Freshness forecast</div>
        <button onClick={() => doShare(setShare, { type: "freshness",
          date: new Date().toLocaleDateString(undefined, { month: "short", day: "numeric" }),
          rows: rows.map((r) => ({ name: r.name, pct: r.pct, color: freshColor(r.pct),
            note: r.ready ? "ready" : `full in ${r.full}d` })) })}
          aria-label="Share forecast" style={{ background: "none", border: "none", color: C.faint,
            cursor: "pointer", padding: 4, marginTop: -2, display: "flex" }}><Share size={16} /></button>
      </div>
      <div style={{ fontSize: 11.5, color: C.faint, marginBottom: 13, lineHeight: 1.5 }}>
        Estimated capacity right now, per lift — and when recent hard work has fully cleared.
      </div>
      {rows.map((r) => (
        <div key={r.name} style={{ marginBottom: 12 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 5 }}>
            <span style={{ fontWeight: 700, fontSize: 13.5 }}>{r.name}</span>
            <span style={{ fontSize: 11.5, color: freshColor(r.pct), fontWeight: 700 }}>
              <span style={{ fontFamily: MONO, fontSize: 14 }}>{r.pct}%</span>
              {r.ready ? " · ready" : ` · full in ${r.full}d`}
            </span>
          </div>
          <div style={{ height: 6, borderRadius: 3, background: "#0F1216", overflow: "hidden", boxShadow: "0 1px 3px rgba(0,0,0,0.4) inset" }}>
            <div style={{ width: `${Math.max(6, Math.min(100, r.pct))}%`, height: "100%", borderRadius: 3,
              background: `linear-gradient(90deg, ${freshColor(r.pct, 11)}, ${freshColor(r.pct)})`,
              boxShadow: `0 0 8px ${freshColor(r.pct)}55` }} />
          </div>
        </div>
      ))}
      {share && <ShareSheet data={share} onClose={() => setShare(null)} />}
    </Card>
  );
}

function SessionCard({ session, unit, inputMode }) {
  const [share, setShare] = useState(null);
  if (!session) return null;
  const { lifts, totalSets, backoffs, anyUp } = session;
  const eff = (s) => inputMode === "rir" ? `${fmt(10 - s.rpe)} RIR` : `RPE ${fmt(s.rpe)}`;
  const dateStr = new Date().toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  const shareSession = () => doShare(setShare, {
    type: "session", date: dateStr,
    headline: lifts.length === 1 ? lifts[0].name : `${lifts.length} lifts \u00b7 ${totalSets} sets`,
    sub: anyUp ? "new estimated high" : `${totalSets} sets${backoffs ? ` \u00b7 ${backoffs} back-off` : ""}`,
    lifts: lifts.map((l) => ({ name: l.name, up: l.up,
      detail: `${fmt(l.top.weight)}${unit} \u00d7 ${l.top.reps} @ ${eff(l.top)}`,
      e1rm: l.e1rm != null ? fmt(Math.round(l.e1rm)) : null })),
  });
  return (
    <Card accent={C.good} style={{ padding: 0, overflow: "hidden" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "13px 16px 11px",
        borderBottom: `1px solid ${C.line}` }}>
        <div>
          <div style={{ ...label, fontSize: 10 }}>Today's session</div>
          <div style={{ fontFamily: SANS, fontWeight: 600, fontSize: 17, marginTop: 2, letterSpacing: "-0.02em" }}>{dateStr}</div>
        </div>
        <button onClick={shareSession} aria-label="Share session" style={{ background: "none", border: "none",
          color: C.faint, cursor: "pointer", padding: 6, marginLeft: "auto", marginRight: 10, display: "flex" }}><Share size={16} /></button>
        <div style={{ textAlign: "right" }}>
          <div style={{ fontFamily: SANS, fontSize: 22, fontWeight: 700, lineHeight: 1, letterSpacing: "-0.03em" }}>{lifts.length}<span style={{ fontSize: 11, color: C.muted }}> {lifts.length === 1 ? "lift" : "lifts"}</span></div>
          <div style={{ fontSize: 10.5, color: C.muted, marginTop: 2 }}>{totalSets} set{totalSets !== 1 ? "s" : ""}{backoffs ? ` · ${backoffs} back-off` : ""}</div>
        </div>
      </div>
      <div style={{ padding: "6px 16px 12px" }}>
        {lifts.map((l) => (
          <div key={l.name} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "9px 0",
            borderBottom: l === lifts[lifts.length - 1] ? "none" : `1px solid ${C.line}` }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontWeight: 700, fontSize: 13.5 }}>{l.name}</div>
              <div style={{ fontSize: 11.5, color: C.muted, marginTop: 2, fontFamily: MONO }}>
                {fmt(l.top.weight)}{unit} × {l.top.reps} <span style={{ color: C.faint }}>@ {eff(l.top)}</span>
              </div>
            </div>
            {l.e1rm != null && (
              <div style={{ textAlign: "right", flexShrink: 0, marginLeft: 10 }}>
                <div style={{ fontFamily: MONO, fontSize: 15, fontWeight: 700, color: l.up ? C.good : C.text }}>
                  {l.up ? "▲ " : ""}{fmt(Math.round(l.e1rm))}
                </div>
                <div style={{ ...label, fontSize: 8, marginTop: 1 }}>est 1rm</div>
              </div>
            )}
          </div>
        ))}
        <div style={{ fontSize: 11.5, color: anyUp ? C.good : C.muted, marginTop: 10, fontWeight: 600, textAlign: "center" }}>
          {anyUp ? "New estimated high today — strength trending up." : "Logged and in the books. Keep stacking sessions."}
        </div>
      </div>
      {share && <ShareSheet data={share} onClose={() => setShare(null)} />}
    </Card>

}

// Surfaces what the engine has actually learned about this lifter — data we compute on
// every render and have never shown. Always present, so Insights has a floor.
function ProfileCard({ state, unit }) {
  const [share, setShare] = useState(null);
  const rows = Object.entries(state.exercises)
    .filter(([n, e]) => !e.parent && e.sets.length >= 5)
    .map(([name, ex]) => ({
      name,
      top: learnDropScale(ex.sets, DEFAULT_FATIGUE_K, true),
      chain: learnDropScale(ex.sets, DEFAULT_FATIGUE_K, false),
      rec: learnRecoveryScale(ex.sets),
    }));
  if (!rows.length) return null;
  const read = (v, lo, mid, hi) => (v < 0.78 ? { txt: lo, c: C.good } : v > 1.22 ? { txt: hi, c: C.red } : { txt: mid, c: C.amber });
  const dims = (r) => [
    ["After a top set", read(r.top, "Holds strength", "Normal drop-off", "Falls off fast")],
    ["Between back-offs", read(r.chain, "Holds weight", "Steady descent", "Drops quickly")],
    ["Week to week", read(r.rec, "Recovers fast", "Normal recovery", "Carries fatigue")],
  ];
  return (
    <Card>
      <SectionHead
        sub="Learned from your own logged sets — this is what shapes the loads IRONSET gives you."
        right={<button aria-label="Share profile" onClick={() => doShare(setShare, { type: "session",
          headline: "My fatigue profile", sub: "learned from logged sets",
          lifts: rows.map((r) => ({ name: r.name, detail: dims(r).map((d) => d[1].txt).join("  ·  "), e1rm: null })),
          date: new Date().toLocaleDateString(undefined, { month: "short", day: "numeric" }) })}
          style={{ background: "none", border: "none", color: C.faint, cursor: "pointer", padding: 4, display: "flex" }}>
          <Share size={14} /></button>}>
        Your profile
      </SectionHead>
      {rows.map((r, i) => (
        <div key={r.name} style={{ borderTop: i === 0 ? "none" : `1px solid ${C.line}`, padding: i === 0 ? "0 0 16px" : "16px 0" }}>
          <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 11, letterSpacing: "-0.015em" }}>{r.name}</div>
          {dims(r).map(([k, v]) => (
            <div key={k} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, marginBottom: 8 }}>
              <span style={{ fontSize: 12.5, color: C.faint }}>{k}</span>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 7, fontSize: 12.5, fontWeight: 500, color: C.text }}>
                <span style={{ width: 5, height: 5, borderRadius: 99, background: v.c }} />{v.txt}
              </span>
            </div>
          ))}
        </div>
      ))}
      {share && <ShareSheet data={share} onClose={() => setShare(null)} />}
    </Card>
  );
}

// Rolling record of the last training days, so the tab has substance on rest days too.
function RecentCard({ state, unit, inputMode }) {
  const [share, setShare] = useState(null);
  const today = new Date().toDateString();
  const byDay = {};
  for (const [name, ex] of Object.entries(state.exercises))
    for (const s of ex.sets) {
      const k = new Date(s.ts).toDateString();
      (byDay[k] = byDay[k] || []).push({ ...s, lift: name });
    }
  const days = Object.keys(byDay).sort((a, b) => new Date(b) - new Date(a)).slice(0, 5);
  if (!days.length) return null;
  const eff = (s) => (inputMode === "rir" ? `${fmt(10 - s.rpe)} RIR` : `RPE ${fmt(s.rpe)}`);
  return (
    <Card accent={C.blue}>
      <SectionHead accent={C.blue} right={<button aria-label="Share recent" onClick={() => doShare(setShare, { type: "session",
        headline: "Recent sessions", sub: `${days.length} training days`,
        lifts: days.map((d) => {
          const all = byDay[d], w = all.filter((s) => !s.backoff), p = w.length ? w : all;
          const tp = p.reduce((x, y) => (y.weight > x.weight ? y : x), p[0]);
          return { name: dshort(new Date(d).getTime()), detail: `${fmt(tp.weight)}${unit} × ${tp.reps} · ${all.length} sets`, e1rm: null };
        }),
        date: new Date().toLocaleDateString(undefined, { month: "short", day: "numeric" }) })}
        style={{ background: "none", border: "none", color: C.faint, cursor: "pointer", padding: 4, display: "flex" }}>
        <Share size={14} /></button>}>Recent sessions</SectionHead>
      {days.map((d, i) => {
        const all = byDay[d];
        const work = all.filter((s) => !s.backoff);
        const pool = work.length ? work : all;
        const top = pool.reduce((x, y) => (y.weight > x.weight ? y : x), pool[0]);
        const lifts = Array.from(new Set(all.map((s) => s.lift)));
        return (
          <div key={d} style={{ borderTop: i === 0 ? "none" : `1px solid ${C.line}`, padding: i === 0 ? "0 0 12px" : "12px 0" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 10 }}>
              <span style={{ fontWeight: 700, fontSize: 13.5 }}>{lifts.slice(0, 2).join(" · ")}{lifts.length > 2 ? ` +${lifts.length - 2}` : ""}</span>
              <span style={{ fontSize: 11, fontFamily: MONO, whiteSpace: "nowrap",
                color: d === today ? C.good : C.faint, fontWeight: d === today ? 700 : 400 }}>
                {d === today ? "Today" : dshort(new Date(d).getTime())}
              </span>
            </div>
            <div style={{ fontSize: 11.5, color: C.muted, marginTop: 4, fontFamily: MONO }}>
              top {fmt(top.weight)}{unit} × {top.reps} <span style={{ color: C.faint }}>@ {eff(top)}</span>
              <span style={{ color: C.faint }}>  ·  {all.length} sets</span>
            </div>
          </div>
        );
      })}
      {share && <ShareSheet data={share} onClose={() => setShare(null)} />}
    </Card>
  );
}

function InsightsTab({ analysis, unit, state, setState }) {

  const [share, setShare] = useState(null);
  const [showEngine, setShowEngine] = useState(false);
  const dismissed = state.dismissedInsights || {};
  const dismiss = (it) => setState((s) => ({ ...s, dismissedInsights: { ...(s.dismissedInsights || {}), [it.id]: it.detail } }));
  const shownInsights = insights.filter((it) => dismissed[it.id] !== it.detail);
  const iconBtn = { background: "none", border: "none", color: C.faint, cursor: "pointer", padding: 4, flexShrink: 0, display: "flex", alignItems: "center" };
  const dateStr = new Date().toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  const shareStat = () => {
    const sub = parts.slice(0, 3).map((p) => {
      const n = p.name.toLowerCase();
      const ab = n.includes("squat") ? "S" : n.includes("bench") ? "B" : n.includes("dead") ? "D" : p.name.slice(0, 2).toUpperCase();
      return ab + " " + fmt(Math.round(p.e1rm));
    }).join("    ");
    doShare(setShare, { type: "stat", label: "Projected total", value: fmt(Math.round(total)), unit, delta: totalDelta != null ? Math.round(totalDelta) : null, sub, date: dateStr });
  };
  const shareInsight = (it) => doShare(setShare, { type: "insight", title: it.title, detail: it.detail, accent: sevColor[it.sev], date: dateStr });

      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <SessionCard session={analysis.session} unit={unit} inputMode={state.settings.inputMode} />
        <ProfileCard state={state} unit={unit} />
        <RecentCard state={state} unit={unit} inputMode={state.settings.inputMode} />
        <Card style={{ textAlign: "center", color: C.muted, fontSize: 13.5, padding: "28px 18px", lineHeight: 1.6 }}>

        </Card>
      </div>
    );

    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <SessionCard session={analysis.session} unit={unit} inputMode={state.settings.inputMode} />
      {shownInsights.length > 0 && (
        <SectionHead accent={C.red} right={Object.keys(dismissed).length > 0 ? (
          <button onClick={() => setState((s) => ({ ...s, dismissedInsights: {} }))}
            style={{ background: "none", border: "none", color: C.faint, fontSize: 11.5, fontWeight: 700, cursor: "pointer", padding: 0 }}>
            Restore dismissed
          </button>
        ) : null}>What changed</SectionHead>
      )}
      {shownInsights.map((it) => (
        <div key={it.id} style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: R.surface, padding: "16px 18px" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 9, minWidth: 0 }}>
              <span style={{ width: 5, height: 5, borderRadius: 99, background: sevColor[it.sev], flexShrink: 0 }} />
              <span style={{ fontWeight: 600, fontSize: 14, letterSpacing: "-0.015em" }}>{it.title}</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 2, marginRight: -4 }}>
              <button onClick={() => shareInsight(it)} aria-label="Share" style={iconBtn}><Share size={15} /></button>
              <button onClick={() => dismiss(it)} aria-label="Dismiss" style={iconBtn}><X size={15} /></button>
            </div>
          </div>
          <div style={{ fontSize: 13, color: C.muted, marginTop: 7, lineHeight: 1.55, paddingLeft: 14 }}>{it.detail}</div>
        </div>
      ))}

      <div style={{ fontSize: 11, color: C.faint, textAlign: "center", marginTop: 2, lineHeight: 1.5 }}>
        These read your own logged data and refresh every time you train.
      </div>
      <ProfileCard state={state} unit={unit} />
      <RecentCard state={state} unit={unit} inputMode={state.settings.inputMode} />
      <Btn kind="ghost" onClick={() => setShowEngine(true)} style={{ width: "100%" }}><Info size={15} /> How the engine thinks</Btn>
      <Sheet open={showEngine} onClose={() => setShowEngine(false)} title="The engine">
        <div style={{ fontSize: 12.5, color: C.text, lineHeight: 1.6, marginBottom: 16 }}>
          Every number in IRONSET is computed from your own logged sets — nothing generic, nothing canned. Here's the thinking underneath.
        </div>
        {[
          ["Estimated 1RM", "Every set implies a max through the RPE chart — a triple at 9 and a heavy single speak the same language. New sets blend in with recent work weighted most, and each set's pull is earned: hard, low-rep sets move the number; light or long sets barely nudge it, because their ratings are the least reliable."],
          ["Freshness correction", "A set performed under predicted residual fatigue from a hard recent session is read as a fatigued-day performance and converted to fresh terms before it touches your estimate — a brutal week can't masquerade as strength loss."],
          ["Variations", "Linked variations feed one family model through a learned ratio to their main lift, so a paused-squat PR sharpens your squat estimate too."],
          ["Back-offs", "Suggestions come off your actual last set, discounted by your personal fatigue profile — learned separately per lift, and separately for the top-set drop versus the chain, from every transition you've ever logged."],
          ["Week-over-week capacity", "Work above ~RPE 8 leaves a recovery debt that decays across the days between sessions. Its size is learned per lift from your own history, and when it applies your prescriptions are trimmed — visibly — while your max stays untouched."],
        ].map(([t, d]) => (
          <div key={t} style={{ marginBottom: 16 }}>
            <div style={{ ...label, fontSize: 10, marginBottom: 6, color: C.text }}>{t}</div>
            <div style={{ fontSize: 12.5, color: C.muted, lineHeight: 1.6 }}>{d}</div>
          </div>
        ))}
      </Sheet>
      {share && <ShareSheet data={share} onClose={() => setShare(null)} />}
    </div>
  );
}

function ShareSheet({ data, onClose }) {
  if (!data) return null;
  const canShare = typeof navigator !== "undefined" && navigator.share && navigator.canShare && navigator.canShare({ files: [data.file] });
  const save = () => { const a = document.createElement("a"); a.href = data.url; a.download = data.file.name; document.body.appendChild(a); a.click(); a.remove(); };
  const reshare = async () => { try { await navigator.share({ files: [data.file] }); } catch (e) {} };
  return (
    <Sheet open onClose={onClose} title="Share">
      <img src={data.url} alt="IRONSET card" style={{ width: "100%", borderRadius: 12, display: "block", border: `1px solid ${C.line}` }} />
      <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
        {canShare && <Btn kind="primary" onClick={reshare} style={{ flex: 1 }}>Share</Btn>}
        <Btn kind="solid" onClick={save} style={{ flex: 1 }}>Save image</Btn>
      </div>
      <div style={{ fontSize: 11.5, color: C.faint, marginTop: 10, textAlign: "center", lineHeight: 1.5 }}>
        On iPhone you can also press and hold the image to save it or send it straight to Instagram or Messages.
      </div>
    </Sheet>
  );
}

/* ============================== LINK SHEET ============================== */
function LinkSheet({ name, exercise, mains, childNames, effectiveRatio, onClose, onSave }) {
  const isMainWithKids = childNames.length > 0;
  const [parent, setParent] = useState(exercise.parent || "");
  const [mode, setMode] = useState(typeof exercise.ratioManual === "number" ? "custom" : "auto");
  const [pct, setPct] = useState(String(Math.round((exercise.ratioManual ?? exercise.ratio ?? effectiveRatio ?? 0.9) * 100)));
  const fld = { fontSize: 11, color: C.muted, marginBottom: 6, fontWeight: 700 };
  const options = mains.filter((m) => m !== name);
  const save = () => {
    if (!parent) { onSave({ parent: undefined, ratio: undefined, ratioManual: undefined }); return; }
    const patch = { parent };
    if (mode === "custom") patch.ratioManual = Math.min(1.5, Math.max(0.3, (parseFloat(pct) || 90) / 100));
    else { patch.ratioManual = undefined; if (typeof exercise.ratio !== "number") patch.ratio = defaultRatio(name); }
    onSave(patch);
  };
  return (
    <Sheet open onClose={onClose} title="Link to a main lift">
      {isMainWithKids ? (
        <div style={{ fontSize: 13, color: C.muted, lineHeight: 1.6 }}>
          <b style={{ color: C.text }}>{name}</b> is a main lift and already pools: {childNames.join(", ")}. Relink those variations elsewhere first if you want to make this one a variation.
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          <div>
            <div style={fld}>Variation of</div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              <Chip active={parent === ""} onClick={() => setParent("")}>None — main lift</Chip>
              {options.map((m) => <Chip key={m} active={parent === m} onClick={() => setParent(m)}>{m}</Chip>)}
            </div>
          </div>
          {parent && (
            <div>
              <div style={fld}>Strength ratio to {parent}</div>
              <Segmented value={mode} onChange={setMode} options={[{ value: "auto", label: "AUTO" }, { value: "custom", label: "CUSTOM" }]} />
              {mode === "custom" ? (
                <div style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 8 }}>
                  <div style={{ width: 120 }}><NumField value={pct} onChange={setPct} suffix="%" /></div>
                  <div style={{ fontSize: 12, color: C.faint }}>of your {parent}</div>
                </div>
              ) : (
                <div style={{ fontSize: 11.5, color: C.faint, marginTop: 8 }}>
                  Currently ≈{Math.round((effectiveRatio || 0.9) * 100)}%. Auto-learns the real ratio once both lifts have a few logged sets.
                </div>
              )}
            </div>
          )}
          <Btn kind="primary" onClick={save} style={{ width: "100%" }}>Save</Btn>
        </div>
      )}
    </Sheet>
  );
}

/* ============================== EDIT SET ================================= */
function EditSetSheet({ set, unit, inputMode, onClose, onSave, onDelete }) {
  const [date, setDate] = useState(dateStrFromTs(set.ts));
  const [weight, setWeight] = useState(String(set.weight));
  const [reps, setReps] = useState(set.reps);
  const [int, setInt] = useState(inputMode === "rir" ? 10 - set.rpe : set.rpe);
  const [note, setNote] = useState(set.note || "");
  const fld = { fontSize: 11, color: C.muted, marginBottom: 6, fontWeight: 700 };
  const save = () => {
    const w = parseFloat(weight);
    if (isNaN(w) || w <= 0) return;
    const rpe = inputMode === "rir" ? 10 - int : int;
    let ts = set.ts; // keep original time-of-day unless the day actually changed
    if (date !== dateStrFromTs(set.ts)) { const [y, m, d] = date.split("-").map(Number); ts = new Date(y, m - 1, d, 12, 0, 0).getTime(); }
    onSave({ ts, weight: w, reps, rpe, note: note.trim() || undefined });
  };
  return (
    <Sheet open onClose={onClose} title="Edit set">
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <div>
          <div style={fld}>Date</div>
          <DateField value={date} onChange={setDate} />
        </div>
        <div style={{ display: "flex", gap: 10, alignItems: "flex-end", flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 110px" }}>
            <div style={fld}>Weight</div>
            <NumField value={weight} onChange={setWeight} suffix={unit} />
          </div>
          <div>
            <div style={fld}>Reps</div>
            <Stepper value={reps} onChange={setReps} min={1} max={30} />
          </div>
          <div>
            <div style={fld}>{inputMode === "rir" ? "RIR" : "RPE"}</div>
            <Stepper value={int} onChange={setInt} step={0.5} min={inputMode === "rir" ? 0 : 5} max={inputMode === "rir" ? 6 : 10} />
          </div>
        </div>
        <input value={note} onChange={(e) => setNote(e.target.value)} placeholder="Note (optional)"
          style={{ width: "100%", background: C.bg2, border: `1px solid ${C.line}`, borderRadius: 12, padding: "11px 12px",
            color: C.text, fontFamily: SANS, fontSize: 14, outline: "none" }} />
        <div style={{ fontSize: 11.5, color: C.faint }}>
          New estimate from this set: {fmt(e1rmFromSet(parseFloat(weight) || 0, reps, inputMode === "rir" ? 10 - int : int))} {unit} e1RM
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <Btn kind="primary" onClick={save} style={{ flex: 1 }} disabled={!parseFloat(weight)}>Save changes</Btn>
          <Btn kind="danger" onClick={onDelete}><Trash2 size={15} /></Btn>
        </div>
      </div>
    </Sheet>
  );
}

/* ============================== SETTINGS ================================= */
function SettingsSheet({ open, onClose, settings, setSetting, state, setState }) {
  const restoreExercise = (name) => setState((s) => {
    const item = (s.trash || []).find((x) => x.name === name);
    if (!item) return s;
    const key = s.exercises[name] ? `${name} (restored)` : name;
    return { ...s, exercises: { ...s.exercises, [key]: { ...item.ex, name: key } },
      trash: (s.trash || []).filter((x) => x.name !== name) };
  });
  const purgeExercise = (name) => setState((s) => ({ ...s, trash: (s.trash || []).filter((x) => x.name !== name) }));
  const [backup, setBackup] = useState("");
  const [importText, setImportText] = useState("");
  const [err, setErr] = useState("");
  const [armReset, setArmReset] = useState(false);
  const [saveStatus, setSaveStatus] = useState(null);
  const testStorage = () => {
    try {
      const tk = "ironset-selftest", v = String(Date.now());
      localStorage.setItem(tk, v);
      const ok = localStorage.getItem(tk) === v;
      localStorage.removeItem(tk);
      setSaveStatus(ok ? { ok: true, msg: "Saving works on this device. ✓" } : { ok: false, msg: "Couldn't read data back — Private Browsing may be blocking storage." });
    } catch (e) { setSaveStatus({ ok: false, msg: "Storage blocked: " + ((e && e.message) || String(e)) + " — turn off Private Browsing." }); }
  };
  const [dlOk, setDlOk] = useState(false);
  const fileRef = useRef(null);
  const exportData = () => setBackup(JSON.stringify(state));
  const applyBackup = (txt) => {
    setErr("");
    try {
      const p = JSON.parse(txt);
      if (!p || typeof p !== "object" || !p.exercises) throw new Error("bad shape");
      setState({ ...DEFAULT, ...p, settings: { ...DEFAULT.settings, ...(p.settings || {}) } });
      onClose();
    } catch (e) { setErr("That doesn't look like valid IRONSET backup data."); }
  };
  const downloadBackup = () => {
    setErr("");
    try {
      const d = new Date();
      const stamp = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
      const blob = new Blob([JSON.stringify(state)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `ironset-backup-${stamp}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      setDlOk(true); setTimeout(() => setDlOk(false), 2500);
    } catch (e) { setErr("Couldn't create the file — use Show backup and copy the text instead."); }
  };
  const pickFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => applyBackup(String(r.result || ""));
    r.onerror = () => setErr("Couldn't read that file.");
    r.readAsText(f);
    e.target.value = "";
  };
  const importData = () => applyBackup(importText);
  const row = { marginBottom: 18 };
  return (
    <Sheet open={open} onClose={onClose} title="Settings">
      <div style={row}>
        <div style={{ ...label, fontSize: 10, marginBottom: 8 }}>Training style</div>
        <Segmented value={settings.trainingMode || "rpe"} onChange={(v) => {
            if (v === "percent") { setSetting("trainingMode", "percent"); setSetting("inputMode", "rir"); }
            else { setSetting("trainingMode", "rpe"); setSetting("inputMode", "rpe"); }
          }}
          options={[{ value: "rpe", label: "RPE" }, { value: "percent", label: "%" }]} />
        <div style={{ fontSize: 11.5, color: C.faint, marginTop: 6 }}>
          {settings.trainingMode === "percent" ? "Prescribe by reps and a % of your max." : "Prescribe by reps and RPE — the app suggests the load."}
        </div>
      </div>
      {settings.trainingMode === "percent" && (
        <div style={row}>
          <div style={{ ...label, fontSize: 10, marginBottom: 8 }}>Percentages run off</div>
          <Segmented value={settings.maxMode || "dynamic"} onChange={(v) => setSetting("maxMode", v)}
            options={[{ value: "dynamic", label: "Estimated max" }, { value: "locked", label: "Max I set" }]} />
          <div style={{ fontSize: 11.5, color: C.faint, marginTop: 6 }}>
            {settings.maxMode === "locked" ? "A training max you set per lift and bump yourself each cycle." : "Your live estimated max — auto-updates as you log."}
          </div>
        </div>
      )}
      <div style={row}>
        <div style={{ ...label, fontSize: 10, marginBottom: 8 }}>Units</div>
        <Segmented value={settings.unit} onChange={(v) => {
            if (v === settings.unit) return;
            const f = v === "kg" ? 1 / LBKG : LBKG;
            const cv = (w) => (typeof w === "number" ? Math.round(w * f * 10) / 10 : w);
            setState((s) => {
              const exercises = {};
              for (const [k, e] of Object.entries(s.exercises))
                exercises[k] = { ...e, sets: e.sets.map((st) => ({ ...st, weight: cv(st.weight), rec: st.rec != null ? cv(st.rec) : st.rec })), tmax: e.tmax != null ? cv(e.tmax) : e.tmax };
              return { ...s, exercises, settings: { ...s.settings, unit: v, bar: roundTo((s.settings.bar || 0) * f, v === "kg" ? 2.5 : 5), round: v === "kg" ? 2.5 : 5, unitSchema: 2 } };
            });
          }}
          options={[{ value: "lb", label: "LB" }, { value: "kg", label: "KG" }]} />
      </div>
      {settings.trainingMode !== "percent" && (
        <div style={row}>
          <div style={{ ...label, fontSize: 10, marginBottom: 8 }}>Prescribe intensity as</div>
          <Segmented value={settings.inputMode} onChange={(v) => setSetting("inputMode", v)}
            options={[{ value: "rpe", label: "RPE" }, { value: "rir", label: "RIR" }]} />
          <div style={{ fontSize: 11.5, color: C.faint, marginTop: 6 }}>RPE 8 and 2 RIR mean the same thing — pick the scale you think in.</div>
        </div>
      )}
      <div style={row}>
        <div style={{ ...label, fontSize: 10, marginBottom: 8 }}>Round loads to nearest</div>
        <Segmented value={settings.round} onChange={(v) => setSetting("round", v)}
          options={[{ value: 1, label: "1" }, { value: 2.5, label: "2.5" }, { value: 5, label: "5" }]} />
      </div>
      <div style={row}>
        <div style={{ ...label, fontSize: 10, marginBottom: 8 }}>Bar weight (for plate math)</div>
        <NumField value={settings.bar} onChange={(v) => setSetting("bar", parseFloat(v) || 0)} suffix={settings.unit} />
      </div>

      <div style={{ borderTop: `1px solid ${C.line}`, paddingTop: 16, marginTop: 4 }}>
        <div style={{ ...label, fontSize: 10, marginBottom: 8 }}>Saving</div>
        <Btn kind="solid" onClick={testStorage} style={{ width: "100%" }}>Test saving on this device</Btn>
        {saveStatus && <div style={{ fontSize: 12.5, marginTop: 8, fontWeight: 600, color: saveStatus.ok ? C.good : C.red }}>{saveStatus.msg}</div>}
        <div style={{ fontSize: 11.5, color: C.faint, marginTop: 6 }}>
          If saving isn't available here, your logs won't survive a close — use the hosted web version, which saves on your phone.
        </div>
      </div>

      <div style={{ borderTop: `1px solid ${C.line}`, paddingTop: 16, marginTop: 16 }}>
        <div style={{ ...label, fontSize: 10, marginBottom: 8 }}>Recently deleted</div>
        {(state.trash || []).length === 0 ? (
          <div style={{ fontSize: 11.5, color: C.faint, marginBottom: 18, lineHeight: 1.5 }}>
            Nothing deleted. Lifts you remove land here so you can bring them back.
          </div>
        ) : (
          <div style={{ marginBottom: 18 }}>
            {(state.trash || []).map((x) => (
              <div key={x.name} style={{ display: "flex", alignItems: "center", justifyContent: "space-between",
                gap: 10, padding: "10px 0", borderTop: `1px solid ${C.line}` }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontWeight: 700, fontSize: 13.5 }}>{x.name}</div>
                  <div style={{ fontSize: 11, color: C.faint, marginTop: 2 }}>
                    {x.ex && x.ex.sets ? x.ex.sets.length : 0} sets · deleted {dshort(x.ts)}
                  </div>
                </div>
                <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                  <Btn kind="solid" onClick={() => restoreExercise(x.name)} style={{ minHeight: 38, padding: "8px 14px", fontSize: 13 }}>Restore</Btn>
                  <button onClick={() => purgeExercise(x.name)} aria-label="Remove permanently"
                    style={{ background: "none", border: "none", color: C.faint, cursor: "pointer", padding: 6 }}><X size={16} /></button>
                </div>
              </div>
            ))}
          </div>
        )}
        <div style={{ ...label, fontSize: 10, marginBottom: 4 }}>Backup</div>
        <div style={{ fontSize: 11.5, color: C.faint, marginBottom: 9, lineHeight: 1.5 }}>
          Your training is saved on this device only. Download a backup file now and then — clearing your browser data would otherwise wipe it.
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <Btn kind="primary" onClick={downloadBackup} style={{ flex: 1 }}>{dlOk ? "Saved ✓" : "Download backup"}</Btn>
          <Btn kind="solid" onClick={() => fileRef.current && fileRef.current.click()} style={{ flex: 1 }}>Restore from file</Btn>
        </div>
        <input ref={fileRef} type="file" accept="application/json,.json" onChange={pickFile} style={{ display: "none" }} />
        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
          <Btn kind="ghost" onClick={exportData} style={{ flex: 1, fontSize: 12.5, minHeight: 38 }}>Show as text</Btn>
          <Btn kind="ghost" onClick={importData} style={{ flex: 1, fontSize: 12.5, minHeight: 38 }} disabled={!importText.trim()}>Restore from text</Btn>
        </div>
        {backup && <textarea readOnly value={backup} onFocus={(e) => e.target.select()} rows={3}
          style={{ width: "100%", marginTop: 8, background: C.bg, border: `1px solid ${C.line}`, borderRadius: 8,
            color: C.muted, fontSize: 11, fontFamily: MONO, padding: 8, resize: "vertical" }} />}
        <textarea value={importText} onChange={(e) => setImportText(e.target.value)} placeholder="Paste backup data here to restore" rows={2}
          style={{ width: "100%", marginTop: 8, background: C.bg, border: `1px solid ${C.line}`, borderRadius: 8,
            color: C.text, fontSize: 11, fontFamily: MONO, padding: 8, resize: "vertical", outline: "none" }} />
        {err && <div style={{ color: C.red, fontSize: 12, marginTop: 6 }}>{err}</div>}
      </div>

      <div style={{ borderTop: `1px solid ${C.line}`, paddingTop: 16, marginTop: 16 }}>
        {armReset ? (
          <div style={{ display: "flex", gap: 8 }}>
            <Btn kind="danger" onClick={() => { setState(DEFAULT); setArmReset(false); onClose(); }} style={{ flex: 1 }}>Yes, erase everything</Btn>
            <Btn kind="ghost" onClick={() => setArmReset(false)} style={{ flex: 1 }}>Cancel</Btn>
          </div>
        ) : (
          <Btn kind="danger" onClick={() => setArmReset(true)} style={{ width: "100%" }}>Reset all data</Btn>
        )}
      </div>
    </Sheet>
  );
}


class Boundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(e, info) { console.error(e, info); }
  render() {
    if (this.state.err) return (
      <div style={{ padding: 20, minHeight: "100vh", background: "#0C0D10", color: "#ECEAE3", fontFamily: "system-ui, sans-serif" }}>
        <div style={{ fontWeight: 600, marginBottom: 8 }}>IRONSET hit an error</div>
        <div style={{ fontSize: 12, color: "#9098A4", marginBottom: 10 }}>Reload the page. Your saved data on this device is untouched.</div>
        <pre style={{ whiteSpace: "pre-wrap", fontSize: 11, color: "#E23B2E" }}>{String((this.state.err && this.state.err.message) || this.state.err)}</pre>
      </div>
    );
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(<Boundary><App /></Boundary>);

</script>
</body>
</html>
