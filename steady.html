            <p className="muted">You moved for {plural(Math.max(1, Math.round(doneToday.reduce((s, h) => s + h.secs, 0) / 60)), "minute")}. That's the habit growing.</p>
            <button className="btn btn-tint" onClick={() => onStart("bonus")}><Bolt size={20} /> Fancy a bonus round?</button>
          </div>
        ) : (
          <>
            <Figure move={first} weights={hasW} />
            <div className="today-body">
              <div className="stack-s" style={{ gap: "0.35rem" }}>
                <span className="eyebrow">Today's workout</span>
                <h2>{session.title}</h2>
                <div className="meta">
                  <span><Clock size={18} /> {session.minutes} minutes</span>
                  <span>{plural(session.moves.length, "move")}</span>
                  {session.rounds > 1 && <span>{session.rounds} rounds</span>}
                </div>
              </div>
              <button className="btn btn-sun btn-big" onClick={() => onStart()}><Play size={24} /> Start</button>
              <div className="chips">{session.chips.map((ch) => <span key={ch} className="tag">{ch}</span>)}</div>
              <button className="link" style={{ alignSelf: "flex-start" }} aria-expanded={showMoves} onClick={() => setShowMoves(!showMoves)}>
                {showMoves ? "Hide the moves" : `See all ${session.moves.length} moves first`}
              </button>
              {showMoves && <MoveList session={session} weights={hasW} />}
            </div>
          </>
        )}
      </section>

      <div className="card stack-s">
        <WeekStrip info={info} />
        <p style={{ fontWeight: 700 }}>{weekMessage(info.count, p.days)}</p>
      </div>

      {!doneToday.length && (
        <div className="card stack-s">
          <h3>Not feeling it?</h3>
          <p className="muted">Do two minutes. Most days you'll want to keep going, and if not, two minutes still counts.</p>
          <button className="btn btn-tint" onClick={() => onStart("mini")}><Play size={20} /> Just 2 minutes</button>
        </div>
      )}

      {!doneToday.length && (
        <div className="stack-s">
          <span className="eyebrow">Change today's workout</span>
          <div className="chips">
            {p.minutes > 5 && <button className="chip" aria-pressed={mode === "short"} onClick={() => setToday(mode === "short" ? "normal" : "short")}><Shorter size={20} /> Shorter</button>}
            <button className="chip" aria-pressed={mode === "gentle"} onClick={() => setToday(mode === "gentle" ? "normal" : "gentle")}><Feather size={20} /> Gentler</button>
            <button className="chip" onClick={() => setToday(mode, true)}><Shuffle size={20} /> Different moves</button>
          </div>
        </div>
      )}

      <p className="muted" style={{ fontSize: "0.95rem" }}>
        Your plan: {p.minutes} minutes, {p.days === 7 ? "every day" : `${p.days} days a week`}, {WHEN_PHRASE[p.when] || "whenever suits"}.
      </p>
    </div>
  );
}

/* ----------------------------------------------------------------------------
   WORKOUT PLAYER
---------------------------------------------------------------------------- */
function Ring({ frac, children }) {
  const r = 52, C = 2 * Math.PI * r;
  return (
    <div className="ring">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle className="ring-bg" cx="60" cy="60" r={r} strokeWidth="10" fill="none" />
        <circle className="ring-fg" cx="60" cy="60" r={r} strokeWidth="10" fill="none" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C * (1 - clamp(frac, 0, 1))} />
      </svg>
      <div className="num">{children}</div>
    </div>
  );
}

function Player({ session, ctx, settings, setSetting, onQuit, onDone, onEasier }) {
  const [steps, setSteps] = useState(session.steps);
  const [i, setI] = useState(0);
  const [paused, setPaused] = useState(false);
  const [confirm, setConfirm] = useState(false);
  const [, tick] = useState(0);
  const clock = useRef({ end: Date.now() + steps[0].secs * 1000, rem: null, active: 0, last: Date.now(), cue: -1, half: false, reached: new Set() });
  const step = steps[i];
  const nextWorkIdx = (from) => { for (let k = from; k < steps.length; k++) if (steps[k].kind === "work") return k; return -1; };
  const shownIdx = step.kind === "work" ? i : nextWorkIdx(i);
  const shown = shownIdx >= 0 ? MOVE[steps[shownIdx].id] : null;
  const works = steps.map((s, k) => [s, k]).filter(([s]) => s.kind === "work");
  const left = clock.current.rem != null ? clock.current.rem : clock.current.end - Date.now();
  const secsLeft = Math.max(0, Math.ceil(left / 1000));
  const frac = 1 - left / (step.secs * 1000);
  const mirror = step.kind === "work" && shown && shown.sides && left <= step.secs * 500;
  useWakeLock(true);

  const announce = (k, list = steps) => {
    const s = list[k];
    if (s.kind === "work") { Beep.tone(880, 0.18); const m = MOVE[s.id]; clock.current.reached.add(s.id); Voice.say(`${m.name}. ${m.sides ? "First side. " : ""}${m.cue}`); }
    else if (s.kind === "ready") { const n = nextWorkIdx(k); Voice.say(`Get ready. First up, ${MOVE[list[n].id].name}.`); }
    else { const n = nextWorkIdx(k); Voice.say(n >= 0 ? `Rest. Next up, ${MOVE[list[n].id].name}.` : "Rest."); }
  };
  const finish = () => { Voice.say("All done. Brilliant work."); Beep.tone(988, 0.3); onDone({ secs: Math.round(clock.current.active / 1000), moves: [...clock.current.reached], complete: true }); };
  const goTo = (k) => {
    if (k >= steps.length) { finish(); return; }
    k = Math.max(0, k);
    const c = clock.current;
    c.end = Date.now() + steps[k].secs * 1000;
    if (c.rem != null) c.rem = steps[k].secs * 1000;
    c.cue = -1; c.half = false;
    setI(k);
    announce(k);
  };
  useEffect(() => { announce(0); return () => Voice.stop(); }, []);
  useEffect(() => {
    const id = setInterval(() => {
      const c = clock.current, now = Date.now();
      if (c.rem == null) c.active += now - c.last;
      c.last = now;
      const l = c.rem != null ? c.rem : c.end - now;
      const s = Math.ceil(l / 1000);
      if (c.rem == null && s <= 3 && s >= 1 && s !== c.cue) { c.cue = s; Beep.tone(660, 0.1); }
      if (c.rem == null && step.kind === "work" && MOVE[step.id].sides && !c.half && l <= step.secs * 500) { c.half = true; Beep.tone(880, 0.15); Voice.say("Switch sides."); }
      if (c.rem == null && l <= 0) goTo(i + 1); else tick((x) => x + 1);
    }, 200);
    return () => clearInterval(id);
  }, [i, steps]);
  const pause = () => { const c = clock.current; if (c.rem != null) return; c.rem = Math.max(0, c.end - Date.now()); setPaused(true); Voice.stop(); };
  const resume = () => { const c = clock.current; if (c.rem == null) return; c.end = Date.now() + c.rem; c.rem = null; c.last = Date.now(); setPaused(false); };
  useEffect(() => { const f = () => { if (document.visibilityState === "hidden") pause(); }; document.addEventListener("visibilitychange", f); return () => document.removeEventListener("visibilitychange", f); }, []);
  const skipBack = () => {
    const elapsed = step.secs * 1000 - left;
    if (step.kind === "work" && elapsed > 4000) { goTo(i); return; }
    for (let k = i - 1; k >= 0; k--) if (steps[k].kind === "work") { goTo(k); return; }
    goTo(0);
  };
  const easier = step.kind === "work" ? easierFor(MOVE[step.id], ctx) : null;
  const makeEasier = () => {
    const from = step.id;
    const ns = steps.map((s, k) => (k >= i && s.id === from ? { ...s, id: easier.id } : s));
    setSteps(ns);
    clock.current.reached.add(easier.id);
    onEasier(from);
    Voice.say(`No problem. Try ${easier.name} instead.`);
  };
  const quit = () => { pause(); setConfirm(true); };
  const doneSecs = Math.round(clock.current.active / 1000);

  const workNo = works.findIndex(([, k]) => k === shownIdx) + 1;
  const blockWorks = works.filter(([s]) => s.block === (shownIdx >= 0 ? steps[shownIdx].block : "")).map(([, k]) => k);
  const label = step.kind === "ready" ? "Get ready" : `${steps[shownIdx] ? steps[shownIdx].label : ""}`;
  return (
    <div className={"player " + step.kind}>
      <div className="p-top">
        <button className="icon-btn" onClick={quit} aria-label="Stop workout"><X /></button>
        <div className="label">{label}</div>
        <button className="icon-btn" onClick={() => setSetting("voice", !settings.voice)} aria-label={settings.voice ? "Turn voice coach off" : "Turn voice coach on"} aria-pressed={settings.voice}>
          {settings.voice ? <Volume /> : <VolumeOff />}
        </button>
      </div>
      <div className="segs" aria-hidden="true">
        {works.map(([s, k]) => <span key={k} className="seg"><i style={{ width: (k < i ? 100 : k === i ? clamp(frac, 0, 1) * 100 : 0) + "%" }} /></span>)}
      </div>
      {shown && <div className="p-stage"><Figure move={shown} mirror={mirror} weights={(ctx.p.kit || []).includes("weights")} /></div>}

      {step.kind === "work" ? (
        <div className="p-info">
          <Ring frac={frac}>{fmtClock(secsLeft)}</Ring>
          <div className="stack-s" style={{ gap: "0.35rem", minWidth: 0 }}>
            <div className="row" style={{ gap: "0.4rem", flexWrap: "wrap" }}>
              {shown.sides && <span className="side-pill">{mirror ? "Side 2 of 2" : "Side 1 of 2"}</span>}
              {paused && <span className="paused-pill">Paused</span>}
              <span className="muted" style={{ fontWeight: 700, fontSize: "0.9rem" }}>Move {workNo} of {works.length}</span>
            </div>
            <h2>{shown.name}</h2>
          </div>
        </div>
      ) : (
        <div className="p-info">
          <Ring frac={frac}>{fmtClock(secsLeft)}</Ring>
          <div className="stack-s" style={{ gap: "0.3rem", minWidth: 0 }}>
            <div className="row" style={{ gap: "0.4rem" }}>
              <span className="muted" style={{ fontWeight: 800 }}>{step.kind === "ready" ? "Get ready" : "Rest"}</span>
              {paused && <span className="paused-pill">Paused</span>}
            </div>
            {shown && <h2 style={{ fontSize: "1.3rem" }}><span className="muted" style={{ fontWeight: 700 }}>Up next: </span>{shown.name}</h2>}
          </div>
        </div>
      )}
      <div className="p-scroll">{shown && <ol className="steps">{shown.steps.map((s, k) => <li key={k}>{s}</li>)}</ol>}</div>
      {step.kind === "work" && easier && <button className="btn btn-line" onClick={makeEasier}><Feather size={22} /> Make it easier</button>}
      {step.kind !== "work" && <button className="btn btn-tint" onClick={() => goTo(i + 1)}>{step.kind === "ready" ? "I'm ready" : "Skip the rest"}</button>}

      <div className="p-controls">
        <button className="ctl" onClick={skipBack} aria-label="Back"><span className="icon-btn"><SkipBack /></span>Back</button>
        <button className="ctl-main" onClick={paused ? resume : pause} aria-label={paused ? "Resume" : "Pause"}>{paused ? <Play size={34} /> : <Pause size={34} />}</button>
        <button className="ctl" onClick={() => goTo(i + 1)} aria-label="Skip"><span className="icon-btn"><SkipNext /></span>Skip</button>
      </div>

      {confirm && (
        <div className="overlay" role="dialog" aria-modal="true" aria-labelledby="stop-t">
          <div className="dialog">
            <h2 id="stop-t">Stop here?</h2>
            {doneSecs >= 60
              ? <p className="muted">You've done {plural(Math.round(doneSecs / 60), "minute")}. That still counts and we'll save it.</p>
              : <p className="muted">You've only just started. Nothing will be saved yet.</p>}
            <button className="btn btn-sun" onClick={() => { setConfirm(false); resume(); }}>Keep going</button>
            <button className="btn btn-line" onClick={() => { Voice.stop(); doneSecs >= 60 ? onDone({ secs: doneSecs, moves: [...clock.current.reached], complete: false }) : onQuit(); }}>
              {doneSecs >= 60 ? "Save and stop" : "Stop"}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function Finish({ result, st, onFeel }) {
  const info = weekInfo(st.history, st.profile.days);
  const mins = Math.max(1, Math.round(result.secs / 60));
  const total = st.history.length;
  const justHit = info.count === st.profile.days;
  return (
    <div className="full stack" style={{ textAlign: "center" }}>
      <div className="burst"><Check size={60} /></div>
      <h1>{result.complete ? "Workout done." : "Nice work."}</h1>
      <p className="muted" style={{ fontSize: "1.1rem" }}>{plural(mins, "minute")} of moving. {total === 1 ? "Your very first one." : `That's ${total} workouts so far.`}</p>
      <div className="card" style={{ textAlign: "left" }}>
        <WeekStrip info={info} />
        <p style={{ fontWeight: 700, marginTop: "0.6rem" }}>{justHit ? "That's your weekly goal hit." : weekMessage(info.count, st.profile.days)}</p>
      </div>
      <div className="spacer" />
      <h2>How did that feel?</h2>
      <div className="feel">
        <button className="opt" onClick={() => onFeel("easy")}>Too easy</button>
        <button className="opt" onClick={() => onFeel("right")}>Just right</button>
        <button className="opt" onClick={() => onFeel("hard")}>Too hard</button>
      </div>
      <button className="link" style={{ alignSelf: "center" }} onClick={() => onFeel(null)}>Skip</button>
    </div>
  );
}

/* ----------------------------------------------------------------------------
   PROGRESS
---------------------------------------------------------------------------- */
const MILESTONES = [1, 5, 10, 25, 50, 100];
function ChairChart({ checks }) {
  const data = checks.slice(-6);
  const W = 300, H = 150, pad = 22, bw = Math.min(40, (W - pad * 2) / data.length - 12);
  const max = Math.max(...data.map((d) => d.count), 10);
  const x = (i) => pad + ((W - pad * 2) / data.length) * (i + 0.5);
  const y = (v) => H - 26 - (v / max) * (H - 50);
  return (
    <svg className="chart" viewBox={`0 0 ${W} ${H}`} role="img" aria-label={`Sit-to-stand results: ${data.map((d) => d.count).join(", ")}`} style={{ width: "100%", height: "auto" }}>
      {data.map((d, i) => (
        <g key={i}>
          <rect className={"bar" + (i === data.length - 1 ? " last" : "")} x={x(i) - bw / 2} y={y(d.count)} width={bw} height={H - 26 - y(d.count)} rx="5" />
          <text className="val" x={x(i)} y={y(d.count) - 6} textAnchor="middle">{d.count}</text>
          <text x={x(i)} y={H - 8} textAnchor="middle">{fmtDay(fromKey(d.date), { month: "short", day: "numeric" })}</text>
        </g>
      ))}
    </svg>
  );
}

function StrengthCheck({ onSave, onClose, last }) {
  const [phase, setPhase] = useState("intro");
  const [left, setLeft] = useState(30);
  const [count, setCount] = useState(last ? last.count : 8);
  useEffect(() => {
    if (phase !== "count3" && phase !== "go") return;
    const total = phase === "count3" ? 3 : 30, t0 = Date.now();
    setLeft(total);
    const id = setInterval(() => {
      const l = total - Math.floor((Date.now() - t0) / 1000);
      if (l <= 0) { clearInterval(id); if (phase === "count3") { Beep.tone(880, 0.25); Voice.say("Go"); setPhase("go"); } else { Beep.tone(988, 0.4); Voice.say("Stop. Sit down and rest."); setPhase("enter"); } }
      else { setLeft(l); if (l <= 3) Beep.tone(660, 0.1); }
    }, 250);
    return () => clearInterval(id);
  }, [phase]);
  useWakeLock(phase === "go" || phase === "count3");
  return (
    <div className="full stack">
      <div className="ob-top"><button className="icon-btn" onClick={onClose} aria-label="Close"><X /></button><span style={{ fontWeight: 800 }}>Strength check</span></div>
      {phase === "intro" && (<>
        <Figure move={MOVE["sit-to-stand"]} />
        <h1>The 30-second chair test</h1>
        <p className="muted" style={{ fontSize: "1.05rem" }}>Physiotherapists use this simple test to track leg strength. Do it once a month and watch the number climb.</p>
        <ol className="steps" style={{ fontSize: "1.05rem" }}>
          <li>Sit in the middle of a sturdy chair without arms, against a wall so it can't slide.</li>
          <li>Cross your arms over your chest, feet flat on the floor.</li>
          <li>When the timer starts, stand up fully and sit down again, as many times as you can in 30 seconds.</li>
        </ol>
        <p className="muted">Need your hands to stand? That's fine, use them, and do the same every time.</p>
        <div className="spacer" />
        <button className="btn btn-sun btn-big" onClick={() => { Beep.init(); Voice.prime(); setPhase("count3"); }}>Start the 30 seconds</button>
      </>)}
      {(phase === "count3" || phase === "go") && (<>
        <Figure move={MOVE["sit-to-stand"]} play={phase === "go"} />
        <div style={{ textAlign: "center" }}>
          <p className="eyebrow">{phase === "count3" ? "Get ready" : "Stand up, sit down"}</p>
          <div style={{ fontFamily: "var(--mono)", fontWeight: 700, fontSize: "5rem", lineHeight: 1.1 }}>{left}</div>
          <p className="muted">{phase === "go" ? "Count each time you stand up." : "Arms crossed, feet flat."}</p>
        </div>
      </>)}
      {phase === "enter" && (<>
        <h1>How many times did you stand up?</h1>
        <div className="counter">
          <button className="icon-btn" aria-label="One fewer" onClick={() => setCount(Math.max(0, count - 1))}><Minus size={28} /></button>
          <output aria-live="polite">{count}</output>
          <button className="icon-btn" aria-label="One more" onClick={() => setCount(Math.min(60, count + 1))}><PlusIcon size={28} /></button>
        </div>
        {last && <p className="muted" style={{ textAlign: "center" }}>Last time: {last.count}</p>}
        <div className="spacer" />
        <button className="btn btn-sun btn-big" onClick={() => onSave(count)}>Save</button>
      </>)}
    </div>
  );
}

function Progress({ st, onCheck }) {
  const h = st.history;
  const minutes = Math.round(h.reduce((s, x) => s + x.secs, 0) / 60);
  const info = weekInfo(h, st.profile.days);
  const weeks = Array.from({ length: 8 }, (_, i) => {
    const s = addDays(startOfWeek(new Date()), -7 * i);
    const e = addDays(s, 6), sk = dkey(s), ek = dkey(e);
    const days = new Set(h.filter((x) => x.date >= sk && x.date <= ek).map((x) => x.date)).size;
    return { s, e, days };
  });
  const lastCheck = st.checks[st.checks.length - 1];
  const sinceCheck = lastCheck ? daysBetween(lastCheck.date, dkey()) : null;
  return (
    <div className="wrap stack">
      <h1>Your progress</h1>
      <div className="tiles">
        <div className="tile"><b>{h.length}</b><span>{h.length === 1 ? "workout" : "workouts"}</span></div>
        <div className="tile"><b>{minutes}</b><span>minutes moved</span></div>
        <div className="tile"><b>{info.count}/{st.profile.days}</b><span>this week</span></div>
      </div>
      {h.length === 0 && <p className="muted">Your weeks will fill up here once you've done your first workout. Every dot is a day you moved.</p>}
      <div className="card">
        <div className="weeks">
          {weeks.map((w, i) => (
            <div key={i} className="wk">
              <span className="wk-label">{i === 0 ? "This week" : i === 1 ? "Last week" : fmtDay(w.s, { month: "short", day: "numeric" })}</span>
              <span className="wk-dots" aria-label={`${w.days} of ${st.profile.days}`}>
                {Array.from({ length: Math.max(st.profile.days, w.days) }, (_, k) => <i key={k} className={k < Math.min(w.days, st.profile.days) ? "on" : k < w.days ? "extra" : ""} />)}
              </span>
              {w.days >= st.profile.days && <span className="wk-goal">Goal</span>}
            </div>
          ))}
        </div>
      </div>

      {!st.profile.limits.includes("seated") && (
        <div className="card stack-s">
          <h3>Strength check</h3>
          {st.checks.length >= 2 && <ChairChart checks={st.checks} />}
          {st.checks.length === 1 && <p><b style={{ fontSize: "1.6rem", fontFamily: "var(--display)" }}>{lastCheck.count}</b> <span className="muted">stands in 30 seconds on {fmtDay(fromKey(lastCheck.date), { month: "long", day: "numeric" })}</span></p>}
          {st.checks.length >= 2 && (() => { const d = lastCheck.count - st.checks[st.checks.length - 2].count;
            return <p style={{ fontWeight: 700 }}>{d > 0 ? `Up ${d} since last time. That's real strength.` : d === 0 ? "Holding steady since last time." : "A little down this time. Sleep, mood and the chair all play a part."}</p>; })()}
          <p className="muted">{st.checks.length === 0 ? "A 30-second test that shows how your leg strength changes over the months." : sinceCheck >= 28 ? "It's been a month. Time for another check." : `Next check in about ${28 - sinceCheck} days.`}</p>
          <button className={"btn " + (st.checks.length === 0 || sinceCheck >= 28 ? "btn-pine" : "btn-line")} onClick={onCheck}>Do a strength check</button>
        </div>
      )}

      <div className="stack-s">
        <h3>Milestones</h3>
        <div className="badges">
          {MILESTONES.map((n) => <div key={n} className={"badge" + (h.length >= n ? " got" : "")}><b>{n}</b>{n === 1 ? "first workout" : "workouts"}</div>)}
        </div>
      </div>
    </div>
  );
}

/* ----------------------------------------------------------------------------
   YOU: profile, reminders and settings
---------------------------------------------------------------------------- */
function calendarLink(p, days, time) {
  const [hh, mm] = time.split(":").map(Number);
  let start = new Date(); start.setHours(hh, mm, 0, 0);
  for (let k = 0; k < 8 && (!days.includes(start.getDay()) || start < new Date()); k++) start = addDays(start, 1);
  const end = new Date(start.getTime() + p.minutes * 60000);
  const f = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const by = days.slice().sort().map((d) => ["SU", "MO", "TU", "WE", "TH", "FR", "SA"][d]).join(",");
  let tz = ""; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
  const q = new URLSearchParams({ action: "TEMPLATE", text: `Steady workout (${p.minutes} min)`, details: "Open Steady and press Start. Even two minutes counts.",
    dates: `${f(start)}/${f(end)}`, recur: `RRULE:FREQ=WEEKLY;BYDAY=${by}`, ...(tz ? { ctz: tz } : {}) });
  return "https://calendar.google.com/calendar/render?" + q.toString();
}

function Reminder({ st, setSetting }) {
  const p = st.profile;
  const days = st.settings.remindDays || DEFAULT_DAYS[p.days] || DEFAULT_DAYS[3];
  const time = st.settings.remindTime || WHEN_TIME[p.when] || "08:00";
  const toggle = (d) => { const s = new Set(days); s.has(d) ? s.delete(d) : s.add(d); if (s.size) setSetting("remindDays", [...s].sort()); };
  const order = SUN_FIRST ? [0, 1, 2, 3, 4, 5, 6] : [1, 2, 3, 4, 5, 6, 0];
  const t = new Date(); const [hh, mm] = time.split(":").map(Number); t.setHours(hh, mm);
  const timeText = t.toLocaleTimeString(LANG, { hour: "numeric", minute: "2-digit" });
  const dayText = days.length === 7 ? "every day" : order.filter((d) => days.includes(d)).map((d) => DAY_SHORT[d]).join(", ");
  return (
    <div className="card stack-s">
      <h3>Set a reminder</h3>
      <p className="muted">People who plan a time are far more likely to show up. Pick your days and time.</p>
      <div className="days-pick">{order.map((d) => <button key={d} aria-pressed={days.includes(d)} aria-label={DAY_SHORT[d]} onClick={() => toggle(d)}>{DAY_ABBR[d]}</button>)}</div>
      <div className="row"><label htmlFor="rem-time" style={{ fontWeight: 700 }}>Time</label><input id="rem-time" type="time" className="time-in" value={time} onChange={(e) => e.target.value && setSetting("remindTime", e.target.value)} /></div>
      <a className="btn btn-pine" href={calendarLink(p, days, time)} target="_blank" rel="noopener">Add to Google Calendar</a>
      <p className="muted" style={{ fontSize: "0.95rem" }}>Or set a repeating alarm in your phone's Clock app for <b>{timeText}</b>, {dayText}.</p>
    </div>
  );
}

function Toggle({ on, onChange, label, sub }) {
  return (
    <button className="li" role="switch" aria-checked={on} onClick={() => onChange(!on)}>
      <span style={{ flex: 1 }}><b style={{ display: "block" }}>{label}</b>{sub && <span className="muted" style={{ fontSize: "0.9rem" }}>{sub}</span>}</span>
      <span className={"switch" + (on ? " on" : "")} />
    </button>
  );
}

function EditQuestion({ q, profile, onSave, onCancel }) {
  const [v, setV] = useState(profile[q]);
  const Q = QUESTIONS[q];
  return (
    <div className="full stack">
      <div className="ob-top"><button className="icon-btn" onClick={onCancel} aria-label="Back"><Back /></button></div>
      <div className="stack-s"><h1>{Q.title}</h1>{Q.sub && <p className="muted">{Q.sub}</p>}</div>
      <Question q={q} value={v} onChange={setV} onNext={() => {}} />
      <div className="spacer" />
      <button className="btn btn-sun btn-big" onClick={() => onSave(v)}>Save</button>
    </div>
  );
}

function You({ st, onEdit, setSetting, onReset, onSafety }) {
  const p = st.profile;
  const [confirmReset, setConfirmReset] = useState(false);
  const rows = [
    ["name", "Name", p.name || "Not set"], ["age", "Age", optLabel("age", p.age)], ["goal", "Main goal", optLabel("goal", p.goal)],
    ["active", "Activity", optLabel("active", p.active)], ["life", "Your day", optLabel("life", p.life)],
    ["limits", "Go easy on", fmtLimits(p.limits)], ["kit", "Equipment", fmtKit(p.kit)],
    ["minutes", "Workout length", `${p.minutes} minutes`], ["days", "Days a week", p.days === 7 ? "Every day" : String(p.days)],
    ["when", "When", optLabel("when", p.when)],
  ];
  return (
    <div className="wrap stack">
      <h1>{p.name || "You"}</h1>
      <div className="stack-s">
        <span className="eyebrow">Your plan</span>
        <div className="list">
          {rows.map(([q, k, v]) => (
            <button key={q} className="li" onClick={() => onEdit(q)}>
              <span className="k">{k}</span><span className="v">{v}</span><Chevron size={20} style={{ flex: "none", color: "var(--ink-2)" }} />
            </button>
          ))}
        </div>
      </div>
      <Reminder st={st} setSetting={setSetting} />
      <div className="stack-s">
        <span className="eyebrow">Settings</span>
        <div className="list">
          <Toggle on={st.settings.big} onChange={(v) => setSetting("big", v)} label="Bigger text" sub="Easier to read at arm's length" />
          <Toggle on={st.settings.voice} onChange={(v) => setSetting("voice", v)} label="Voice coach" sub="Reads out each move so you can look away" />
          <Toggle on={st.settings.beeps} onChange={(v) => setSetting("beeps", v)} label="Countdown beeps" />
        </div>
      </div>
      <div className="list">
        <button className="li" onClick={onSafety}><span style={{ flex: 1, fontWeight: 700 }}>Safety tips</span><Chevron size={20} /></button>
        <button className="li" onClick={() => setConfirmReset(true)}><span style={{ flex: 1, fontWeight: 700, color: "var(--warn)" }}>Start over</span></button>
      </div>
      <p className="muted" style={{ fontSize: "0.9rem" }}>Steady keeps everything on this device. There's no account and nothing is sent anywhere.</p>
      {confirmReset && (
        <div className="overlay" role="dialog" aria-modal="true" aria-labelledby="reset-t">
          <div className="dialog">
            <h2 id="reset-t">Start over?</h2>
            <p className="muted">This clears your plan, your workouts and your strength checks from this device. It can't be undone.</p>
            <button className="btn btn-line" style={{ color: "var(--warn)" }} onClick={onReset}>Yes, clear everything</button>
            <button className="btn btn-sun" onClick={() => setConfirmReset(false)}>Keep my data</button>
          </div>
        </div>
      )}
    </div>
  );
}

function Safety({ onClose }) {
  return (
    <div className="full stack">
      <div className="ob-top"><button className="icon-btn" onClick={onClose} aria-label="Back"><Back /></button></div>
      <h1>Safety tips</h1>
      <ul className="safety" style={{ paddingLeft: "1.3rem", margin: 0, fontSize: "1.05rem" }}>{SAFETY.map((s, i) => <li key={i}>{s}</li>)}</ul>
      <p className="muted">Steady offers general fitness guidance and isn't a substitute for advice from your doctor or physiotherapist.</p>
    </div>
  );
}

/* ----------------------------------------------------------------------------
   APP
---------------------------------------------------------------------------- */
function App() {
  const [st, setSt] = useState(loadState);
  const [tab, setTab] = useState("today");
  const [screen, setScreen] = useState(null); // { kind: 'play' | 'finish' | 'edit' | 'check' | 'safety', ... }
  const [toast, setToast] = useState(null);
  const update = (f) => setSt((s) => { const n = typeof f === "function" ? f(s) : { ...s, ...f }; saveState(n); return n; });
  const setSetting = (k, v) => update((s) => ({ ...s, settings: { ...s.settings, [k]: v } }));
  const say = (t) => { setToast(t); setTimeout(() => setToast((x) => (x === t ? null : x)), 3200); };

  useEffect(() => { document.documentElement.classList.toggle("big", !!st.settings.big); }, [st.settings.big]);
  Voice.on = st.settings.voice; Beep.on = st.settings.beeps;
  useEffect(() => { window.scrollTo(0, 0); }, [tab, screen && screen.kind, st.onboarded]);

  const today = dkey();
  const mode = st.today.date === today ? st.today.mode : "normal";
  const n = st.today.date === today ? st.today.n : 0;
  const session = useMemo(() => buildSession(st, mode, n), [st.profile, st.level, st.hard, mode, n, today]);
  const setToday = (m, reroll) => update((s) => ({ ...s, today: { date: today, mode: m, n: (s.today.date === today ? s.today.n : 0) + (reroll ? 1 : 0) } }));

  const start = (kind) => {
    Beep.init(); Voice.prime();
    const sess = kind === "mini" ? buildSession(st, "mini", n) : kind === "bonus" ? buildSession(st, "short", n + 7) : session;
    setScreen({ kind: "play", session: sess });
  };
  const onDone = (res) => {
    if (res.secs < 45) { setScreen(null); say("That went by fast, so we didn't count it."); return; }
    const entry = { date: dkey(), at: Date.now(), secs: res.secs, moves: res.moves, mode: screen.session.mode, complete: res.complete, feel: null };
    update((s) => ({ ...s, history: [...s.history, entry] }));
    setScreen({ kind: "finish", result: res });
  };
  const onFeel = (feel) => {
    update((s) => {
      const h = s.history.slice();
      if (h.length) h[h.length - 1] = { ...h[h.length - 1], feel };
      let { level, rightRun, offerUp } = s;
      if (feel === "easy") { level = Math.min(4.4, level + 0.5); rightRun = 0; }
      if (feel === "hard") { level = Math.max(1, level - 0.5); rightRun = 0; offerUp = false; }
      if (feel === "right") { rightRun += 1; if (rightRun >= 4 && level < 4) offerUp = true; }
      return { ...s, history: h, level, rightRun, offerUp };
    });
    if (feel === "easy") say("Got it. Next time will be a bit harder.");
    if (feel === "hard") say("Thanks. We'll ease off next time.");
    setScreen(null); setTab("today");
  };
  const onLevelOffer = (yes) => {
    update((s) => ({ ...s, level: yes ? Math.min(4.4, s.level + 0.5) : s.level, rightRun: 0, offerUp: false }));
    if (yes) say("Done. Tomorrow's workout steps up a notch.");
  };

  if (!st.onboarded) {
    const blank = { ...DEFAULT.profile, goal: null, active: null, life: null, minutes: null, days: null, when: null };
    return <Onboarding initial={blank} onDone={(answers, go, quick) => {
      const p = quick ? DEFAULT.profile : Object.fromEntries(Object.entries(answers).map(([k, v]) => [k, v == null ? DEFAULT.profile[k] : v]));
      const big = p.age === "60s" || p.age === "75p";
      const next = { ...st, onboarded: true, profile: p, level: startLevel(p), settings: { ...st.settings, big: quick ? st.settings.big : big } };
      update(next);
      if (go) { Beep.init(); Voice.prime(); setScreen({ kind: "play", session: buildSession(next) }); }
    }} />;
  }
  if (screen && screen.kind === "play") {
    return <Player session={screen.session} ctx={ctxFor(st)} settings={st.settings} setSetting={setSetting}
      onQuit={() => setScreen(null)} onDone={onDone}
      onEasier={(id) => update((s) => ({ ...s, hard: { ...s.hard, [id]: (s.hard[id] || 0) + 1 } }))} />;
  }
  if (screen && screen.kind === "finish") return <Finish result={screen.result} st={st} onFeel={onFeel} />;
  if (screen && screen.kind === "edit") {
    return <EditQuestion q={screen.q} profile={st.profile} onCancel={() => setScreen(null)} onSave={(v) => {
      update((s) => { const p = { ...s.profile, [screen.q]: v };
        return { ...s, profile: p, level: ["age", "active"].includes(screen.q) || (screen.q === "limits" && v.includes("seated")) ? startLevel(p) : s.level }; });
      setScreen(null); say("Saved. Today's workout has been updated.");
    }} />;
  }
  if (screen && screen.kind === "check") {
    return <StrengthCheck last={st.checks[st.checks.length - 1]} onClose={() => setScreen(null)} onSave={(count) => {
      update((s) => ({ ...s, checks: [...s.checks, { date: dkey(), count }] })); setScreen(null); setTab("progress"); say("Saved your strength check.");
    }} />;
  }
  if (screen && screen.kind === "safety") return <Safety onClose={() => setScreen(null)} />;

  return (
    <>
      {tab === "today" && <Today st={st} session={session} onStart={start} setToday={setToday} onLevelOffer={onLevelOffer} />}
      {tab === "progress" && <Progress st={st} onCheck={() => setScreen({ kind: "check" })} />}
      {tab === "you" && <You st={st} onEdit={(q) => setScreen({ kind: "edit", q })} setSetting={setSetting} onSafety={() => setScreen({ kind: "safety" })}
        onReset={() => { update({ ...DEFAULT, settings: { ...DEFAULT.settings } }); setTab("today"); }} />}
      <nav className="tabs" aria-label="Main">
        <div className="tabs-in">
          {[["today", "Today", SunIcon], ["progress", "Progress", ChartIcon], ["you", "You", UserIcon]].map(([k, label, Icon]) => (
            <button key={k} className="tab" aria-current={tab === k ? "page" : undefined} onClick={() => setTab(k)}><Icon size={26} />{label}</button>
          ))}
        </div>
      </nav>
      {toast && <div className="toast" role="status">{toast}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
