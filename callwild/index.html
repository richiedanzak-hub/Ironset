<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Call Wild"/>
<meta name="theme-color" content="#0E100D"/>
<meta name="description" content="Learn duck, goose, turkey, elk, deer and predator calls. Record yourself and get scored, with tips."/>
<title>Call of the Wild</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap"/>
<style>
  /* Call of the Wild — field theme.
     Built like the gear: dark, low-glare surfaces for a blind before first
     light; blaze orange only for the one thing to do next; olive drab for the
     rest; a topo sheet underneath. Square-shouldered cards with hairline
     edges, condensed uppercase labels, numbers set like instrument readouts.
     "Daylight" is the same system, light, for reading in the sun. */
  :root {
    --bg: #0E100D;
    --surface: #161914;
    --surface-2: #1C2019;
    --tint: #252A21;
    --line: #2A2F26;
    --line-2: #3B4236;
    --ink: #EDEFE7;
    --ink-2: #A6AD9D;
    --ink-3: #808878;
    --olive: #56643A;
    --olive-ink: #B8C48E;
    --on-olive: #F4F6EC;
    --blaze: #F26A1B;
    --blaze-ink: #FF8B4A;
    --on-blaze: #160A02;
    --data: #4FB0EC;
    --data-soft: rgba(79, 176, 236, 0.18);
    --ghost: #3B4236;
    --good: #79B65A; --warn: #E3B23C; --bad: #E2533F;
    --good-ink: #8FD06D; --warn-ink: #F1C35A; --bad-ink: #FF8873;
    --topo: rgba(214, 226, 196, 0.085);
    --spec-stops: #0E100D 0, #23123B .3, #7A1C55 .52, #D6452B .72, #F4A532 .87, #FFF2C8 1;
    --shade: rgba(0, 0, 0, 0.62);
    --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  :root[data-theme="day"] {
    --bg: #E9E7DE; --surface: #F8F7F2; --surface-2: #F0EEE6; --tint: #E0DDD1; --line: #D2CEC0; --line-2: #B9B4A2;
    --ink: #151912; --ink-2: #4A5142; --ink-3: #676E5F; --olive: #4C5A2B; --olive-ink: #44522A; --on-olive: #FFFFFF;
    --blaze: #E85A0E; --blaze-ink: #B5440A; --on-blaze: #160A02; --data: #1F6FC4; --data-soft: rgba(31, 111, 196, 0.14);
    --ghost: #CBC6B6; --good-ink: #2E6E1E; --warn-ink: #855600; --bad-ink: #AE2A1E;
    --topo: rgba(58, 70, 38, 0.11); --spec-stops: #F8F7F2 0, #CDD1BA .3, #7F8C56 .56, #3D4825 .8, #151912 1;
    --shade: rgba(20, 24, 14, 0.45); color-scheme: light;
  }
  @media (prefers-color-scheme: light) {
    :root[data-theme="phone"] {
      --bg: #E9E7DE; --surface: #F8F7F2; --surface-2: #F0EEE6; --tint: #E0DDD1; --line: #D2CEC0; --line-2: #B9B4A2;
      --ink: #151912; --ink-2: #4A5142; --ink-3: #676E5F; --olive: #4C5A2B; --olive-ink: #44522A; --on-olive: #FFFFFF;
      --blaze: #E85A0E; --blaze-ink: #B5440A; --on-blaze: #160A02; --data: #1F6FC4; --data-soft: rgba(31, 111, 196, 0.14);
      --ghost: #CBC6B6; --good-ink: #2E6E1E; --warn-ink: #855600; --bad-ink: #AE2A1E;
      --topo: rgba(58, 70, 38, 0.11); --spec-stops: #F8F7F2 0, #CDD1BA .3, #7F8C56 .56, #3D4825 .8, #151912 1;
      --shade: rgba(20, 24, 14, 0.45); color-scheme: light;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16.5px; -webkit-text-size-adjust: 100%; background: var(--bg); }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.45; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--blaze); outline-offset: 2px; border-radius: 3px; }
  .boot { min-height: 80vh; display: grid; place-items: center; color: var(--ink-2); font-family: var(--display); letter-spacing: .1em; text-transform: uppercase; }

  /* Type */
  h1, h2, h3 { margin: 0; font-family: var(--display); line-height: 1; text-transform: uppercase; text-wrap: balance; }
  h1 { font-size: 2.45rem; font-weight: 800; letter-spacing: 0.015em; }
  h2 { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.04em; }
  h3 { font-size: 1.12rem; font-weight: 700; letter-spacing: 0.05em; }
  p { margin: 0; }
  .muted { color: var(--ink-2); }
  .small { font-size: 0.88rem; }
  .lead { font-size: 1.08rem; color: var(--ink); }
  .eyebrow { font-family: var(--display); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-3); }
  .eyebrow.hot { color: var(--blaze-ink); }
  .num { font-family: var(--display); font-variant-numeric: tabular-nums; }
  .stack { display: flex; flex-direction: column; gap: 1rem; }
  .stack-s { display: flex; flex-direction: column; gap: 0.55rem; }
  .row { display: flex; align-items: center; gap: 0.7rem; }
  .row-top { display: flex; align-items: flex-start; gap: 0.7rem; }
  .between { justify-content: space-between; }
  .grow { flex: 1; min-width: 0; }
  .wrap { max-width: 34rem; margin: 0 auto; padding: 1rem 14px 7.5rem; }

  /* Section heads: a label, a hairline, and a count */
  .sec-head { display: flex; align-items: center; gap: 0.6rem; }
  .sec-head h2 { font-size: 1.05rem; letter-spacing: 0.12em; color: var(--ink-2); }
  .sec-head::after { content: ""; flex: 1; height: 1px; background: var(--line); order: 2; }
  .sec-head .eyebrow { order: 3; }

  /* Top bar */
  .topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
  .topbar-in { max-width: 34rem; margin: 0 auto; height: 3.3rem; display: flex; align-items: center; gap: 0.5rem; padding: 0 10px 0 6px; }
  .tb-back { display: inline-flex; align-items: center; justify-content: center; width: 2.6rem; height: 2.6rem; flex: none; background: none; border: 0; color: var(--ink); border-radius: 4px; }
  .tb-title { flex: 1; min-width: 0; font-family: var(--display); font-weight: 700; font-size: 1.1rem; letter-spacing: 0.08em; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand { flex: 1; min-width: 0; display: flex; align-items: center; gap: 0.55rem; padding-left: 6px; color: var(--ink); text-decoration: none; }
  .wordmark { font-family: var(--display); font-weight: 800; font-size: 1.28rem; letter-spacing: 0.07em; text-transform: uppercase; line-height: 1; white-space: nowrap; }
  .wordmark small { font-size: 0.72em; letter-spacing: 0.1em; color: var(--ink-2); margin: 0 0.1em; }
  .tb-score { display: inline-flex; align-items: center; gap: 0.45rem; background: none; border: 1px solid var(--line-2); border-radius: 4px; padding: 0.2rem 0.55rem 0.2rem 0.45rem; color: var(--ink); }
  .tb-score b { font-family: var(--display); font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tb-score span { font-family: var(--display); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }

  /* Topo sheet behind a block */
  .topo { position: relative; isolation: isolate; overflow: hidden; }
  .topo::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: var(--topo);
    -webkit-mask: url(img/topo.svg) 0 0 / 560px repeat; mask: url(img/topo.svg) 0 0 / 560px repeat; }

  /* Buttons */
  .btn { display: flex; align-items: center; justify-content: center; gap: 0.55rem; width: 100%; min-height: 3.4rem; border: 0; border-radius: 5px; padding: 0.7rem 1.1rem;
    font-family: var(--display); font-weight: 800; font-size: 1.2rem; letter-spacing: 0.07em; text-transform: uppercase; text-decoration: none; }
  .btn svg { flex: none; }
  .btn-blaze { background: var(--blaze); color: var(--on-blaze); }
  .btn-olive { background: var(--olive); color: var(--on-olive); }
  .btn-tint { background: var(--tint); color: var(--ink); }
  .btn-line { background: transparent; color: var(--ink); border: 1px solid var(--line-2); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-small { min-height: 2.6rem; font-size: 1rem; width: auto; padding: 0.4rem 0.9rem; }
  .icon-btn { width: 2.75rem; height: 2.75rem; flex: none; display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: 5px; background: none; color: var(--ink); }
  .link { background: none; border: 0; padding: 0.3rem 0; color: var(--blaze-ink); font-family: var(--display); font-weight: 700; font-size: 1rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .back { display: inline-flex; align-items: center; gap: 0.25rem; background: none; border: 0; padding: 0.4rem 0.2rem 0.4rem 0; color: var(--ink-2); font-weight: 600; }

  /* Cards and lists */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 1rem; }
  .card-tight { padding: 0.75rem 0.9rem; }
  .divide > * + * { border-top: 1px solid var(--line); }
  .list { padding: 0 0.85rem; }

  /* Chips and readouts */
  .chip { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.2rem 0.5rem 0.16rem; border-radius: 3px; font-family: var(--display); font-size: 0.8rem; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; background: var(--tint); color: var(--ink-2); white-space: nowrap; line-height: 1.2; }
  .chip-hot { background: color-mix(in srgb, var(--blaze) 16%, transparent); color: var(--blaze-ink); }
  .chip-olive { background: color-mix(in srgb, var(--olive) 34%, transparent); color: var(--olive-ink); }
  .score-pill { min-width: 2.7rem; text-align: center; padding: 0.15rem 0.45rem; border-radius: 3px; font-family: var(--display); font-size: 1.1rem; font-weight: 700;
    font-variant-numeric: tabular-nums; background: var(--tint); color: var(--ink); line-height: 1.3; }
  .pips { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
  .pips i { width: 4px; background: var(--line-2); border-radius: 1px; }
  .pips i.on { background: var(--blaze); }
  .lvl { display: inline-flex; align-items: center; gap: 0.45rem; font-family: var(--display); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.45rem; }
  .stat { border: 1px solid var(--line-2); border-radius: 4px; padding: 0.42rem 0.55rem; background: color-mix(in srgb, var(--bg) 45%, transparent); min-width: 0; }
  .stat .v { display: block; font-family: var(--display); font-weight: 700; font-size: 1.3rem; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat .l { display: block; font-family: var(--display); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Dashboard */
  .hero { padding: 1rem 1rem 0.9rem; background: linear-gradient(160deg, color-mix(in srgb, var(--olive) 30%, var(--surface)) 0%, var(--surface) 62%); border-color: var(--line-2); }
  .big { font-family: var(--display); font-size: 4.4rem; font-weight: 600; line-height: 0.82; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .big-of { font-family: var(--display); font-size: 1.15rem; font-weight: 600; color: var(--ink-3); margin-left: 0.15rem; }
  .rank { font-family: var(--display); font-size: 1.5rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; }
  .tools { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.4rem; }
  .tool { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; padding: 0.55rem 0.1rem 0.45rem; background: var(--surface); border: 1px solid var(--line); border-radius: 5px; color: var(--olive-ink); }
  .tool span { font-family: var(--display); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
  .banner { display: flex; align-items: center; gap: 0.8rem; width: 100%; text-align: left; padding: 0.7rem 0.8rem; border-radius: 6px; border: 1px solid var(--line-2);
    background: linear-gradient(90deg, color-mix(in srgb, var(--blaze) 12%, var(--surface)) 0%, var(--surface) 70%); color: var(--ink); }
  .banner .ic { width: 2.9rem; height: 2.9rem; flex: none; display: grid; place-items: center; border-radius: 4px; background: color-mix(in srgb, var(--blaze) 14%, transparent); color: var(--blaze-ink); }
  .banner b { display: block; font-family: var(--display); font-size: 1.32rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; line-height: 1.05; }
  .banner.plain { background: var(--surface); }
  .banner.plain .ic { background: var(--tint); color: var(--olive-ink); }

  /* Animal rows (home) and call rows (an animal's page) */
  .tile { display: flex; align-items: center; gap: 0.8rem; width: 100%; text-align: left; background: none; border: 0; padding: 0.7rem 0; color: var(--ink); }
  .tile .badge { width: 3rem; height: 3rem; flex: none; border-radius: 4px; display: grid; place-items: center; background: var(--tint); color: var(--olive-ink); }
  .tile b { display: block; font-family: var(--display); font-size: 1.22rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.1; }
  .tile .sub { display: block; font-size: 0.86rem; color: var(--ink-2); line-height: 1.3; margin-top: 0.1rem; }
  .call-row { display: flex; align-items: center; gap: 0.8rem; width: 100%; text-align: left; background: none; border: 0; padding: 0.8rem 0; color: var(--ink); }
  .call-row .nm { font-family: var(--display); font-size: 1.22rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.1; }
  .chev { color: var(--ink-3); flex: none; }

  /* Lesson */
  .lesson-head { padding: 1.1rem 1rem 1rem; margin: -1rem -14px 0; border-bottom: 1px solid var(--line); }
  .kv { display: grid; grid-template-columns: 1.4rem 1fr; gap: 0.5rem; align-items: start; }
  .kv svg { margin-top: 0.15rem; color: var(--olive-ink); }
  ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; }
  ol.steps li { counter-increment: s; display: grid; grid-template-columns: 2.4rem 1fr; gap: 0.5rem; align-items: baseline; padding: 0.6rem 0; border-top: 1px solid var(--line); }
  ol.steps li:first-child { border-top: 0; padding-top: 0.2rem; }
  ol.steps li::before { content: counter(s, decimal-leading-zero); font-family: var(--display); font-weight: 800; font-size: 1.3rem; letter-spacing: 0.02em; color: var(--blaze-ink); font-variant-numeric: tabular-nums; }
  ul.dots { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 0.4rem; }
  ul.miss { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.55rem; }
  ul.miss li { display: grid; grid-template-columns: 1.4rem 1fr; gap: 0.45rem; align-items: start; }
  ul.miss svg { color: var(--bad-ink); margin-top: 0.15rem; }
  .say { font-family: var(--display); font-weight: 800; font-size: 1.15rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--blaze-ink); }
  .note-box { border-left: 3px solid var(--olive); padding: 0.15rem 0 0.15rem 0.8rem; }
  .note-box.hot { border-left-color: var(--blaze); }
  .drill { border-left: 3px solid var(--blaze); background: var(--surface-2); }
  .sticky-cta { position: fixed; left: 0; right: 0; bottom: calc(3.75rem + env(safe-area-inset-bottom, 0px)); padding: 0.6rem 14px 0.55rem; z-index: 5;
    background: linear-gradient(to top, var(--bg) 72%, transparent); }
  .sticky-cta > div { max-width: 34rem; margin: 0 auto; }

  /* Players */
  .play { display: flex; align-items: center; gap: 0.75rem; width: 100%; text-align: left; background: none; border: 0; padding: 0.3rem 0; color: var(--ink); }
  .play .disc { width: 2.7rem; height: 2.7rem; border-radius: 4px; display: grid; place-items: center; flex: none; background: var(--blaze); color: var(--on-blaze); }
  .play.ghosty .disc { background: var(--tint); color: var(--ink); }
  .play b { font-weight: 600; }

  /* Charts */
  .chart { position: relative; }
  .chart svg, .chart canvas { display: block; width: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 0.9rem; font-size: 0.82rem; color: var(--ink-2); font-family: var(--display); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .legend i { display: inline-block; vertical-align: middle; margin-right: 0.35rem; border-radius: 2px; }
  .readout { min-height: 1.3rem; font-size: 0.85rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  table.notes { width: 100%; border-collapse: collapse; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  table.notes th, table.notes td { text-align: left; padding: 0.35rem 0.3rem; border-bottom: 1px solid var(--line); }
  table.notes th { color: var(--ink-3); font-family: var(--display); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.78rem; }
  details > summary { cursor: pointer; color: var(--ink-2); font-family: var(--display); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.85rem; }

  /* Score */
  .hero-num { font-family: var(--display); font-size: 5rem; font-weight: 600; line-height: 0.8; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .hero-of { font-family: var(--display); font-size: 1.15rem; color: var(--ink-3); font-weight: 600; }
  .verdict { font-family: var(--display); font-size: 1.6rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; }
  .meter { position: relative; height: 6px; border-radius: 1px; background: var(--tint); overflow: hidden; }
  .meter > i { display: block; height: 100%; }
  .meter-s { height: 4px; }
  .meter-seg { height: 10px; }
  .meter-seg::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(to right, transparent 0 calc(10% - 3px), var(--surface) calc(10% - 3px) 10%); }
  .part { display: grid; grid-template-columns: 1.4rem 1fr; gap: 0.3rem 0.55rem; align-items: center; padding: 0.6rem 0; }
  .part .lab { display: flex; justify-content: space-between; align-items: baseline; gap: 0.6rem; font-size: 0.95rem; }
  .part .lab b { font-family: var(--display); font-weight: 700; font-size: 1.05rem; letter-spacing: 0.05em; text-transform: uppercase; }
  .part .val { color: var(--ink-2); font-size: 0.86rem; text-align: right; font-variant-numeric: tabular-nums; }
  .part .meter { grid-column: 2; }
  .st-good { color: var(--good-ink); } .st-warn { color: var(--warn-ink); } .st-bad { color: var(--bad-ink); }
  .tip { display: grid; grid-template-columns: 2.4rem 1fr; gap: 0.5rem; align-items: start; padding: 0.75rem 0.85rem; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--blaze); border-radius: 4px; }
  .tip .n { font-family: var(--display); font-weight: 800; font-size: 1.5rem; line-height: 1; color: var(--blaze-ink); font-variant-numeric: tabular-nums; }
  .good-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .good-chips .chip { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good-ink); }

  /* Tab bar */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--surface) 94%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tabs nav { max-width: 34rem; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
  .tabs button { position: relative; background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 0.12rem; padding: 0.55rem 0 0.5rem;
    font-family: var(--display); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
  .tabs button[aria-current="page"] { color: var(--blaze-ink); }
  .tabs button[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 30%; right: 30%; height: 2px; background: var(--blaze); }

  /* Recorder */
  .sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; overflow-y: auto; isolation: isolate; }

/* Your notes against the target. Time runs left to right from each one's

        <text x=${x(tk)} y=${H - 7} fontSize="11" fill="var(--ink-3)" textAnchor=${tk === 0 ? "start" : "middle"}>${tk === 0 ? "0" : (tk % 1 ? tk.toFixed(1) : tk) + " s"}</text></g>`; })}

        var lv = q.lev === null || q.lev === undefined ? 0 : q.lev;
        return html`<rect key=${"h" + i} x=${x(q.t) - 4} y=${y(lv) - 14} width=${Math.max(14, x(q.t + q.d) - x(q.t)) + 8} height="28" fill="transparent"

function ClipPlayer(p) {
  var meta = DATA.sounds[p.clip], playing = usePlaying(), id = "clip:" + p.clip, on = playing === id;
  var st = useState(null), clip = st[0];
  useEffect(function () { var live = true; loadClip(p.clip).then(function (c) { if (live) st[1](c); }).catch(function () {}); return function () { live = false; }; }, [p.clip]);
  return html`<div className="stack-s">

  </div>`;
}

/* Where the real animal's call sits, in Hz, when it holds a clear pitch —
   measured from its recording (the call's "level" target). */
function realPitch(call) {
  var row = (call.spec.score || []).filter(function (r) { return r[0] === "level"; })[0];
  return row && row[2] && row[2].f0 ? row[2].f0 : 0;
}

function GuidePlayer(p) {
  var playing = usePlaying(), id = "guide:" + p.call.id, on = playing === id;
  // at the real call's own pitch where it has one, so the guide sits where you
  // should. That pitch is the call's typical note; the guide's notes are laid
  // out from its first, so step back from the middle note to the first.
  var real = realPitch(p.call), g = (p.call.ghost || []).map(function (q) { return q.s || 0; }).sort(function (a, b) { return a - b; });
  var mid = g.length ? g[(g.length - 1) >> 1] : 0;
  var base = real ? real / Math.pow(2, mid / 12) : (p.call.tone || SPECIES[p.call.species].tone || 600);
  return html`<button className="play ghosty" onClick=${function () { if (on) Player.stop(); else Player.pattern(id, p.call.ghost, base); }} aria-pressed=${on}>
    <span className="disc"><${Icon} name=${on ? "stop" : "play"} size="18"/></span>
    <span className="grow"><b>Rhythm guide</b><br/><span className="small muted">The timing and pitch shape to aim for — played as tones, not an animal.</span></span>
  </button>`;
}

/* "the honk" for a call of the lesson's own animal, "Canada geese: the honk"
   for another's, so a goose cluck is never mistaken for a turkey's */
function otherName(lesson, id) {
  var o = DATA.calls[id];
  if (!o) return "another call";
  return (o.species === lesson.species ? "the " : SPECIES[o.species].name + ": the ") + o.name.toLowerCase();
}

/* Did the caller blow a different call than the lesson's? Checked only when
   the lesson's own score is low, against every call in the same group (a goose
   honk blown in a duck lesson should be named as a goose honk) — but never a
   cousin: calls whose real recordings the scorer itself cannot tell apart
   (a mallard hen's greeting and a black duck hen's call). And only on a clear
   margin, so the app never guesses out loud. */
function likeOther(call, got, res) {
  if (!res.ok || res.score >= 60) return;
  var group = SPECIES[call.species].group, near = call.near || [], best = null;
  Object.keys(DATA.calls).forEach(function (id) {
    var c = DATA.calls[id];
    if (id === call.id || !listed(c) || SPECIES[c.species].group !== group || near.indexOf(id) >= 0) return;
    var r2;
    try { r2 = CA.analyze(got.samples, got.rate, c.spec); } catch (e) { return; }
    if (r2.ok && (!best || r2.score > best.score)) best = { id: id, score: r2.score };
  });
  if (best && best.score >= 85 && best.score >= res.score + 25)
    res.likeOther = { id: best.id, name: DATA.calls[best.id].name, score: best.score };
}

function isShaped(call) {
  return (call.spec.score || []).some(function (r) { return ["breakUp", "breakDown", "riseFall", "waver"].indexOf(r[0]) >= 0; });
}

/* ------------------------------------------------------------------ */
/* Recorder                                                             */
/* ------------------------------------------------------------------ */
function Recorder(p) {
  var call = p.call, maxSec = call.spec.maxSec || 10;
  var ph = useState("ready"), phase = ph[0], setPhase = ph[1];
  var er = useState(null), el = useState(0);
  var cap = useRef(null), timer = useRef(0), canvas = useRef(null), levels = useRef([]), t0 = useRef(0);
  var wr = useWidth(), wref = wr[0], W = wr[1] || 320;

  function draw() {
    var c = canvas.current; if (!c) return;
    var dpr = Math.min(2, window.devicePixelRatio || 1), Hh = 80;
    if (c.width !== Math.round(W * dpr)) { c.width = Math.round(W * dpr); c.height = Hh * dpr; c.style.width = W + "px"; c.style.height = Hh + "px"; }
    var g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, Hh);
    var bars = Math.floor(W / 5), lv = levels.current.slice(-bars), col = css("--blaze") || "#C2410C";
    g.fillStyle = col;
    for (var i = 0; i < lv.length; i++) {
      var v = Math.max(0, Math.min(1, (lv[i] + 60) / 60)), bh = Math.max(2, v * (Hh - 4));
      g.globalAlpha = 0.35 + 0.65 * v;
      g.fillRect(W - (lv.length - i) * 5, (Hh - bh) / 2, 3, bh);
    }
    g.globalAlpha = 1;
  }
  function start() {
    Sound.unlock(); Player.stop();
    setPhase("starting");
    Capture.start().then(function (c) {
      cap.current = c; levels.current = [];
      c.onLevel(function (db) { levels.current.push(db); draw(); });
      t0.current = performance.now(); setPhase("rec");
      timer.current = setInterval(function () {
        var s = (performance.now() - t0.current) / 1000; el[1](s);
        if (s >= maxSec) stop();
      }, 100);
    }).catch(function (e) {
      var code = e && (e.code || e.name);
      er[1](code === "NotAllowedError" || code === "SecurityError" || code === "PermissionDeniedError" ? "denied" :
        code === "NotFoundError" || code === "DevicesNotFoundError" ? "nomic" : code === "insecure" ? "insecure" : "unsupported");
      setPhase("error");
    });
  }
  function stop() {
    clearInterval(timer.current);
    var c = cap.current; if (!c) return; cap.current = null;
    var got = c.stop();
    setPhase("busy");
    // let the "listening" screen paint before the analysis takes the main thread
    setTimeout(function () {
      var res;
      try { res = CA.analyze(got.samples, got.rate, call.spec); likeOther(call, got, res); }
      catch (e) { res = { ok: false, problem: "error", warnings: [] }; }
      p.onResult(res, got.samples, got.rate);
    }, 60);
  }
  useEffect(function () { return function () { clearInterval(timer.current); if (cap.current) cap.current.cancel(); }; }, []);
  useEffect(function () {
    var k = function (e) { if (e.key === "Escape" && phase !== "busy") { if (cap.current) { cap.current.cancel(); cap.current = null; clearInterval(timer.current); } p.onClose(); } };
    window.addEventListener("keydown", k); return function () { window.removeEventListener("keydown", k); };
  }, [phase]);

  var sec = el[0], left = Math.max(0, maxSec - sec);
  var errText = {
    denied: "The microphone is blocked for this page. Allow it in your browser's site settings (on iPhone: Settings › Safari › Microphone), then try again.",
    nomic: "No microphone was found on this device.",
    insecure: "Phones only allow the microphone on secure (https) pages. Open the app from its https address.",
    unsupported: "This browser can't record audio. Try Safari on iPhone or Chrome on Android."
  }[er[0]];
  var close = function () { if (cap.current) { cap.current.cancel(); cap.current = null; clearInterval(timer.current); } p.onClose(); };
  var mm = function (t) { return Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0"); };
  return html`<div className="sheet" role="dialog" aria-modal="true" aria-label=${"Record your " + call.name}>
    <div className="sheet-in">
      <div className="row between">
        <span className="eyebrow">${SPECIES[call.species].name} · Record</span>
        <button className="icon-btn" aria-label="Close" onClick=${close} disabled=${phase === "busy"}><${Icon} name="close" size="22"/></button>
      </div>
      <div className="stack-s">
        <h1 style=${{ fontSize: "2.3rem" }}>${call.name}</h1>
        <p className="muted">Say it like <span className="say">${call.say}</span>. ${call.drill}</p>
      </div>
      <div ref=${wref} style=${{ height: "80px", borderTop: "1px solid var(--line)", borderBottom: "1px solid var(--line)" }}>
        ${phase === "rec" ? html`<canvas ref=${canvas} aria-hidden="true"></canvas>` : null}
      </div>
      <div style=${{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: "1.2rem", textAlign: "center" }}>
        ${phase === "ready" || phase === "starting" ? html`
          <button className="rec-btn" onClick=${start} disabled=${phase === "starting"} aria-label="Start recording"><${Icon} name="mic" size="46" w="2.2"/></button>
          <p className="muted" style=${{ maxWidth: "22rem" }}>Tap, wait a beat, then call. Arm's length from the phone, in a quiet spot. ${Math.round(maxSec)} seconds max.</p>` : null}
        ${phase === "rec" ? html`
          <div className="timer" aria-live="off"><span className="rec-dot" aria-hidden="true"></span>${mm(sec)}<span className="hero-of"> / ${mm(maxSec)}</span></div>
          <button className="rec-btn on" onClick=${stop} aria-label="Stop recording"><${Icon} name="stop" size="40"/></button>
          <p className="muted">Listening — tap to stop. Stops by itself in ${Math.ceil(left)} s.</p>` : null}
        ${phase === "busy" ? html`<div className="spinner" role="status" aria-label="Scoring"></div><p className="eyebrow" style=${{ color: "var(--ink-2)" }}>Scoring your call</p>` : null}
        ${phase === "error" ? html`<div className="card stack-s" style=${{ textAlign: "left", borderLeft: "3px solid var(--bad)" }}><h3>No microphone</h3><p>${errText}</p>
          <button className="btn btn-olive" onClick=${function () { setPhase("ready"); }}>Try again</button></div>` : null}
      </div>
    </div>
  </div>`;
}

function Home(p) {

      ${lastCall ? html`<button className="banner plain" onClick=${function () { go("/c/" + lastCall.id); }}>
        <span className="ic"><${Critter} id=${lastCall.species} size="30"/></span>
        <span className="grow"><span className="eyebrow">Pick up where you left off</span><b>${lastCall.name}</b>

var PROBLEMS = {
  quiet: { h: "I couldn't hear a call", t: "The recording was too quiet. Get closer to the phone — about an arm's length — and blow with some air behind it." },
  noisy: { h: "Too much background noise", t: "I couldn't pick your call out of the noise. Find a quieter spot (no TV, fan or wind) and try again." },
  nothing: { h: "No clear notes", t: "There was sound, but no clear notes. Wait a beat after tapping record, then blow the call with clean starts and stops." },
  short: { h: "Too short", t: "The recording stopped before anything was heard. Tap record, then call." },
  error: { h: "Something went wrong", t: "The scoring hit an error on this recording. Please try again." }
};

function bandInk(b) { return b === "good" ? "var(--good-ink)" : b === "warn" ? "var(--warn-ink)" : "var(--bad-ink)"; }

function ResultPage(p) {
  var a = p.attempt, c = a ? DATA.calls[a.call] : null;

  useEffect(function () {

    IDB.get(a.id).then(function (blob) { if (blob && live) fromWav(blob).then(function (x) { if (live) aud[1](Object.assign(x, { blob: blob })); }); });
    return function () { live = false; };
  }, [a && a.id]);
  // your call plays back as an ordinary audio file, the same way the reference clips do

      <span className="grow"><b>Play your call</b><br/><span className="small muted">${secs(audio.samples.length / audio.rate)} recorded</span></span></button>` : null;
  var recorder = rec[0] ? html`<${Recorder} call=${c} onClose=${function () { rec[1](false); }} onResult=${function (res, x, rate) { rec[1](false); p.onResult(c, res, x, rate); }}/>` : null;
  var head = html`<${TopBar} back=${"/c/" + c.id} title=${c.name}/>`;

  if (problem) {
    return html`<${R.Fragment}>${head}<div className="wrap stack">
      <section className="card stack-s" style=${{ borderLeft: "3px solid var(--warn)" }}><div className="eyebrow">No score this time</div><h2>${problem.h}</h2><p>${problem.t}</p></section>
      ${audio ? html`<section className="card stack-s">${playMine}<${SoundPicture} samples=${audio.samples} rate=${audio.rate} playId=${myId} label="Picture of your recording"/></section>` : null}
      ${again}
      ${recorder}
    </div><//>`;
  }

  var sc = a.score, b = band(sc), parts = a.parts || [];
  // attempts saved before the sound check have no `sound` flags: one plain list
  var soundParts = parts.filter(function (pt) { return pt.sound; }), shapeParts = parts.filter(function (pt) { return !pt.sound; });
  function partRow(pt) {
    var pb = partBand(pt.score);
    return html`<div key=${pt.key} className="part">
      <span className=${"st-" + pb} aria-hidden="true"><${Icon} name=${pb === "good" ? "check" : pb === "warn" ? "bang" : "cross"} size="18" w="2.6"/></span>
      <div className="lab"><b>${pt.label}</b><span className="val">${pt.value}${pt.target ? html` <span style=${{ color: "var(--ink-3)" }}>· aim ${pt.target}</span>` : null}</span></div>
      <${Meter} small=${true} value=${pt.score * 100} band=${pb} label=${pt.label + ": " + Math.round(pt.score * 100) + " out of 100"}/>
    </div>`;
  }
  var shaped = isShaped(c), mark = audio && a.span ? [a.span[0], a.span[1]] : null;
  return html`<${R.Fragment}>${head}<div className="wrap stack">
    <section className="card hero topo stack-s" aria-label="Score">
      <div className="eyebrow">${s.name} · ${c.name} · ${ago(a.at)}</div>
      <div className="row" style=${{ alignItems: "flex-end", gap: "1rem", margin: "0.35rem 0 0.25rem" }}>
        <div style=${{ whiteSpace: "nowrap" }}><span className="hero-num">${sc}</span><span className="hero-of">/100</span></div>
        <div className="grow" style=${{ paddingBottom: "0.2rem" }}><span className="verdict" style=${{ color: bandInk(b) }}>${a.verdict}</span><br/><span className="eyebrow">Pattern match</span></div>

      ${(a.warnings || []).indexOf("clipped") >= 0 ? html`<p className="small st-warn">Your recording distorted — it was too loud for the mic. Hold the phone farther away next time.</p>` : null}

    ${a.tips && a.tips.length ? html`<section className="stack-s" aria-label="What to fix">

    </section>` : html`<section className="card stack-s" style=${{ borderLeft: "3px solid var(--good)" }}><h3>Nothing to fix on this one</h3><p>Every part of the pattern is on target. Now make it sound like this every time — and practice it soft and loud.</p></section>`}
    ${a.good && a.good.length ? html`<div className="good-chips" aria-label="What you got right">${a.good.map(function (g) { return html`<span key=${g} className="chip"><${Icon} name="check" size="14" w="2.6"/> ${g}</span>`; })}</div>` : null}

/* Scores for bragging rights. An animal's score is the average of your best
   score on every call it has, untried calls counting zero, so the only way up
   is to learn all of them. The caller score averages the animals. */
function scoreBoard(attempts) {
  var best = {};
  attempts.forEach(function (a) { if (DATA.calls[a.call] && (best[a.call] === undefined || a.score > best[a.call])) best[a.call] = a.score; });
  var animals = DATA.species.map(function (s) {
    var ids = callsOf(s), tried = ids.filter(function (id) { return best[id] !== undefined; });
    var sum = ids.reduce(function (t, id) { return t + (best[id] || 0); }, 0);
    return { id: s.id, name: s.name, n: ids.length, tried: tried.length, score: ids.length ? Math.round(sum / ids.length) : 0 };
  }).filter(function (x) { return x.n; });
  var overall = animals.length ? Math.round(animals.reduce(function (t, x) { return t + x.score; }, 0) / animals.length) : 0;
  return { best: best, animals: animals, overall: overall };
}
var RANKS = [[90, "Legend"], [75, "Pro caller"], [55, "Seasoned"], [35, "Woods-wise"], [15, "Apprentice"], [0, "Greenhorn"]];
function rankOf(n) { for (var i = 0; i < RANKS.length; i++) if (n >= RANKS[i][0]) return RANKS[i][1]; return "Greenhorn"; }

function shareScores(board, flash) {
  var tried = board.animals.filter(function (x) { return x.tried; });
  var lines = ["Call of the Wild — my caller score: " + board.overall + " (" + rankOf(board.overall) + ")"];
  (tried.length ? tried : board.animals.slice(0, 4)).forEach(function (x) { lines.push(x.name + " " + x.score + " (" + x.tried + "/" + x.n + " calls)"); });
  lines.push("Think you can call better? " + location.href.split("#")[0]);
  var text = lines.join("\n");
  if (navigator.share) { navigator.share({ title: "My Call of the Wild scores", text: text }).catch(function () {}); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(function () { flash("Scores copied — paste them to a friend."); }, function () { flash("Couldn't copy on this browser."); }); return; }
  flash("Sharing isn't available on this browser.");
}

function ProgressPage(p) {
  var at = p.store.attempts;
  var byCall = {};
  at.forEach(function (a) { (byCall[a.call] = byCall[a.call] || []).push(a); });
  var ids = Object.keys(byCall).filter(function (id) { return DATA.calls[id]; }).sort(function (x, y) { return byCall[y][byCall[y].length - 1].at - byCall[x][byCall[x].length - 1].at; });
  var board = scoreBoard(at), total = board.animals.reduce(function (t, x) { return t + x.n; }, 0);
  var rank = rankOf(board.overall), next = null;
  for (var k = RANKS.length - 1; k >= 0; k--) if (RANKS[k][0] > board.overall) { next = RANKS[k]; break; }
  var animalsTried = board.animals.filter(function (x) { return x.tried; }).length;
  return html`<${R.Fragment}><${TopBar} title=${html`<h1 style=${{ font: "inherit", letterSpacing: "inherit" }}>Scores</h1>`}/><div className="wrap stack">
    <section className="card hero topo stack-s" aria-label="Caller score">
      <div className="row between"><span className="eyebrow">Caller score</span><span className="chip chip-olive">${rank}</span></div>
      <div className="row" style=${{ alignItems: "flex-end", gap: "0.9rem", margin: "0.3rem 0 0.3rem" }}>
        <div style=${{ whiteSpace: "nowrap" }}><span className="big">${board.overall}</span><span className="big-of">/100</span></div>
        <div className="grow" style=${{ paddingBottom: "0.15rem" }}><span className="rank">${rank}</span><br/>
          <span className="small muted">${next ? (next[0] - board.overall) + " points to " + next[1] : "Top rank. Keep it there."}</span></div>
      </div>
      <${Meter} seg=${true} value=${board.overall} band=${band(board.overall)} label=${"Caller score " + board.overall + " out of 100"}/>
      <div className="stats">
        <div className="stat"><span className="v">${ids.length}<span style=${{ color: "var(--ink-3)", fontSize: "0.85rem" }}>/${total}</span></span><span className="l">Calls tried</span></div>
        <div className="stat"><span className="v">${at.length}</span><span className="l">Attempts</span></div>
        <div className="stat"><span className="v">${animalsTried}<span style=${{ color: "var(--ink-3)", fontSize: "0.85rem" }}>/${board.animals.length}</span></span><span className="l">Animals</span></div>
      </div>
      <button className="btn btn-olive" style=${{ marginTop: "0.2rem" }} onClick=${function () { shareScores(board, p.flash); }}><${Icon} name="share" size="20"/> Share my scores</button>
    </section>

    <section className="stack-s" aria-label="Scores by animal">
      <div className="sec-head"><h2>By animal</h2></div>
      <div className="card list divide">
        ${board.animals.map(function (x) {
          return html`<button key=${x.id} className="tile" onClick=${function () { go("/s/" + x.id); }}>
            <span className="badge" style=${{ width: "2.7rem", height: "2.7rem" }}><${Critter} id=${x.id} size="28"/></span>
            <span className="grow stack-s" style=${{ gap: "0.35rem" }}>
              <span className="row between"><b style=${{ fontSize: "1.05rem", color: x.tried ? "var(--ink)" : "var(--ink-2)" }}>${x.name}</b><span className="num" style=${{ fontSize: "1.2rem", fontWeight: 700, color: x.tried ? "var(--ink)" : "var(--ink-3)" }}>${x.tried ? x.score : "—"}</span></span>
              <${Meter} small=${true} value=${x.score} band=${band(x.score)} label=${x.name + ": " + x.score + " out of 100"}/>
              <span className="sub">${x.tried}/${x.n} ${x.n === 1 ? "call" : "calls"} tried</span>
            </span>
          </button>`;
        })}
      </div>
      <p className="small muted">An animal's score is the average of your best score on each of its calls; calls you haven't tried count as zero. The caller score averages the animals.</p>
    </section>

    ${ids.length ? html`<section className="stack-s" aria-label="Calls you have practiced">
      <div className="sec-head"><h2>Call history</h2><span className="eyebrow">${ids.length} ${ids.length === 1 ? "call" : "calls"}</span></div>
      <div className="card list divide">
        ${ids.map(function (id) {
          var list = byCall[id], c = DATA.calls[id]; if (!c) return null;
          var scores = list.slice(-12).map(function (a) { return a.score; }), last = list[list.length - 1];
          var b = list.reduce(function (m, a) { return Math.max(m, a.score); }, 0);
          return html`<button key=${id} className="call-row" onClick=${function () { go("/c/" + id); }}>
            <span className="grow"><span className="nm" style=${{ fontSize: "1.1rem" }}>${c.name}</span><br/>
              <span className="small muted">${SPECIES[c.species].name} · ${list.length} ${list.length === 1 ? "try" : "tries"} · best ${b} · last ${last.score}, ${ago(last.at)}</span></span>

      <button className="btn btn-blaze" onClick=${function () { go("/c/duck-quack"); }}>Start with the basic quack</button></section>`}
  </div><//>`;
}

function AboutPage(p) {
  var st = p.store.settings || {}, conf = useState(false), theme = themeOf(st);
  var setTheme = function (t) { p.setSettings(Object.assign({}, st, { theme: t })); };
  var credits = Object.keys(DATA.sounds).map(function (k) { return Object.assign({ id: k }, DATA.sounds[k]); });
  return html`<${R.Fragment}><${TopBar} title=${html`<h1 style=${{ font: "inherit", letterSpacing: "inherit" }}>About</h1>`}/><div className="wrap stack">
    <header className="stack-s" style=${{ paddingTop: "0.3rem" }}>
      <div className="row" style=${{ gap: "0.7rem" }}><${Mark} size="44"/><span className="wordmark" style=${{ fontSize: "1.9rem" }}>Call <small>of the</small> Wild</span></div>
      <p className="muted">A working demo: lessons for ${Object.keys(DATA.calls).length} calls across ${DATA.species.length} kinds of game, recording, and scoring with tips.</p>
    </header>

    <section className="card stack-s"><h2>How the scoring works</h2>
      <p>Your phone splits the recording into notes and measures what a caller controls: how many notes, how long each one is, how evenly they're spaced, which way the pitch and volume move, whether each note stops clean, and the shape inside a note — a goose honk's break, a turkey yelp's drop, a bugle's climb.</p>
      <p>Those measurements are scored against the pattern each call is supposed to have. For calls that copy an animal closely — teal peeps, a bobwhite's whistle, a cow moose — the targets are measured from the real recording you can hear in the lesson. For calls that are a caller's craft, like the greeting call or a goose's honk, they come from calling instruction. The biggest misses become the tips.</p>
      <p>Every call is also checked for how it sounds, against its real recording: where its pitch sits, and whether it's a clean note, a raspy one, or just air. That part multiplies the score rather than averaging into it, so the right rhythm on the wrong sound — a whistle in a quack's rhythm, or clapping — can't score well.</p>
      <p>A total miss on any one part costs a lot: a greeting call that climbs instead of falling can't score "close." And when what you blew is clearly a different call — a goose honk in a duck lesson — the result says so. It stays quiet about close cousins (a mallard hen and a black duck hen) that even the real recordings can't tell apart.</p>
      <p className="note-box">The score is a pattern match, not a promise that a duck will land. Nobody has the data to score "would an animal answer this." And the targets are a first draft — a good caller should check them.</p>
      <p className="muted small">Only calls with a real recording to hear are listed. Some favorites — the hail and comeback calls, buck grunts, rattling — aren't here yet because no free recording of them could be found.</p>
      <p className="muted small">Everything happens on this phone. Nothing is uploaded.</p>
    </section>

    <section className="card stack-s"><h2>Recording tips</h2>
      <ul className="dots"><li>Quiet spot: no TV, fan, wind or running water.</li><li>Hold the phone about an arm's length from the call. Too close and it distorts.</li>
        <li>Tap record, wait a beat, then call. One call per recording.</li><li>Don't cover the mic (on the bottom edge of most phones).</li></ul>
    </section>

    <section className="card stack-s"><h2>Calls and the law</h2>
      <p>Practice with recordings all you want. In the field, US federal rules ban recorded or electronically amplified calls for ducks, geese and other migratory birds (50 CFR 20.21), apart from special light-goose seasons, and many states restrict electronic calls for other game. This app is a practice tool — don't play it in the field. Check your state's rules.</p>
    </section>

    <section className="card stack-s"><h2>Look</h2>
      <p className="small muted">Dark is easiest on the eyes in a blind before light. Daylight reads better in bright sun.</p>
      <div className="seg" role="group" aria-label="Theme">${[["field", "Dark"], ["day", "Daylight"], ["phone", "Match phone"]].map(function (t) {
        return html`<button key=${t[0]} aria-pressed=${theme === t[0]} onClick=${function () { setTheme(t[0]); }}>${t[1]}</button>`; })}</div>
    </section>

    <section className="stack-s"><div className="sec-head"><h2>Sounds</h2><span className="eyebrow">${credits.length} recordings</span></div>
      <p className="muted small">Real recordings, free to use with credit. Clips were trimmed, rumble-filtered and level-matched. The CC BY-NC-SA ones may not be used commercially — they would need replacing or licensing before this app is sold.</p>
      <div className="card list divide">
        ${credits.map(function (cr) { return html`<p key=${cr.id} className="credit" style=${{ padding: "0.6rem 0" }}><b>${cr.what}</b><br/>
          ${cr.by} · <a href=${cr.url} target="_blank" rel="noopener">${cr.ref}</a> · ${cr.where} · <a href=${cr.licenseUrl} target="_blank" rel="noopener">${cr.license}</a></p>`; })}
      </div>
    </section>

    <section className="card stack-s"><h2>Your data</h2>
      <p className="muted">Your scores and recordings stay on this phone, in this browser. ${p.store.attempts.length} attempts saved.</p>
      ${conf[0] ? html`<div className="row"><button className="btn btn-small btn-tint" onClick=${function () { conf[1](false); }}>Keep them</button>
        <button className="btn btn-small" style=${{ background: "var(--bad)", color: "#fff" }} onClick=${function () { p.wipe(); conf[1](false); }}><${Icon} name="trash" size="18"/> Delete everything</button></div>` :
        html`<button className="btn btn-small btn-line" style=${{ alignSelf: "flex-start" }} onClick=${function () { conf[1](true); }}>Delete my scores and recordings</button>`}
    </section>
    <p className="small muted">Working title. Built as a demo; the name is shared with a well-known hunting video game, so it may want a new one before going public.</p>
  </div><//>`;
}

function NotFound() {
  return html`<${R.Fragment}><${TopBar} back="/" title="Not found"/><div className="wrap stack"><h2>Not found</h2><p className="muted">That page doesn't exist.</p>
    <button className="btn btn-olive" onClick=${function () { go("/"); }}>Home</button></div><//>`;
}

/* ------------------------------------------------------------------ */
/* App                                                                  */
/* ------------------------------------------------------------------ */
function parseRoute() {
  var parts = (location.hash.replace(/^#\/?/, "") || "").split("/");
  return { name: parts[0] || "home", arg: parts[1] || null };
}

var memAudio = {}; // recordings from this session, ready without a trip to IndexedDB
var tmpAttempt = null;

function App() {
  var rs = useState(parseRoute()), route = rs[0];
  var ss = useState(loadStore), store = ss[0], setStore = ss[1];
  var toast = useState(null);
  useEffect(function () {
    var f = function () { rs[1](parseRoute()); Player.stop(); window.scrollTo(0, 0); };
    window.addEventListener("hashchange", f); return function () { window.removeEventListener("hashchange", f); };
  }, []);
  useEffect(function () {
    document.documentElement.setAttribute("data-theme", themeOf(store.settings));
    // the phone's status bar takes the page's own background
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", css("--bg") || "#0E100D");
    bumpTheme();
  }, [store.settings && store.settings.theme]);
  var update = function (fn) { setStore(function (s) { var n = fn(s); saveStore(n); return n; }); };
  var flash = function (msg) { toast[1](msg); setTimeout(function () { toast[1](null); }, 2600); };

  function onResult(call, res, x, rate) {
    if (!res.ok) {
      tmpAttempt = { id: "tmp", call: call.id, at: Date.now(), problem: res.problem || "error" };
      memAudio.tmp = { samples: x, rate: rate, blob: toWav(x, rate) };
      if (location.hash === "#/r/tmp") rs[1]({ name: "r", arg: "tmp", k: Date.now() }); else go("/r/tmp");
      return;
    }
    var id = "a" + Date.now().toString(36);
    var span = res.groups && res.groups[res.best] ? [res.groups[res.best].t0, res.groups[res.best].t1] : null;
    var a = {
      id: id, call: call.id, at: Date.now(), score: res.score, verdict: res.verdict,
      parts: res.parts.map(function (q) { return { key: q.key, label: q.label, score: Math.round(q.score * 100) / 100, value: q.value, target: q.target, sound: !!q.sound }; }),
      // pitch paths are only drawn for calls whose shape is scored; dropping the rest keeps history small
      tips: res.tips, good: res.good, groups: res.groups.length, span: span, warnings: res.warnings,
      view: res.view.map(function (q) { return isShaped(call) ? q : { t: q.t, d: q.d, lev: q.lev, path: null }; }),
      dur: x.length / rate, likeOther: res.likeOther || null
    };
    var wav = toWav(x, rate);
    memAudio[id] = { samples: x, rate: rate, blob: wav };
    IDB.put(id, wav);
    update(function (s) {
      var attempts = s.attempts.concat([a]);
      // keep recordings for the last 6 tries of each call plus its best; the scores themselves are kept regardless
      var mine = attempts.filter(function (q) { return q.call === call.id && q.audio !== false; });
      var bestA = mine.reduce(function (b, q) { return !b || q.score > b.score ? q : b; }, null);
      mine.slice(0, -6).forEach(function (q) { if (q !== bestA) { q.audio = false; IDB.del(q.id); delete memAudio[q.id]; } });
      if (attempts.length > 400) attempts.slice(0, attempts.length - 400).forEach(function (q) { IDB.del(q.id); });
      if (attempts.length > 400) attempts = attempts.slice(-400);
      return Object.assign({}, s, { attempts: attempts });
    });
    go("/r/" + id);
  }

  var page;
  if (route.name === "home") page = html`<${Home} store=${store} setIntro=${function () { update(function (s) { return Object.assign({}, s, { intro: true }); }); }}/>`;
  else if (route.name === "s") page = html`<${SpeciesPage} key=${route.arg} id=${route.arg} store=${store}/>`;
  else if (route.name === "c") page = html`<${CallPage} key=${route.arg} id=${route.arg} store=${store} onResult=${onResult}/>`;
  else if (route.name === "r") {
    var att = route.arg === "tmp" ? tmpAttempt : store.attempts.filter(function (q) { return q.id === route.arg; })[0];
    page = html`<${ResultPage} key=${route.arg + (route.k || "")} attempt=${att} audio=${memAudio[route.arg]} onResult=${onResult}/>`;
  }
  else if (route.name === "progress") page = html`<${ProgressPage} store=${store} flash=${flash}/>`;
  else if (route.name === "about") page = html`<${AboutPage} store=${store}
      setSettings=${function (st) { update(function (s) { return Object.assign({}, s, { settings: st }); }); }}
      wipe=${function () { IDB.clear(); memAudio = {}; update(function (s) { return Object.assign({}, s, { attempts: [] }); }); flash("Deleted."); }}/>`;
  else page = html`<${NotFound}/>`;

  var tab = route.name === "progress" ? "progress" : route.name === "about" ? "about" : "learn";
  var tabs = [["learn", "Calls", "/", "calls"], ["progress", "Scores", "/progress", "scores"], ["about", "About", "/about", "info"]];
  return html`<${R.Fragment}>
    <main>${page}</main>
    <div className="tabs"><nav aria-label="Main">${tabs.map(function (t) {
      return html`<button key=${t[0]} aria-current=${tab === t[0] ? "page" : null} onClick=${function () { go(t[2]); }}><${Icon} name=${t[3]} size="24"/>${t[1]}</button>`;
    })}</nav></div>
    ${toast[0] ? html`<div className="toast" role="status">${toast[0]}</div>` : null}
  <//>`;
}

window.CallWildDebug = { Player: Player };
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
})();
</script>
</body>
</html>
