<!doctype html>
<html lang="en">

<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Call Wild"/>

<meta name="theme-color" content="#11140E" media="(prefers-color-scheme: dark)"/>
<meta name="description" content="Learn duck, goose, turkey, elk, deer and predator calls. Record yourself and get scored, with tips."/>
<title>Call of the Wild</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>

<style>
  /* Layout: one phone-width column (max 34rem) that scrolls above a fixed
     three-tab bar. The recorder takes the whole screen. Field colours: bone,
     moss and blaze orange in light; the same steps, darkened, for dawn in a
     blind. Data on the charts is one validated blue (your call) against a
     gray ghost (the target). */
  :root {
    --bg: #F3F0E6;
    --surface: #FFFDF8;
    --tint: #ECE8DB;
    --ink: #1C2117;
    --ink-2: #4F5647;
    --ink-3: #676D5D;
    --line: #DAD4C3;
    --moss: #3B5530;
    --on-moss: #FBF9F2;
    --blaze: #C2410C;
    --on-blaze: #FFFFFF;
    --data: #2a78d6;
    --data-soft: rgba(42, 120, 214, 0.14);
    --ghost: #C9C3B2;
    --spec-hi: #0d366b;
    --good: #0ca30c; --warn: #fab219; --bad: #d03b3b;
    --good-ink: #1E6E1E; --warn-ink: #855600; --bad-ink: #A8251F;
    --shade: rgba(16, 20, 12, 0.5);
    --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11140E; --surface: #1A1F16; --tint: #252C20; --ink: #ECE9DD; --ink-2: #B4B9A8; --ink-3: #959B8A; --line: #313A2A;
      --moss: #A3C47F; --on-moss: #10150B; --blaze: #FF7B36; --on-blaze: #1A0A00;
      --data: #3987e5; --data-soft: rgba(57, 135, 229, 0.2); --ghost: #4A5242; --spec-hi: #cde2fb;
      --good-ink: #6ED46E; --warn-ink: #FAB219; --bad-ink: #FF8C84; --shade: rgba(0, 0, 0, 0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11140E; --surface: #1A1F16; --tint: #252C20; --ink: #ECE9DD; --ink-2: #B4B9A8; --ink-3: #959B8A; --line: #313A2A;
    --moss: #A3C47F; --on-moss: #10150B; --blaze: #FF7B36; --on-blaze: #1A0A00;
    --data: #3987e5; --data-soft: rgba(57, 135, 229, 0.2); --ghost: #4A5242; --spec-hi: #cde2fb;
    --good-ink: #6ED46E; --warn-ink: #FAB219; --bad-ink: #FF8C84; --shade: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16.5px; -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.45; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--blaze); outline-offset: 2px; border-radius: 6px; }
  .boot { min-height: 80vh; display: grid; place-items: center; color: var(--ink-2); }

  h1, h2, h3 { margin: 0; font-family: var(--display); line-height: 1.05; letter-spacing: 0.005em; text-wrap: balance; }
  h1 { font-size: 2.3rem; font-weight: 800; text-transform: uppercase; }
  h2 { font-size: 1.6rem; font-weight: 700; }
  h3 { font-size: 1.2rem; font-weight: 700; }
  p { margin: 0; }
  .muted { color: var(--ink-2); }
  .small { font-size: 0.9rem; }
  .eyebrow { font-family: var(--display); font-size: 0.85rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
  .stack { display: flex; flex-direction: column; gap: 1rem; }
  .stack-s { display: flex; flex-direction: column; gap: 0.55rem; }
  .row { display: flex; align-items: center; gap: 0.7rem; }
  .row-top { display: flex; align-items: flex-start; gap: 0.7rem; }
  .grow { flex: 1; min-width: 0; }
  .wrap { max-width: 34rem; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 1rem) 16px 7rem; }

  /* Buttons */
  .btn { display: flex; align-items: center; justify-content: center; gap: 0.55rem; width: 100%; min-height: 3.3rem; border: 0;
    border-radius: 14px; padding: 0.7rem 1.1rem; font-weight: 700; font-size: 1.08rem; text-decoration: none; }
  .btn svg { flex: none; }
  .btn-moss { background: var(--moss); color: var(--on-moss); }
  .btn-blaze { background: var(--blaze); color: var(--on-blaze); }
  .btn-tint { background: var(--tint); color: var(--ink); }
  .btn-line { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-small { min-height: 2.6rem; font-size: 0.98rem; border-radius: 12px; width: auto; padding: 0.45rem 0.9rem; }
  .icon-btn { width: 2.75rem; height: 2.75rem; flex: none; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--tint); color: var(--ink); }
  .link { background: none; border: 0; padding: 0.3rem 0; color: var(--moss); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .back { display: inline-flex; align-items: center; gap: 0.25rem; background: none; border: 0; padding: 0.4rem 0.2rem 0.4rem 0; color: var(--ink-2); font-weight: 600; }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 1rem; }
  .card-tight { padding: 0.75rem 0.9rem; }
  .divide > * + * { border-top: 1px solid var(--line); }

  /* Chips & pills */
  .chip { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.82rem; font-weight: 700;
    background: var(--tint); color: var(--ink-2); white-space: nowrap; }
  .chip-l1 { background: color-mix(in srgb, var(--moss) 16%, transparent); color: var(--ink); }
  .chip-l3, .chip-l4 { background: color-mix(in srgb, var(--blaze) 14%, transparent); color: var(--ink); }
  .score-pill { min-width: 2.6rem; text-align: center; padding: 0.2rem 0.5rem; border-radius: 10px; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--tint); }

  /* Masthead */
  .mast { position: relative; padding: 0.4rem 0 0.2rem; }
  .mast h1 { font-size: 2.6rem; letter-spacing: 0.01em; }
  .mast .rule { height: 3px; width: 3.2rem; background: var(--blaze); border-radius: 2px; margin: 0.6rem 0 0.7rem; }
  .contours { position: absolute; right: -8px; top: -6px; width: 150px; height: 120px; color: var(--line); pointer-events: none; }

  /* Species grid */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
  .tile { display: flex; flex-direction: column; align-items: flex-start; gap: 0.5rem; text-align: left; background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; padding: 0.85rem; color: var(--ink); min-height: 8.6rem; }
  .tile .badge { width: 3.1rem; height: 3.1rem; border-radius: 14px; display: grid; place-items: center; background: var(--tint); color: var(--moss); }
  .tile b { font-family: var(--display); font-size: 1.3rem; font-weight: 700; line-height: 1; }
  .tile span { font-size: 0.86rem; color: var(--ink-2); line-height: 1.3; }

  /* Call list */
  .call-row { display: flex; align-items: center; gap: 0.8rem; width: 100%; text-align: left; background: none; border: 0; padding: 0.85rem 0.1rem; color: var(--ink); }
  .call-row .nm { font-weight: 700; font-size: 1.08rem; }
  .chev { color: var(--ink-3); flex: none; }

  /* Lesson */
  ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 0.7rem; }
  ol.steps li { counter-increment: s; display: grid; grid-template-columns: 1.9rem 1fr; gap: 0.55rem; align-items: start; }
  ol.steps li::before { content: counter(s); font-family: var(--display); font-weight: 800; font-size: 1.05rem; width: 1.9rem; height: 1.9rem; border-radius: 50%;
    display: grid; place-items: center; background: var(--tint); color: var(--moss); }
  ul.dots { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 0.4rem; }
  .say { font-family: var(--display); font-weight: 700; font-size: 1.15rem; letter-spacing: 0.02em; color: var(--blaze); }
  .note-box { border-left: 3px solid var(--moss); padding: 0.1rem 0 0.1rem 0.8rem; }
  .sticky-cta { position: fixed; left: 0; right: 0; bottom: calc(4.1rem + env(safe-area-inset-bottom, 0px)); padding: 0.6rem 16px; z-index: 5;
    background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .sticky-cta > div { max-width: 34rem; margin: 0 auto; }

  /* Players */
  .play { display: flex; align-items: center; gap: 0.75rem; width: 100%; text-align: left; background: none; border: 0; padding: 0.35rem 0; color: var(--ink); }
  .play .disc { width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--moss); color: var(--on-moss); }
  .play.ghosty .disc { background: var(--tint); color: var(--ink); }

  /* Charts */
  .chart { position: relative; }
  .chart svg, .chart canvas { display: block; width: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 0.9rem; font-size: 0.85rem; color: var(--ink-2); }
  .legend i { display: inline-block; vertical-align: middle; margin-right: 0.35rem; border-radius: 3px; }
  .readout { min-height: 1.3rem; font-size: 0.85rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .scale { display: flex; align-items: center; gap: 0.45rem; font-size: 0.78rem; color: var(--ink-3); justify-content: flex-end; }
  .scale i { width: 3.5rem; height: 0.5rem; border-radius: 4px; background: linear-gradient(to right, var(--surface), var(--spec-hi)); border: 1px solid var(--line); }
  table.notes { width: 100%; border-collapse: collapse; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  table.notes th, table.notes td { text-align: left; padding: 0.35rem 0.3rem; border-bottom: 1px solid var(--line); }
  table.notes th { color: var(--ink-2); font-weight: 600; }
  details > summary { cursor: pointer; color: var(--ink-2); font-weight: 600; font-size: 0.92rem; }

  /* Score */
  .hero-num { font-family: var(--body); font-size: 4.2rem; font-weight: 600; line-height: 0.9; letter-spacing: -0.02em; }
  .hero-of { font-size: 1.1rem; color: var(--ink-3); font-weight: 600; }
  .meter { height: 8px; border-radius: 999px; background: var(--tint); overflow: hidden; }
  .meter > i { display: block; height: 100%; border-radius: 999px; }
  .meter-s { height: 6px; }
  .part { display: grid; grid-template-columns: 1.4rem 1fr; gap: 0.25rem 0.55rem; align-items: center; padding: 0.55rem 0; }
  .part .lab { display: flex; justify-content: space-between; gap: 0.6rem; font-size: 0.95rem; }
  .part .lab b { font-weight: 600; }
  .part .val { color: var(--ink-2); font-size: 0.86rem; text-align: right; font-variant-numeric: tabular-nums; }
  .part .meter { grid-column: 2; }
  .st-good { color: var(--good-ink); } .st-warn { color: var(--warn-ink); } .st-bad { color: var(--bad-ink); }
  .tip { display: grid; grid-template-columns: 2rem 1fr; gap: 0.6rem; align-items: start; }
  .tip .n { width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; background: var(--blaze); color: var(--on-blaze); }
  .good-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .good-chips .chip { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--ink); }

  /* Stat tiles */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 0.7rem 0.75rem; }
  .stat .v { font-size: 1.9rem; font-weight: 600; line-height: 1; margin-top: 0.25rem; }
  .stat .l { font-size: 0.8rem; color: var(--ink-2); }

  /* Tab bar */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tabs nav { max-width: 34rem; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
  .tabs button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 0.15rem; padding: 0.55rem 0 0.5rem;
    font-size: 0.78rem; font-weight: 700; color: var(--ink-3); letter-spacing: 0.02em; }
  .tabs button[aria-current="page"] { color: var(--moss); }

  /* Recorder */
  .sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; overflow-y: auto; }
  .sheet-in { max-width: 34rem; width: 100%; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 0.8rem) 16px calc(env(safe-area-inset-bottom, 0px) + 1.2rem);
    flex: 1; display: flex; flex-direction: column; gap: 1rem; }
  .rec-btn { width: 7.2rem; height: 7.2rem; border-radius: 50%; border: 0; background: var(--blaze); color: var(--on-blaze); display: grid; place-items: center;
    box-shadow: 0 0 0 8px color-mix(in srgb, var(--blaze) 18%, transparent); }
  .rec-btn.on { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 16px color-mix(in srgb, var(--blaze) 10%, transparent); } }
  .timer { font-size: 2.6rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .spinner { width: 2.4rem; height: 2.4rem; border-radius: 50%; border: 4px solid var(--tint); border-top-color: var(--moss); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .rec-btn.on, .spinner { animation: none; } }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(5.2rem + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg);
    padding: 0.6rem 1rem; border-radius: 12px; font-weight: 600; font-size: 0.95rem; max-width: calc(100% - 32px); }
  .seg { display: inline-flex; background: var(--tint); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; padding: 0.45rem 0.9rem; border-radius: 9px; font-weight: 700; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
  .credit { font-size: 0.86rem; color: var(--ink-2); }
  .credit b { color: var(--ink); font-weight: 600; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

var PROBLEMS = {
  quiet: { h: "I couldn't hear a call", t: "The recording was too quiet. Get closer to the phone — about an arm's length — and blow with some air behind it." },
  noisy: { h: "Too much background noise", t: "I couldn't pick your call out of the noise. Find a quieter spot (no TV, fan or wind) and try again." },
  nothing: { h: "No clear notes", t: "There was sound, but no clear notes. Wait a beat after tapping record, then blow the call with clean starts and stops." },
  short: { h: "Too short", t: "The recording stopped before anything was heard. Tap record, then call." },

function ResultPage(p) {
  var a = p.attempt, c = a ? DATA.calls[a.call] : null;

    if (audio || !a || !a.id || a.id === "tmp" || a.audio === false) return;
    var live = true;
    IDB.get(a.id).then(function (blob) { if (blob && live) fromWav(blob).then(function (x) { if (live) aud[1](Object.assign(x, { blob: blob })); }); });
    return function () { live = false; };
  }, [a && a.id]);
  // your call plays back as an ordinary audio file, the same way the reference clips do
  var audioUrl = useMemo(function () { return audio ? URL.createObjectURL(audio.blob || toWav(audio.samples, audio.rate)) : null; }, [audio]);
  useEffect(function () { return function () { if (audioUrl) URL.revokeObjectURL(audioUrl); }; }, [audioUrl]);

  if (!a || !c) return html`<${NotFound}/>`;

      <span className="grow"><b>Play your call</b><br/><span className="small muted">${secs(audio.samples.length / audio.rate)} recorded</span></span></button>` : null;
  var recorder = rec[0] ? html`<${Recorder} call=${c} onClose=${function () { rec[1](false); }} onResult=${function (res, x, rate) { rec[1](false); p.onResult(c, res, x, rate); }}/>` : null;

  if (problem) {
    return html`<div className="wrap stack">
      <div><button className="back" onClick=${function () { go("/c/" + c.id); }}><${Icon} name="back" size="20"/> ${c.name}</button></div>
      <section className="card stack-s"><div className="eyebrow">No score this time</div><h2>${problem.h}</h2><p>${problem.t}</p></section>
      ${audio ? html`<section className="card stack-s">${playMine}<${SoundPicture} samples=${audio.samples} rate=${audio.rate} playId=${myId} label="Picture of your recording"/></section>` : null}
      ${again}
      ${recorder}

  }

  var sc = a.score, b = band(sc), parts = a.parts || [];
  // attempts saved before the sound check have no `sound` flags: one plain list

  function partRow(pt) {

    return html`<div key=${pt.key} className="part">

      <div className="lab"><b>${pt.label}</b><span className="val">${pt.value}${pt.target ? html` <span style=${{ color: "var(--ink-3)" }}>· aim ${pt.target}</span>` : null}</span></div>
      <${Meter} small=${true} value=${pt.score * 100} band=${pb} label=${pt.label + ": " + Math.round(pt.score * 100) + " out of 100"}/>
    </div>`;
  }

  return html`<div className="wrap stack">
    <div><button className="back" onClick=${function () { go("/c/" + c.id); }}><${Icon} name="back" size="20"/> ${c.name}</button></div>
    <section className="card stack-s" aria-label="Score">
      <div className="eyebrow">${s.name} · ${c.name} · ${ago(a.at)}</div>
      <div className="row" style=${{ alignItems: "flex-end", gap: "0.9rem" }}>
        <div><span className="hero-num">${sc}</span><span className="hero-of"> /100</span></div>

      </div>
      <${Meter} value=${sc} band=${b} label=${"Score " + sc + " out of 100"}/>
      ${a.groups > 1 ? html`<p className="small muted">You blew ${a.groups} separate calls; this scores the best one (marked in orange on the picture below).</p>` : null}
      ${a.likeOther && DATA.calls[a.likeOther.id] ? html`<div className="note-box stack-s" style=${{ borderColor: "var(--blaze)" }}>
        <p><b>That sounded more like ${otherName(c, a.likeOther.id)}</b> (it would score ${a.likeOther.score} as that). This lesson is the ${c.name.toLowerCase()}: ${c.what.charAt(0).toLowerCase() + c.what.slice(1)}</p>
        <button className="link" style=${{ alignSelf: "flex-start" }} onClick=${function () { go("/c/" + a.likeOther.id); }}>Open that lesson</button></div>` : null}

    ${a.tips && a.tips.length ? html`<section className="stack-s" aria-label="What to fix">

    </section>` : html`<section className="card stack-s"><h3>Nothing to fix on this one</h3><p>Every part of the pattern is on target. Now make it sound like this every time — and practice it soft and loud.</p></section>`}

/* Scores for bragging rights. An animal's score is the average of your best
   score on every call it has, untried calls counting zero, so the only way up
   is to learn all of them. The caller score averages the animals. */
function scoreBoard(attempts) {
  var best = {};
  attempts.forEach(function (a) { if (DATA.calls[a.call] && (best[a.call] === undefined || a.score > best[a.call])) best[a.call] = a.score; });
  var animals = DATA.species.map(function (s) {
    var ids = callsOf(s), tried = ids.filter(function (id) { return best[id] !== undefined; });
    var sum = ids.reduce(function (t, id) { return t + (best[id] || 0); }, 0);
    return { id: s.id, name: s.name, n: ids.length, tried: tried.length, score: ids.length ? Math.round(sum / ids.length) : 0 };
  }).filter(function (x) { return x.n; });
  var overall = animals.length ? Math.round(animals.reduce(function (t, x) { return t + x.score; }, 0) / animals.length) : 0;
  return { best: best, animals: animals, overall: overall };
}
var RANKS = [[90, "Legend"], [75, "Pro caller"], [55, "Seasoned"], [35, "Woods-wise"], [15, "Apprentice"], [0, "Greenhorn"]];
function rankOf(n) { for (var i = 0; i < RANKS.length; i++) if (n >= RANKS[i][0]) return RANKS[i][1]; return "Greenhorn"; }

function shareScores(board, flash) {
  var tried = board.animals.filter(function (x) { return x.tried; });
  var lines = ["Call of the Wild — my caller score: " + board.overall + " (" + rankOf(board.overall) + ")"];
  (tried.length ? tried : board.animals.slice(0, 4)).forEach(function (x) { lines.push(x.name + " " + x.score + " (" + x.tried + "/" + x.n + " calls)"); });
  lines.push("Think you can call better? " + location.href.split("#")[0]);
  var text = lines.join("\n");
  if (navigator.share) { navigator.share({ title: "My Call of the Wild scores", text: text }).catch(function () {}); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(function () { flash("Scores copied — paste them to a friend."); }, function () { flash("Couldn't copy on this browser."); }); return; }
  flash("Sharing isn't available on this browser.");
}

function ProgressPage(p) {

          </button>`;
        })}

      <p className="small muted">An animal's score is the average of your best score on each of its calls; calls you haven't tried count as zero. The caller score averages the animals.</p>
    </section>
    ${ids.length ? html`<section className="card divide" style=${{ padding: "0.1rem 0.9rem" }} aria-label="Calls you have practiced">
      ${ids.map(function (id) {
        var list = byCall[id], c = DATA.calls[id]; if (!c) return null;

      })}
    </section>
    <p className="small muted">Each line is your last 12 scores on that call; the faint rule marks 70.</p>` : html`<section className="card stack-s"><h3>Nothing yet</h3><p>Record a call and your scores will show up here.</p>
      <button className="btn btn-moss" onClick=${function () { go("/c/duck-quack"); }}>Start with the basic quack</button></section>`}
  </div>`;
}

function AboutPage(p) {
  var st = p.store.settings || {}, conf = useState(false);
  var setTheme = function (t) { p.setSettings(Object.assign({}, st, { theme: t })); };
  var credits = Object.keys(DATA.sounds).map(function (k) { return Object.assign({ id: k }, DATA.sounds[k]); });
  return html`<div className="wrap stack">
    <header className="stack-s"><div className="eyebrow">About</div><h1 style=${{ fontSize: "2.2rem" }}>Call of the Wild</h1>
      <p className="muted">A first working demo: lessons for ${Object.keys(DATA.calls).length} calls across ${DATA.species.length} kinds of game, recording, and scoring with tips.</p></header>

    <section className="stack-s"><h2>How the scoring works</h2>
      <p>Your phone splits the recording into notes and measures what a caller controls: how many notes, how long each one is, how evenly they're spaced, which way the pitch and volume move, whether each note stops clean, and the shape inside a note — a goose honk's break, a turkey yelp's drop, a bugle's climb.</p>
      <p>Those measurements are scored against the pattern each call is supposed to have. For calls that copy an animal closely — teal peeps, a bobwhite's whistle, a cow moose — the targets are measured from the real recording you can hear in the lesson. For calls that are a caller's craft, like the greeting call or a goose's honk, they come from calling instruction. The biggest misses become the tips.</p>
      <p>Every call is also checked for how it sounds, against its real recording: where its pitch sits, and whether it's a clean note, a raspy one, or just air. That part multiplies the score rather than averaging into it, so the right rhythm on the wrong sound — a whistle in a quack's rhythm, or clapping — can't score well.</p>
      <p>A total miss on any one part costs a lot: a greeting call that climbs instead of falling can't score "close." And when what you blew is clearly a different call — a goose honk in a duck lesson — the result says so. It stays quiet about close cousins (a mallard hen and a black duck hen) that even the real recordings can't tell apart.</p>
      <p className="note-box">The score is a pattern match, not a promise that a duck will land. Nobody has the data to score "would an animal answer this." And the targets are a first draft — a good caller should check them.</p>
      <p className="muted small">Only calls with a real recording to hear are listed. Some favorites — the hail and comeback calls, buck grunts, rattling — aren't here yet because no free recording of them could be found.</p>
      <p className="muted small">Everything happens on this phone. Nothing is uploaded.</p>
    </section>

    <section className="stack-s"><h2>Recording tips</h2>
      <ul className="dots"><li>Quiet room: no TV, fan, or running water.</li><li>Hold the phone about an arm's length from the call. Too close and it distorts.</li>
        <li>Tap record, wait a beat, then call. One call per recording.</li><li>Don't cover the mic (on the bottom edge of most phones).</li></ul>
    </section>

    <section className="stack-s"><h2>Calls and the law</h2>
      <p>Practice with recordings all you want. In the field, US federal rules ban recorded or electronically amplified calls for ducks, geese and other migratory birds (50 CFR 20.21), apart from special light-goose seasons, and many states restrict electronic calls for other game. This app is a practice tool — don't play it in the field. Check your state's rules.</p>
    </section>

    <section className="stack-s"><h2>Look</h2>
      <div className="seg" role="group" aria-label="Theme">${["auto", "light", "dark"].map(function (t) {
        return html`<button key=${t} aria-pressed=${(st.theme || "auto") === t} onClick=${function () { setTheme(t); }}>${t === "auto" ? "Match phone" : t === "light" ? "Light" : "Dark"}</button>`; })}</div>
    </section>

    <section className="stack-s"><h2>Sounds</h2>
      <p className="muted small">Real recordings, free to use with credit. Clips were trimmed, rumble-filtered and level-matched. The CC BY-NC-SA ones may not be used commercially — they would need replacing or licensing before this app is sold.</p>
      <div className="card divide" style=${{ padding: "0.2rem 0.9rem" }}>
        ${credits.map(function (cr) { return html`<p key=${cr.id} className="credit" style=${{ padding: "0.6rem 0" }}><b>${cr.what}</b><br/>
          ${cr.by} · <a href=${cr.url} target="_blank" rel="noopener">${cr.ref}</a> · ${cr.where} · <a href=${cr.licenseUrl} target="_blank" rel="noopener">${cr.license}</a></p>`; })}
      </div>
    </section>

    <section className="stack-s"><h2>Your data</h2>
      <p className="muted">Your scores and recordings stay on this phone, in this browser. ${p.store.attempts.length} attempts saved.</p>
      ${conf[0] ? html`<div className="row"><button className="btn btn-small btn-tint" onClick=${function () { conf[1](false); }}>Keep them</button>
        <button className="btn btn-small" style=${{ background: "var(--bad)", color: "#fff" }} onClick=${function () { p.wipe(); conf[1](false); }}><${Icon} name="trash" size="18"/> Delete everything</button></div>` :
        html`<button className="btn btn-small btn-line" style=${{ alignSelf: "flex-start" }} onClick=${function () { conf[1](true); }}>Delete my scores and recordings</button>`}
    </section>
    <p className="small muted">Working title. Built as a demo; the name is shared with a well-known hunting video game, so it may want a new one before going public.</p>
  </div>`;
}

function NotFound() {
  return html`<div className="wrap stack"><h2>Not found</h2><p className="muted">That page doesn't exist.</p><button className="btn btn-moss" onClick=${function () { go("/"); }}>Home</button></div>`;
}

/* ------------------------------------------------------------------ */
/* App                                                                  */
/* ------------------------------------------------------------------ */
function parseRoute() {
  var parts = (location.hash.replace(/^#\/?/, "") || "").split("/");
  return { name: parts[0] || "home", arg: parts[1] || null };
}

var memAudio = {}; // recordings from this session, ready without a trip to IndexedDB
var tmpAttempt = null;

function App() {
  var rs = useState(parseRoute()), route = rs[0];
  var ss = useState(loadStore), store = ss[0], setStore = ss[1];
  var toast = useState(null);
  useEffect(function () {
    var f = function () { rs[1](parseRoute()); Player.stop(); window.scrollTo(0, 0); };
    window.addEventListener("hashchange", f); return function () { window.removeEventListener("hashchange", f); };
  }, []);
  useEffect(function () {
    var t = (store.settings || {}).theme || "auto", el = document.documentElement;
    if (t === "auto") el.removeAttribute("data-theme"); else el.setAttribute("data-theme", t);
    bumpTheme();
  }, [store.settings && store.settings.theme]);
  var update = function (fn) { setStore(function (s) { var n = fn(s); saveStore(n); return n; }); };
  var flash = function (msg) { toast[1](msg); setTimeout(function () { toast[1](null); }, 2600); };

  function onResult(call, res, x, rate) {
    if (!res.ok) {
      tmpAttempt = { id: "tmp", call: call.id, at: Date.now(), problem: res.problem || "error" };
      memAudio.tmp = { samples: x, rate: rate, blob: toWav(x, rate) };
      if (location.hash === "#/r/tmp") rs[1]({ name: "r", arg: "tmp", k: Date.now() }); else go("/r/tmp");
      return;
    }
    var id = "a" + Date.now().toString(36);
    var span = res.groups && res.groups[res.best] ? [res.groups[res.best].t0, res.groups[res.best].t1] : null;
    var a = {
      id: id, call: call.id, at: Date.now(), score: res.score, verdict: res.verdict,
      parts: res.parts.map(function (q) { return { key: q.key, label: q.label, score: Math.round(q.score * 100) / 100, value: q.value, target: q.target, sound: !!q.sound }; }),
      // pitch paths are only drawn for calls whose shape is scored; dropping the rest keeps history small
      tips: res.tips, good: res.good, groups: res.groups.length, span: span, warnings: res.warnings,
      view: res.view.map(function (q) { return isShaped(call) ? q : { t: q.t, d: q.d, lev: q.lev, path: null }; }),
      dur: x.length / rate, likeOther: res.likeOther || null
    };
    var wav = toWav(x, rate);
    memAudio[id] = { samples: x, rate: rate, blob: wav };
    IDB.put(id, wav);
    update(function (s) {
      var attempts = s.attempts.concat([a]);
      // keep recordings for the last 6 tries of each call plus its best; the scores themselves are kept regardless
      var mine = attempts.filter(function (q) { return q.call === call.id && q.audio !== false; });
      var bestA = mine.reduce(function (b, q) { return !b || q.score > b.score ? q : b; }, null);
      mine.slice(0, -6).forEach(function (q) { if (q !== bestA) { q.audio = false; IDB.del(q.id); delete memAudio[q.id]; } });
      if (attempts.length > 400) attempts.slice(0, attempts.length - 400).forEach(function (q) { IDB.del(q.id); });
      if (attempts.length > 400) attempts = attempts.slice(-400);
      return Object.assign({}, s, { attempts: attempts });
    });
    go("/r/" + id);
  }

  var page;
  if (route.name === "home") page = html`<${Home} store=${store} setIntro=${function () { update(function (s) { return Object.assign({}, s, { intro: true }); }); }}/>`;
  else if (route.name === "s") page = html`<${SpeciesPage} key=${route.arg} id=${route.arg} store=${store}/>`;
  else if (route.name === "c") page = html`<${CallPage} key=${route.arg} id=${route.arg} store=${store} onResult=${onResult}/>`;
  else if (route.name === "r") {
    var att = route.arg === "tmp" ? tmpAttempt : store.attempts.filter(function (q) { return q.id === route.arg; })[0];
    page = html`<${ResultPage} key=${route.arg + (route.k || "")} attempt=${att} audio=${memAudio[route.arg]} onResult=${onResult}/>`;
  }
  else if (route.name === "progress") page = html`<${ProgressPage} store=${store} flash=${flash}/>`;
  else if (route.name === "about") page = html`<${AboutPage} store=${store}
      setSettings=${function (st) { update(function (s) { return Object.assign({}, s, { settings: st }); }); }}
      wipe=${function () { IDB.clear(); memAudio = {}; update(function (s) { return Object.assign({}, s, { attempts: [] }); }); flash("Deleted."); }}/>`;
  else page = html`<${NotFound}/>`;

  var tab = route.name === "progress" ? "progress" : route.name === "about" ? "about" : "learn";
  var tabs = [["learn", "Learn", "/"], ["progress", "Progress", "/progress"], ["about", "About", "/about"]];
  return html`<${R.Fragment}>
    <main>${page}</main>
    <div className="tabs"><nav aria-label="Main">${tabs.map(function (t) {
      return html`<button key=${t[0]} aria-current=${tab === t[0] ? "page" : null} onClick=${function () { go(t[2]); }}><${Icon} name=${t[0]} size="24"/>${t[1]}</button>`;
    })}</nav></div>
    ${toast[0] ? html`<div className="toast" role="status">${toast[0]}</div>` : null}
  <//>`;
}

window.CallWildDebug = { Player: Player };
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
})();
</script>
</body>
</html>
